## \uC790\uC8FC \uBB3B\uB294 \uC9C8\uBB38

- **\uC9C8\uBB38:** \uD68C\uC0AC \uBB38\uC11C\uAC00 \uBC16\uC73C\uB85C \uB098\uAC00\uB098\uC694?
- **\uB2F5:** \uD654\uBA74\uB9CC \uC4F8 \uB54C\uB294 \uC544\uBB34\uAC83\uB3C4 \uB098\uAC00\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4(\uC774 \uD30C\uC77C\uC740 \uBC14\uAE65 \uC5F0\uACB0\uC744 \uB9C9\uC544 \uB461\uB2C8\uB2E4). Claude \uC5D0\uAC8C \uB9E1\uAE30\uBA74 \uADF8 \uC77C\uC5D0 \uD544\uC694\uD55C \uAE00\uACFC Claude \uAC00 \uBB38\uC11C \uD3F4\uB354\uC5D0\uC11C \uC77D\uC740 \uB0B4\uC6A9\uC774 \uB0B4 Claude \uACC4\uC815\uC73C\uB85C Claude \uC5D0\uAC8C \uAC11\uB2C8\uB2E4. \uD68C\uC0AC \uBB38\uC11C\uB77C\uBA74 \uC0AC\uB0B4 AI \uC0AC\uC6A9 \uAE30\uC900\uC744 \uBA3C\uC800 \uD655\uC778\uD558\uC138\uC694.
- **\uC9C8\uBB38:** \uC9C4\uC9DC Claude \uB97C \uC4F0\uB824\uBA74 \uBB34\uC5C7\uC774 \uD544\uC694\uD55C\uAC00\uC694?
- **\uB2F5:** Claude Code \uB97C \uC4F8 \uC218 \uC788\uB294 Claude \uAD6C\uB3C5\uACFC, \uC774 PC \uC5D0 \uC124\uCE58\uD55C Claude Code \uC785\uB2C8\uB2E4. \uD654\uBA74\uB9CC \uC4F0\uB294 \uB370\uB294 \uC544\uBB34\uAC83\uB3C4 \uD544\uC694 \uC5C6\uC2B5\uB2C8\uB2E4.
- **\uC9C8\uBB38:** \uC6CC\uB4DC\xB7\uD55C\uAE00 \uBB38\uC11C\uB3C4 \uB418\uB098\uC694?
- **\uB2F5:** \uC5F4\uC5B4\uC11C \uC77D\uACE0 \uD53C\uB4DC\uBC31\xB7Claude \uAC80\uD1A0\uAE4C\uC9C0 \uB429\uB2C8\uB2E4(\uAE00\uC744 \uBF51\uC544 \uBCF4\uC5EC \uC90D\uB2C8\uB2E4). \uC6D0\uBCF8\uC740 \uACE0\uCE58\uC9C0 \uC54A\uC73C\uB2C8, \uD568\uAED8 \uACE0\uCCD0 \uAC00\uBA70 \uC4F8 \uBB38\uC11C\uB294 \`.md\` \uB85C \uBC14\uAFB8\uACE0 \uC11C\uC2DD\uC740 \uB9C8\uC9C0\uB9C9\uC5D0 \uC6D0\uB798 \uD504\uB85C\uADF8\uB7A8\uC5D0\uC11C \uC785\uD788\uB294 \uD750\uB984\uC774 \uD3B8\uD569\uB2C8\uB2E4.
- **\uC9C8\uBB38:** AI \uAC00 \uBB38\uC11C\uB97C \uB9DD\uCE58\uBA74\uC694?
- **\uB2F5:** Claude \uB294 \uACE0\uCE5C \uAE00\uB9CC \uB3CC\uB824\uC8FC\uACE0, \uACB0\uACFC\uB294 \uD655\uC778\uD560 \uB54C\uAE4C\uC9C0 \uBCFC \uAC83\uC5D0 \uB0A8\uC2B5\uB2C8\uB2E4. \uB418\uB3CC\uB9AC\uAE30 \uD55C \uBC88\uC774\uBA74 \uACE0\uCE58\uAE30 \uC804 \uAE00\uB85C \uB3CC\uC544\uAC11\uB2C8\uB2E4.

## \uD55C\uACC4

- **\uC624\uD53C\uC2A4 \uBB38\uC11C\uB294 \uC77D\uAE30\uB9CC**: \uC6CC\uB4DC\xB7\uD30C\uC6CC\uD3EC\uC778\uD2B8\xB7\uC5D1\uC140\xB7\uD55C\uAE00(HWPX)\uC740 \uBF51\uC740 \uAE00\uB85C \uC77D\uACE0 \uD53C\uB4DC\uBC31\uC744 \uB0A8\uAE41\uB2C8\uB2E4 \u2014 \uACE0\uCE58\uB294 \uAC83(\uC0AC\uB78C\uB3C4 Claude \uB3C4)\uC740 \uB9C8\uD06C\uB2E4\uC6B4\xB7\uAE00\xB7\uD45C\xB7\uC124\uC815 \uD30C\uC77C\uC5D0\uC11C. \uC61B \uD55C\uAE00(\`.hwp\`)\uACFC PDF \uC758 \uAE00\uC740 \uC544\uC9C1 \uBF51\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4(PDF \uB294 Claude \uAC00 \uD30C\uC77C\uC744 \uC9C1\uC811 \uC77D\uC2B5\uB2C8\uB2E4).
- **\uC124\uC815\xB7\uCF54\uB4DC \uD30C\uC77C\uC740 \uC81C\uC548\uB9CC**: YAML\xB7JSON\xB7HTML \uCC98\uB7FC \uD504\uB85C\uADF8\uB7A8\uC774 \uC77D\uB294 \uD30C\uC77C\uC740 Claude \uAC00 \uBC14\uB85C \uACE0\uCE58\uC9C0 \uC54A\uACE0 \uC81C\uC548\uC73C\uB85C \uC62C\uB9BD\uB2C8\uB2E4 \u2014 \uCC28\uC774\uB97C \uBCF4\uACE0 \uC801\uC6A9\uD558\uC138\uC694.
- **\uC9C4\uC9DC Claude \uB294 Claude Code \uB85C \uC5F0\uACB0\uB429\uB2C8\uB2E4**: \uB2E4\uB978 AI \uB294 \uC544\uC9C1 \uBD99\uC5EC \uBCF4\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4. \uC694\uCCAD\uACFC \uACB0\uACFC\uAC00 \uAE30\uB85D \uD3F4\uB354\uC758 \uD30C\uC77C\uB85C \uC624\uAC00\uBBC0\uB85C, \uAC19\uC740 \uBAA8\uC591\uC73C\uB85C \uACB0\uACFC\uB97C \uB0B4\uB294 \uB3C4\uAD6C\uB77C\uBA74 \uB07C\uC6B8 \uC790\uB9AC\uB294 \uC788\uC2B5\uB2C8\uB2E4.
- **\uC2E4\uC2DC\uAC04 \uACF5\uB3D9 \uD0C0\uC774\uD551\uC740 \uC5C6\uC2B5\uB2C8\uB2E4**: \uC139\uC158 \uB2E8\uC704\uB85C \uC800\uC7A5\uD558\uACE0, \uACB9\uCE58\uBA74 \uCC28\uC774\uB97C \uBCF4\uC5EC \uC8FC\uACE0 \uACE0\uB974\uAC8C \uD569\uB2C8\uB2E4.
- **Claude \uC5D0\uAC8C \uB9E1\uAE34 \uB0B4\uC6A9\uC740 Claude \uB85C \uAC11\uB2C8\uB2E4**: DocBench \uC790\uCCB4\uB294 \uBB38\uC11C\uB97C \uBC16\uC73C\uB85C \uBCF4\uB0B4\uC9C0 \uC54A\uC9C0\uB9CC, \uBCF4\uB0B4\uAE30\uB97C \uB204\uB974\uBA74 \uADF8 \uC77C\uC5D0 \uD544\uC694\uD55C \uAE00\uC774 \uB0B4 Claude \uACC4\uC815\uC73C\uB85C \uC804\uB2EC\uB429\uB2C8\uB2E4. \uD68C\uC0AC \uBB38\uC11C\uB77C\uBA74 \uC0AC\uB0B4 AI \uC0AC\uC6A9 \uAE30\uC900\uC744 \uB530\uB974\uC138\uC694.
- **\uD734\uB300\uD3F0\uC740 \uBCF4\uAE30\uC640 \uC5F0\uC2B5\uAE4C\uC9C0**: \uD3F4\uB354\uC5D0 \uC4F0\uB824\uBA74 PC \uC758 \uC5E3\uC9C0\xB7\uD06C\uB86C\uC774 \uD544\uC694\uD569\uB2C8\uB2E4.
- **\uC774 \uC5F0\uC2B5 \uACF5\uAC04\uC758 Claude \uB294 \uD749\uB0B4\uC785\uB2C8\uB2E4**: \uC815\uD574\uC9C4 \uADDC\uCE59\uC73C\uB85C\uB9CC \uB2F5\uD569\uB2C8\uB2E4. \uC9C4\uC9DC Claude \uB294 PC \uC5D0\uC11C \uD3F4\uB354\uB97C \uC5F4\uACE0 \uC5F0\uACB0\uD558\uBA74 \uC501\uB2C8\uB2E4.
`;var Wh=`# Getting started with DocBench

A workbench where people and Claude read **the same documents**, trade feedback, and keep a record of every change.
Documents stay in folders on this PC, and DocBench never sends them anywhere (only when you hand work to Claude does the text that work needs go to Claude through your own Claude account).

## 1. Open a folder

Click **Getting started** (the name of this workspace) at the top left and choose **Open folder\u2026**.

- Even a whole drive opens instantly \u2014 like an explorer, only **expanded folders** are read.
- Opening a folder starts at the **Overview** \u2014 what this workspace is for (the first paragraph of the top README), what is in it, and what is worth a look (files that look like secrets, version copies, broken links, review dates \u2026). **Workbench \u203A Overview** on the left brings you back any time.
- Click a document to open it \u2014 Markdown, config files such as YAML and JSON (each key is a section), CSV tables, text and logs, Word, PowerPoint, Excel, HWPX and Jupyter (text extracted, read only), PDFs and images. Files DocBench does not open are dimmed (code is left out by default).
- **Pin** folders and documents you use often; they stay under "Working on" at the top.
- Phone and tablet browsers cannot write to folders, so they are for **looking around and practice** only. Open your own documents and run Claude jobs in Edge or Chrome on a PC.

## 2. Read and jot down

- A document splits into **sections** at each heading (a heading and the text under it). Key \`1\` shows only the outline, \`0\` shows everything.
- Click the bubble next to a section, or select text, and a **small box opens right there**. What you write collects as **drafts** \u2014 nothing goes anywhere yet. Edit, delete and merge them as you read.

## Engineering \u2014 design doc review

When review comments live in PR threads, chat and meeting notes, finding out what was applied means searching again.

**How**

1. Open the repository's \`docs/\` folder. Documents stay where they are; records (notes, history) are kept separately.
2. Write short notes per section as you read: "pagination is missing", "make this list a table". Star the urgent ones.
3. When you finish, pick **\u2605 only** and send those first; send the rest together after the review.
4. Under **To review**, check what changed in each edited section, then confirm or revert. Paste a confirmed round into a commit message or PR description with **Copy summary**.

**What you get**: notes and their results stay attached to sections. Lines you did not touch keep their exact bytes and line endings, so the git diff shows only the edits.

## Infrastructure \xB7 Ops \u2014 keeping runbooks current

Runbooks get opened only during incidents, and blanks and stale steps pile up in between.

**How**

1. Open the runbook folder. Blanks such as \`TODO\` or \`TBD\` are highlighted and their count shows above the document.
2. Choose **Claude review \u2192 Suggestions and questions** and widen the scope to the documents in the same folder. Claude also flags terms and numbers that disagree between documents.
3. Answer the questions with what you know; apply suggestions after checking what changed.
4. Changed procedures land in the **Change log** (under **Workbench** on the left) with who changed them, when, and from which note.

**What you get**: runbooks are current before the incident, and "who changed this step?" has an answer.

## Data \xB7 AI \u2014 checking an experiment report

When measured and estimated numbers are mixed, readers cannot judge the report.

**How**

1. Use evidence tags: \`[measured]\`, \`[documented]\`, \`[researched]\`, \`[estimated]\`, \`[unverified]\` (or the Korean \`[\uC2E4\uCE21]\` \`[\uBB38\uC11C]\` \`[\uC870\uC0AC]\` \`[\uCD94\uC815]\` \`[\uBBF8\uD655\uC778]\`). They show in different colors.
2. Send a **Claude review** with the note "flag numbers without a source and claims without a tag".
3. Answer the questions with sources and check the edits. Every request reminds Claude not to drop tags or invent numbers.

**What you get**: every number in the report carries its evidence, and review moves tag by tag instead of by impression.

## Product \xB7 PM \u2014 gathering notes on a plan

Merging five reviewers' comments into one plan can take half a day.

**How**

1. Open the plan's folder. The first time you save, choose **Keep inside the docs folder** for records, and everyone who opens that folder sees the same results and history (a good fit for teams sharing through git).
2. Each reviewer selects a phrase and writes a note right there; when the new wording is clear, they type it with **Rewrite as**. Unsent drafts are visible only to whoever wrote them.
3. When done, each reviewer sends with **Suggest only** and one line for the batch ("keep the conclusion, strengthen the evidence"). The document does not change yet.
4. The planner goes through each reviewer's round under **To review** and **Apply**s or **Reject**s the suggestions. Comments heard in a review meeting can be noted by the planner in place and sent together afterwards.

**What you get**: collecting, applying and confirming feedback happens in one place, and every note keeps a record of how it was applied.

## Sales \xB7 Marketing \u2014 one standard across many documents

Proposals and press releases have to keep the same tone and avoid the same words every time.

**How**

1. Write it once in **Standing instructions**: "formal tone", "never name competitors", "numbers always with a source".
2. For each document, note only what needs to change; the standing instructions go along with every batch.
3. Customer-specific versions follow the same rules, and a round summary can be pasted into the approval request.

**What you get**: the same standard goes along every time, whoever edits and however many rounds it takes.

## Customer support \u2014 one policy change, many documents

When a refund window changes, every support manual, help article and FAQ that mentions it has to change too.

**How**

1. Open the support folder and choose **Claude review \u2192 Suggestions and questions**.
2. Widen the scope to the documents in the same folder (up to ten) and write in **Focus**: "The refund window changed from 14 to 30 days. Fix every place where the old window remains."
3. Under **To review**, **Apply** or **Reject** each suggestion per document, then let the team know with **Copy summary**.

**What you get**: it is easier not to miss a document, and you can see which sentence changed in which document.

## HR \xB7 Training \u2014 revising a policy

Explaining what changed and why often takes longer than making the change.

**How**

1. Open the current policy and write a note with the reason on each clause to revise.
2. Send with **Suggest only**. The document stays as it is and the rewritten text comes back as suggestions; apply or reject them one by one after checking what changed.
3. In the revision meeting, show the diff on each suggestion card (removed and added text) as it is. Applied changes go into the **Change log** together with the note behind them, and a git folder opened in the DocBench app can also be compared against the last commit (HEAD).

**What you get**: each clause keeps the reason (note) next to the result (changed text), which makes the change notice easy to write.

## Legal \xB7 Compliance \u2014 flag, don't edit

For terms and policies, even a one-word change needs a record of what changed and why.

**How**

1. In **Standing instructions**, write "never change clause numbers or defined terms" and "if there is no source, leave \`TBD\`".
2. Note each clause and send with **Suggest only**. Where you only want to know whether something is right, use the **Check only** button in the note box.
3. A person checks what changed and **Apply**s or **Reject**s each suggestion. Applied changes are logged with the note behind them.

**What you get**: Claude flags and suggests; people decide what changes.

## Leaders \xB7 Executives \u2014 reading a long report fast

Ten minutes before the meeting, a thirty-page report arrives.

**How**

1. Open it and choose **Claude review \u2192 Reading plan**.
2. Claude opens the sections worth reading first and folds the rest. The document itself does not change, only your view, and you can undo it.
3. Write questions where they come up and send them together after the meeting.

**What you get**: you read the core first, and your questions sit next to the text they are about, so the author can answer right there.

## Easy to use

- No install: open a single HTML file in Edge or Chrome. The first time, it asks for no name or folder and opens this practice space.
- Claude runs on your own subscription login. With a Claude plan that includes Claude Code there is no API key and nothing extra to pay (usage counts toward your plan).
- Writing and sending are separate steps. Think while you write, send once you have read it all \u2014 or send the urgent ones first.
- Handing work to Claude is one button in the app, or one click on **Open in Claude Code** (the first time, answer Yes when Claude Code asks whether you trust the folder).

## Works everywhere

- **Any role**: from design docs to policies and press releases, documents work the same way (see **Uses by role**). Markdown, text, CSV tables and config files (YAML, JSON, TOML) can be read and edited; Word, PowerPoint, Excel and HWPX are read as extracted text with feedback.
- **Same screen everywhere**: a single file, the app on this PC, or a tab in your company dashboard all show the same workbench, and the records carry on as long as they use the same records folder.
- **Documents as they are**: big folders such as whole drives, legacy Korean encoding (EUC-KR), and Windows line endings are handled without conversion.
- **Inside company networks**: everything the screen needs ships in the one file, so nothing has to be downloaded from the internet.

## Safe to hand over

- **Claude never edits documents itself**: it returns rewritten text in a fixed format, and DocBench applies it after checking that nothing changed meanwhile. If someone changed the same section meanwhile, it becomes a suggestion instead of overwriting.
- **Narrow permissions**: through the app, Claude runs outside the docs folder with read-only tools, so even text crafted to trick it cannot run commands or read outside the folder. Through the terminal line, the records folder's permission settings let Claude write only the result file without asking and block edits to the records; for anything else, Claude Code asks you first (with default settings).
- **Nothing is final until a person confirms**: results stay under **To review** until you confirm them, and wrong edits can be reverted.
- **Records people can read**: notes and history are plain text files (JSON) in the records folder that even Notepad opens. They stay even if you stop using the tool.

## Common questions

- **Q:** Do company documents leave the PC?
- **A:** Not while you only use the screen (this file blocks outside connections). When you hand work to Claude, the text that work needs and whatever Claude reads in the docs folder go to Claude through your Claude account. For company documents, check your company's AI usage rules first.
- **Q:** What do I need to use the real Claude?
- **A:** A Claude plan that includes Claude Code, and Claude Code installed on this PC. Using the screen alone needs nothing.
- **Q:** Do Word or HWP files work?
- **A:** You can open them, read them and leave feedback or ask for a Claude review (their text is extracted). The original is not changed, so for documents you will keep editing together, convert to \`.md\` and apply the final formatting in the original program.
- **Q:** What if the AI ruins a document?
- **A:** Claude only returns rewritten text, and results stay under To review until you confirm them. One Revert takes the text back to before the edit.

## Limits

- **Office files are read only**: Word, PowerPoint, Excel and HWPX are read as extracted text with feedback \u2014 editing (by people or Claude) happens in Markdown, text, tables and config files. Text is not yet extracted from legacy \`.hwp\` or PDF (Claude reads PDFs directly).
- **Config and code files get proposals**: for files programs read, such as YAML, JSON or HTML, Claude does not edit directly but proposes \u2014 review the diff and apply.
- **The real Claude connects through Claude Code**: no other AI has been tried yet. Requests and results travel as files in the records folder, so a tool that returns results in the same shape has a place to plug in.
- **No live co-typing**: saves happen per section; overlapping edits show the difference and let you choose.
- **What you hand to Claude goes to Claude**: DocBench itself never sends documents anywhere, but when you send a batch, the text it needs goes to Claude through your Claude account. For company documents, follow your company's AI usage rules.
