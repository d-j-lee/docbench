/* DocBench — 작업대 스타일.
   레이아웃: 3단 작업대 — 문서 레일 · 읽기 칼럼(~74ch) · 피드백 패널.
   반응형 기준은 화면이 아니라 .docbench.docbench.docbench 컨테이너 폭이다(대시보드 패널에 넣어도 맞춰진다).
   호스트는 --db-* 토큰만 덮어써서 사내 디자인 시스템 색·글꼴에 맞춘다:
     doc-bench { --db-go: #0050b3; --db-font-body: "사내 글꼴", sans-serif; }
   토큰은 :where() 로 선언해 호스트의 어떤 선택자로도 덮어쓸 수 있다.
   그 밖의 규칙은 빌드가 .docbench.docbench.docbench 를 세 번 겹쳐(scripts/build.mjs) 호스트 전역 CSS 보다 우선하게 한다. */

:where(.docbench.docbench.docbench) {

  --db-go: #0b7a57; --db-go-ink: #ffffff; --db-go-soft: #dcefe6;
  --db-wait: #95600c; --db-wait-soft: #fbeed3;
  --db-bad: #b13a33; --db-bad-soft: #f7e2df;

  --db-font-body: "Pretendard", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --db-font-display: var(--db-font-body);
  --db-font-mono: "IBM Plex Mono", "D2Coding", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --db-rail: 260px; --db-panel: 360px; --db-bar: 50px; --db-radius: 8px;
  color-scheme: light;
}
:where(.docbench.docbench.docbench[data-theme="dark"]),
:where(:root[data-theme="dark"] .docbench.docbench.docbench[data-theme="auto"]) {
  --db-bg: #0f1412; --db-surface: #151b18; --db-sunk: #1c2420; --db-line: #28322d; --db-line-2: #38453e;
  --db-ink: #e3eae5; --db-ink-2: #afbab3; --db-ink-3: #85918a;
  --db-go: #3fc597; --db-go-ink: #06140e; --db-go-soft: #163428;
  --db-wait: #e3ab45; --db-wait-soft: #33270e;
  --db-bad: #ef7b73; --db-bad-soft: #3a1e1c;
  --db-info: #80b2e4; --db-info-soft: #17283a;
  --db-mark: #6b5a12; --db-mark-ink: #fff4c7;

@media (prefers-color-scheme: dark) {

  }
}

/* ---------- 호스트 CSS 차단막 ----------
   대시보드 전역 규칙(header{…}, .card h2{…}, button{…})이 작업대 안으로 새지 않게 안쪽 요소를 브라우저 기본값으로
   되돌린 뒤 아래 규칙만 얹는다. svg·img 는 제외(속성으로 준 크기·색까지 되돌아간다). */
.docbench.docbench.docbench :where(header, nav, main, aside, section, article, footer, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, dl, dt, dd, blockquote, pre, code, kbd, table, thead, tbody, tfoot, tr, th, td, caption, button, input, textarea, select, label, dialog, mark, a, b, i, strong, em, del, ins, s, small, sup, sub, hr, details, summary, figure, figcaption) { all: revert; }

/* ---------- 바탕 ---------- */
.docbench.docbench.docbench { container: docbench / inline-size; position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; min-height: 420px; background: var(--db-bg); color: var(--db-ink); font: 400 15px/1.7 var(--db-font-body); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; text-align: left; outline: none; letter-spacing: normal; word-spacing: normal; text-transform: none; text-indent: 0; text-shadow: none; font-style: normal; white-space: normal; }
.docbench.docbench.docbench *, .docbench.docbench.docbench *::before, .docbench.docbench.docbench *::after { box-sizing: border-box; }
.docbench.docbench.docbench button, .docbench.docbench.docbench input, .docbench.docbench.docbench textarea, .docbench.docbench.docbench select { font: inherit; color: inherit; letter-spacing: normal; }
.docbench.docbench.docbench button { cursor: pointer; }
.docbench.docbench.docbench :focus-visible { outline: 2px solid var(--db-go); outline-offset: 2px; border-radius: 4px; }
.docbench.docbench.docbench a { color: var(--db-info); }
.docbench.docbench.docbench [hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .docbench.docbench.docbench * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.docbench.docbench.docbench .db-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--db-line-2); background: var(--db-surface); border-radius: 7px; padding: 4px 11px; font-size: 13px; font-weight: 500; line-height: 1.35; white-space: nowrap; color: var(--db-ink); }
.docbench.docbench.docbench .db-btn:hover { border-color: var(--db-ink-3); }
.docbench.docbench.docbench .db-btn:disabled { opacity: .5; cursor: default; }
.docbench.docbench.docbench .db-btn.primary { background: var(--db-go); border-color: var(--db-go); color: var(--db-go-ink); }
.docbench.docbench.docbench .db-btn.ghost { border-color: transparent; background: transparent; }
.docbench.docbench.docbench .db-btn.danger { color: var(--db-bad); }
.docbench.docbench.docbench .db-btn.sm { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
.docbench.docbench.docbench .db-btn svg { width: 13px; height: 13px; }
.docbench.docbench.docbench .db-chip { border: 1px solid var(--db-line-2); background: var(--db-surface); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; color: var(--db-ink-2); line-height: 1.6; }
.docbench.docbench.docbench .db-chip[aria-pressed="true"] { background: var(--db-ink); border-color: var(--db-ink); color: var(--db-surface); }
.docbench.docbench.docbench .db-seg { display: inline-flex; border: 1px solid var(--db-line-2); border-radius: 7px; overflow: hidden; }
.docbench.docbench.docbench .db-seg button { border: 0; border-right: 1px solid var(--db-line); background: var(--db-surface); padding: 3px 10px; font-size: 12.5px; color: var(--db-ink-2); }
.docbench.docbench.docbench .db-seg button:last-child { border-right: 0; }
.docbench.docbench.docbench .db-seg button[aria-pressed="true"] { background: var(--db-ink); color: var(--db-surface); font-weight: 600; }
.docbench.docbench.docbench .db-lbl { font-size: 11.5px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-hint { font-size: 12px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 상단 바 ---------- */
.docbench.docbench.docbench .db-bar { flex: none; height: var(--db-bar); display: flex; align-items: center; gap: 10px; padding-inline: 14px; background: var(--db-surface); border-bottom: 1px solid var(--db-line); z-index: 5; }
.docbench.docbench.docbench .db-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.docbench.docbench.docbench .db-logo { width: 20px; height: 20px; flex: none; display: grid; gap: 3px; align-content: center; }
.docbench.docbench.docbench .db-logo i { display: block; height: 3px; border-radius: 2px; background: var(--db-ink); }
.docbench.docbench.docbench .db-logo i:nth-child(2) { width: 70%; background: var(--db-go); }
.docbench.docbench.docbench .db-logo i:nth-child(3) { width: 45%; }
.docbench.docbench.docbench .db-brand b { font: 700 15.5px/1.2 var(--db-font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.docbench.docbench.docbench .db-brand small { color: var(--db-ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.docbench.docbench.docbench .db-grow { flex: 1; }
.docbench.docbench.docbench .db-clocks { display: flex; gap: 6px; }
.docbench.docbench.docbench .db-clock { display: inline-flex; align-items: center; gap: 6px; background: var(--db-ink); color: var(--db-surface); border-radius: 6px; padding: 2px 8px 2px 7px; font-size: 11.5px; line-height: 1.25; white-space: nowrap; }
.docbench.docbench.docbench .db-clock .n { font: 500 13.5px/1.2 var(--db-font-mono); font-variant-numeric: tabular-nums; color: var(--db-go-soft); }
.docbench.docbench.docbench .db-clock.plan { background: var(--db-sunk); color: var(--db-ink-2); }
.docbench.docbench.docbench .db-clock.plan .n { color: var(--db-ink); }
.docbench.docbench.docbench .db-turns { display: flex; gap: 6px; }
.docbench.docbench.docbench .db-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; border: 0; background: var(--db-sunk); color: var(--db-ink-2); white-space: nowrap; }
.docbench.docbench.docbench .db-pill .n { font-family: var(--db-font-mono); font-variant-numeric: tabular-nums; }
.docbench.docbench.docbench .db-pill .ic, .docbench.docbench.docbench .db-send .ic { display: inline-flex; }
.docbench.docbench.docbench .db-pill .ic svg { width: 12px; height: 12px; }
.docbench.docbench.docbench .db-send { display: inline-flex; align-items: center; gap: 6px; }
.docbench.docbench.docbench .db-send .ic svg { width: 14px; height: 14px; }
.docbench.docbench.docbench .db-pill.owner { background: var(--db-wait-soft); color: var(--db-wait); }
.docbench.docbench.docbench .db-pill.assistant { background: var(--db-go-soft); color: var(--db-go); }
.docbench.docbench.docbench .db-toggle { display: none; }

/* ---------- 3단 골격 ---------- */
.docbench.docbench.docbench .db-shell { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: var(--db-rail) minmax(0, 1fr) var(--db-panel); grid-template-rows: minmax(0, 1fr) auto; }
.docbench.docbench.docbench .db-rail { grid-column: 1; grid-row: 1 / span 2; }
.docbench.docbench.docbench .db-main { grid-column: 2; grid-row: 1; }
.docbench.docbench.docbench .db-panel { grid-column: 3; grid-row: 1 / span 2; }
.docbench.docbench.docbench .db-dock { grid-column: 2; grid-row: 2; }
.docbench.docbench.docbench .db-rail, .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-panel { min-height: 0; overflow: auto; overscroll-behavior: contain; }
.docbench.docbench.docbench .db-rail { background: var(--db-surface); border-right: 1px solid var(--db-line); padding: 12px 10px 40px; }
.docbench.docbench.docbench .db-panel { background: var(--db-surface); border-left: 1px solid var(--db-line); display: flex; flex-direction: column; overflow: hidden; }
.docbench.docbench.docbench .db-main { position: relative; padding: 0 16px 120px; scroll-padding-top: 64px; }
.docbench.docbench.docbench .db-page { max-width: calc(74ch + 28px); margin: 0 auto; padding-left: 28px; }
.docbench.docbench.docbench .db-scrim { display: none; }

@container docbench (max-width: 1099px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: var(--db-rail) minmax(0, 1fr); }
  /* 겹쳐 뜨는 패널은 격자 칸이 아니라 작업대 전체를 기준으로 — 칸(3)을 그대로 두면 두 칸 격자에서 폭이 0 이 된다(0.3.0~0.5.0, 761~1099px) */
  .docbench.docbench.docbench .db-panel { grid-column: auto; grid-row: auto; position: absolute; inset: 0 0 0 auto; width: min(var(--db-panel), 100%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(105%); transition: transform .18s; }
  .docbench.docbench.docbench.panel-open .db-panel { transform: none; }
  .docbench.docbench.docbench .db-toggle.panel { display: inline-flex; }
  .docbench.docbench.docbench.panel-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
}
@container docbench (max-width: 760px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: minmax(0, 1fr); }
  .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-dock { grid-column: 1; }
  .docbench.docbench.docbench .db-rail { position: absolute; inset: 0 auto 0 0; width: min(300px, 88%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(-105%); transition: transform .18s; }
  .docbench.docbench.docbench.rail-open .db-rail { transform: none; }
  .docbench.docbench.docbench.rail-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
  .docbench.docbench.docbench .db-toggle.nav { display: inline-flex; }
  .docbench.docbench.docbench .db-brand small, .docbench.docbench.docbench .db-clock.plan, .docbench.docbench.docbench .db-clock .lbl, .docbench.docbench.docbench .db-pill .lbl, .docbench.docbench.docbench .db-bar .db-send .t, .docbench.docbench.docbench .db-claude .clk { display: none; }
  .docbench.docbench.docbench .db-bar { gap: 6px; padding-inline: 10px; }
  .docbench.docbench.docbench .db-page { padding-left: 4px; }
  .docbench.docbench.docbench .db-main { padding-inline: 16px; }
}
@container docbench (max-width: 560px) {
  /* 휴대폰 너비: 위 띠가 한 줄에 들어가게 — 이름·Claude 글은 접고, 넘기기는 Claude 창 안에서(창이 기다리는 피드백을 보여 준다) */
  .docbench.docbench.docbench .db-bar .db-me { padding: 2px; }
  .docbench.docbench.docbench .db-me .n, .docbench.docbench.docbench .db-claude .lb, .docbench.docbench.docbench .db-bar .db-send.dockable { display: none; }
  .docbench.docbench.docbench .db-bar .db-claude .sh { display: inline; }
  .docbench.docbench.docbench .db-bar > .db-toggle, .docbench.docbench.docbench .db-bar > .db-me, .docbench.docbench.docbench .db-bar > .db-claude { flex: none; }
}
@container docbench (max-width: 460px) {
  .docbench.docbench.docbench .db-brand { display: none; }
  .docbench.docbench.docbench .db-bar { gap: 4px; padding-inline: 8px; }
  .docbench.docbench.docbench .db-pill { padding: 2px 8px; gap: 4px; }
}
@container docbench (max-width: 400px) {
  .docbench.docbench.docbench .db-bar .db-claude .sh { display: none; }
}

/* ---------- 문서 레일 ---------- */

.docbench.docbench.docbench .db-grp-h { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 4px 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; color: var(--db-ink-3); text-align: left; }
.docbench.docbench.docbench .db-grp-h .car { font-size: 9px; transition: transform .15s; }

.docbench.docbench.docbench .db-grp.closed .db-grp-list { display: none; }

.docbench.docbench.docbench .db-nav { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; border-radius: 7px; padding: 5px 8px; text-align: left; font-size: 13.5px; color: var(--db-ink-2); line-height: 1.35; }

.docbench.docbench.docbench .db-dot.assistant { background: var(--db-go); color: var(--db-go-ink); }

.docbench.docbench.docbench .db-dot.chg { background: var(--db-chg-soft); color: var(--db-chg); }

\uBB38\uC11C\uB294 \uC774 PC \uC758 \uD3F4\uB354\uC5D0 \uADF8\uB300\uB85C \uC788\uACE0, \uC5B4\uB514\uB85C\uB3C4 \uBCF4\uB0B4\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.

## 1. \uD3F4\uB354 \uC5F4\uAE30

\uC67C\uCABD \uC704 **\uC791\uC5C5 \uACF5\uAC04 \uC774\uB984**\uC744 \uB204\uB974\uACE0 **\uD3F4\uB354 \uC5F4\uAE30**\uB97C \uACE0\uB974\uC138\uC694.

- \uB4DC\uB77C\uC774\uBE0C\uB098 \uD070 \uD3F4\uB354\uB97C \uC5F4\uC5B4\uB3C4 \uBC14\uB85C \uB739\uB2C8\uB2E4 \u2014 \uD0D0\uC0C9\uAE30\uCC98\uB7FC **\uD3BC\uCE5C \uD3F4\uB354\uB9CC** \uC77D\uC2B5\uB2C8\uB2E4.
- \uB9C8\uD06C\uB2E4\uC6B4(\`.md\`) \uBB38\uC11C\uB97C \uB204\uB974\uBA74 \uC5F4\uB9BD\uB2C8\uB2E4. \uB2E4\uB978 \uD30C\uC77C\uC740 \uD750\uB9AC\uAC8C \uBCF4\uC785\uB2C8\uB2E4.
- \uC790\uC8FC \uBCF4\uB294 \uD3F4\uB354\xB7\uBB38\uC11C\uB294 \uC904 \uB05D\uC758 \uD540\uC73C\uB85C **\uACE0\uC815**\uD558\uBA74 \uC704\uCABD "\uC791\uC5C5 \uC911"\uC5D0 \uB298 \uC788\uC2B5\uB2C8\uB2E4.
- \uD734\uB300\uD3F0\xB7\uD0DC\uBE14\uB9BF \uBE0C\uB77C\uC6B0\uC800\uB294 \uD3F4\uB354\uC5D0 \uC4F0\uC9C0 \uBABB\uD574 **\uB458\uB7EC\uBCF4\uAE30\uC640 \uC5F0\uC2B5**\uAE4C\uC9C0\uB9CC \uB429\uB2C8\uB2E4. \uB0B4 \uBB38\uC11C\uC640 Claude \uC791\uC5C5\uC740 PC \uC758 \uC5E3\uC9C0\xB7\uD06C\uB86C\uC5D0\uC11C \uC5EC\uC138\uC694.

## 2. \uC77D\uACE0 \uD53C\uB4DC\uBC31\uD558\uAE30

- \uC81C\uBAA9 \uAE4A\uC774\uBCC4\uB85C \uC811\uACE0 \uD3BC\uCE58\uBA70 \uC77D\uC2B5\uB2C8\uB2E4(\uD0A4 \`1\` \`2\` \`3\`, \uC804\uBD80 \`0\`).
- \uC139\uC158 \uC606 \uB9D0\uD48D\uC120\uC774\uB098 \uBB38\uAD6C\uB97C \uACE0\uB978 \uB4A4 **\uD53C\uB4DC\uBC31**\uC744 \uB2F5\uB2C8\uB2E4. \uC0AC\uB78C \uCC28\uB840\xB7Claude \uCC28\uB840\uAC00 \uB098\uB258\uC5B4 \uB2E4\uC74C\uC5D0 \uB204\uAC00 \uD560\uC9C0 \uBCF4\uC785\uB2C8\uB2E4.
- \uC139\uC158 \uB2E8\uC704\uB85C \uBC14\uB85C \uACE0\uCE69\uB2C8\uB2E4. \uADF8 \uC0AC\uC774 \uBC16\uC5D0\uC11C \uBC14\uB00C\uC5C8\uC73C\uBA74 \uCC28\uC774\uB97C \uBCF4\uC5EC \uC8FC\uACE0 \uACE0\uB974\uAC8C \uD569\uB2C8\uB2E4.

\uCC98\uC74C \uC800\uC7A5\uD560 \uB54C **\uAE30\uB85D \uD3F4\uB354**(\uD53C\uB4DC\uBC31\xB7\uC774\uB825\uC744 \uB458 \uACF3)\uB97C \uD55C \uBC88 \uACE0\uB985\uB2C8\uB2E4. \uBB38\uC11C \uD3F4\uB354\uC5D0\uB294 \uC544\uBB34\uAC83\uB3C4 \uB9CC\uB4E4\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.

## 3. Claude \uC640 \uD568\uAED8

\uD544\uC694\uD560 \uB54C \uB2E8\uACC4\uC801\uC73C\uB85C \uC501\uB2C8\uB2E4 \u2014 \uCC98\uC74C\uBD80\uD130 \uC124\uCE58\uD560 \uAC83\uC740 \uC5C6\uC2B5\uB2C8\uB2E4.

| \uB2E8\uACC4 | \uD558\uB294 \uC77C | \uC900\uBE44 |
|---|---|---|
| \uC190\uC73C\uB85C | \uD53C\uB4DC\uBC31\uC744 Claude \uCC28\uB840\uB85C \uB118\uAE30\uACE0, \uD130\uBBF8\uB110\uC758 Claude Code \uC5D0\uC11C \`/docbench-feedback\` | Claude Code |
| \uC774 \uD654\uBA74\uC5D0\uC11C | **Claude \uC5D0\uAC8C \uB118\uAE30\uAE30**\uB97C \uB204\uB974\uBA74 \uBC31\uADF8\uB77C\uC6B4\uB4DC\uB85C \uCC98\uB9AC\uD558\uACE0 \uC9C4\uD589\uC774 \uC544\uB798 \uCC3D\uC5D0 \uBCF4\uC785\uB2C8\uB2E4 | DocBench \uC571 (\uBB38\uAD6C \uD558\uB098\uB85C \uC124\uCE58) |
| \uB300\uC2DC\uBCF4\uB4DC\uC5D0\uC11C | \uC4F0\uB358 \uB300\uC2DC\uBCF4\uB4DC\uC758 \uD0ED\uC73C\uB85C \uB07C\uC6CC \uB123\uC2B5\uB2C8\uB2E4 | DocBench \uC571 + \uC5F0\uACB0 \uD55C \uC904 |

Claude \uB294 \uB0B4 **\uAD6C\uB3C5 \uB85C\uADF8\uC778 \uADF8\uB300\uB85C** \uC4F0\uACE0, API \uD0A4\uB294 \uD544\uC694 \uC5C6\uC2B5\uB2C8\uB2E4. \uC77D\uAE30 \uB3C4\uAD6C\uB9CC \uBC1B\uACE0 \uBB38\uC11C \uD3F4\uB354 \uBC16\uC5D0\uC11C \uB3CC\uBA70, \uACE0\uCE60 \uB0B4\uC6A9\uC740 \uC791\uC5C5\uB300\uAC00 \uD310\uC744 \uBE44\uAD50\uD574 \uBC18\uC601\uD569\uB2C8\uB2E4.

> \uC9C0\uAE08 \uC774 \uC5F0\uC2B5 \uACF5\uAC04\uC5D0\uC11C\uB294 **\uD749\uB0B4 Claude** \uAC00 \uB2F5\uD569\uB2C8\uB2E4(\uC2E4\uC81C\uB85C \uBCF4\uB0B4\uC9C0 \uC54A\uC74C). \uC5F0\uC2B5\uC6A9 \uAE30\uD68D\uC11C\uC758 \uD53C\uB4DC\uBC31\uC744 Claude \uCC28\uB840\uB85C \uB118\uAE30\uBA74, \uB418\uBB3B\uACE0 \u2192 \uB2F5\uAE00\uC744 \uBC1B\uC544 \u2192 \uACE0\uCE58\uB294 \uD750\uB984\uC744 \uBBF8\uB9AC \uBCFC \uC218 \uC788\uC2B5\uB2C8\uB2E4.

## 4. \uC774\uB984\uACFC \uACC4\uC815

\uC774\uB984\uC744 \uBB3B\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uC774 \uBE0C\uB77C\uC6B0\uC800\uC5D0 \uACC4\uC815\uC774 \uC800\uC808\uB85C \uC0DD\uAE30\uACE0, \uC624\uB978\uCABD \uC704 **\uB098**\uB97C \uB204\uB974\uBA74 \uD45C\uC2DC \uC774\uB984\uC744 \uC815\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4(\uC5EC\uB7FF\uC774 \uD568\uAED8 \uC4F8 \uB54C \uC11C\uB85C \uAD6C\uBD84\uB429\uB2C8\uB2E4).

`,kh=`# Getting started with DocBench

A workbench where people and Claude read **the same documents**, trade feedback, and keep a record of every change.
Documents stay in folders on this PC and are never sent anywhere.

## 1. Open a folder

Click the **workspace name** at the top left and choose **Open folder**.

- Even a whole drive opens instantly \u2014 like an explorer, only **expanded folders** are read.
- Click a Markdown (\`.md\`) document to open it; other files are dimmed.
- **Pin** folders and documents you use often; they stay under "Working on" at the top.
- Phone and tablet browsers cannot write to folders, so they are for **looking around and practice** only. Open your own documents and run Claude jobs in Edge or Chrome on a PC.

## 2. Read and give feedback

- Fold and unfold by heading depth (keys \`1\` \`2\` \`3\`, all \`0\`).
- Use the bubble next to a section, or select text, to leave **feedback**. Each item shows whose turn it is \u2014 yours or Claude's.
- Edit section by section. If the file changed outside meanwhile, you see the difference and choose.

The first time you save, choose a **records folder** (where feedback and history live) once. Nothing is created in your docs folder.

## 3. With Claude

Use it step by step when you need it \u2014 nothing to install up front.

| Level | What happens | Needs |
|---|---|---|
| By hand | Hand feedback to Claude, then run \`/docbench-feedback\` in Claude Code | Claude Code |
| From this page | **Hand to Claude** runs in the background; progress shows in the bottom panel | DocBench app (one prompt to install) |
| In a dashboard | Drop it into your dashboard as a tab | DocBench app + one line |

Claude runs on **your subscription login** \u2014 no API key. It gets read-only tools outside the docs folder; DocBench applies edits with version checks.

> In this practice space a **simulated Claude** answers (nothing is sent). Hand the practice plan's feedback to Claude to preview the flow: it asks back \u2192 you reply \u2192 it edits.

## 4. Name and account

No name is asked. An account is created in this browser automatically; click **Me** at the top right to set a display name (useful when several people share a folder).

## Background

Review comments on plans and runbooks scatter across chat and mail, so it is hard to see what was applied.

## Goals

- Leave review comments right where they apply
- See at a glance whose turn it is
- Keep the change history next to the document
