   그 밖의 규칙은 빌드가 .docbench.docbench.docbench 를 세 번 겹쳐(scripts/build.mjs) 호스트 전역 CSS 보다 우선하게 한다. */

/* ---------- 호스트 CSS 차단막 ----------
   대시보드 전역 규칙(header{…}, .card h2{…}, button{…})이 작업대 안으로 새지 않게 안쪽 요소를 브라우저 기본값으로
   되돌린 뒤 아래 규칙만 얹는다. svg·img 는 제외(속성으로 준 크기·색까지 되돌아간다). */
.docbench.docbench.docbench :where(header, nav, main, aside, section, article, footer, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, dl, dt, dd, blockquote, pre, code, kbd, table, thead, tbody, tfoot, tr, th, td, caption, button, input, textarea, select, label, dialog, mark, a, b, i, strong, em, del, ins, s, small, sup, sub, hr, details, summary, figure, figcaption) { all: revert; }

/* ---------- 바탕 ---------- */
.docbench.docbench.docbench { container: docbench / inline-size; position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; min-height: 420px; background: var(--db-bg); color: var(--db-ink); font: 400 15px/1.7 var(--db-font-body); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; text-align: left; outline: none; letter-spacing: normal; word-spacing: normal; text-transform: none; text-indent: 0; text-shadow: none; font-style: normal; white-space: normal; }
.docbench.docbench.docbench *, .docbench.docbench.docbench *::before, .docbench.docbench.docbench *::after { box-sizing: border-box; }
.docbench.docbench.docbench button, .docbench.docbench.docbench input, .docbench.docbench.docbench textarea, .docbench.docbench.docbench select { font: inherit; color: inherit; letter-spacing: normal; }
.docbench.docbench.docbench button { cursor: pointer; }
.docbench.docbench.docbench :focus-visible { outline: 2px solid var(--db-go); outline-offset: 2px; border-radius: 4px; }
.docbench.docbench.docbench a { color: var(--db-info); }
.docbench.docbench.docbench [hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .docbench.docbench.docbench * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.docbench.docbench.docbench .db-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--db-line-2); background: var(--db-surface); border-radius: 7px; padding: 4px 11px; font-size: 13px; font-weight: 500; line-height: 1.35; white-space: nowrap; color: var(--db-ink); }
.docbench.docbench.docbench .db-btn:hover { border-color: var(--db-ink-3); }
.docbench.docbench.docbench .db-btn:disabled { opacity: .5; cursor: default; }
.docbench.docbench.docbench .db-btn.primary { background: var(--db-go); border-color: var(--db-go); color: var(--db-go-ink); }
.docbench.docbench.docbench .db-btn.ghost { border-color: transparent; background: transparent; }
.docbench.docbench.docbench .db-btn.danger { color: var(--db-bad); }
.docbench.docbench.docbench .db-btn.sm { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
.docbench.docbench.docbench .db-btn svg { width: 13px; height: 13px; }
.docbench.docbench.docbench .db-chip { border: 1px solid var(--db-line-2); background: var(--db-surface); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; color: var(--db-ink-2); line-height: 1.6; }
.docbench.docbench.docbench .db-chip[aria-pressed="true"] { background: var(--db-ink); border-color: var(--db-ink); color: var(--db-surface); }
.docbench.docbench.docbench .db-seg { display: inline-flex; border: 1px solid var(--db-line-2); border-radius: 7px; overflow: hidden; }
.docbench.docbench.docbench .db-seg button { border: 0; border-right: 1px solid var(--db-line); background: var(--db-surface); padding: 3px 10px; font-size: 12.5px; color: var(--db-ink-2); }
.docbench.docbench.docbench .db-seg button:last-child { border-right: 0; }
.docbench.docbench.docbench .db-seg button[aria-pressed="true"] { background: var(--db-ink); color: var(--db-surface); font-weight: 600; }
.docbench.docbench.docbench .db-lbl { font-size: 11.5px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-hint { font-size: 12px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 상단 바 ---------- */
.docbench.docbench.docbench .db-bar { flex: none; height: var(--db-bar); display: flex; align-items: center; gap: 10px; padding-inline: 14px; background: var(--db-surface); border-bottom: 1px solid var(--db-line); z-index: 5; }
.docbench.docbench.docbench .db-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.docbench.docbench.docbench .db-logo { width: 20px; height: 20px; flex: none; display: grid; gap: 3px; align-content: center; }
.docbench.docbench.docbench .db-logo i { display: block; height: 3px; border-radius: 2px; background: var(--db-ink); }
.docbench.docbench.docbench .db-logo i:nth-child(2) { width: 70%; background: var(--db-go); }
.docbench.docbench.docbench .db-logo i:nth-child(3) { width: 45%; }
.docbench.docbench.docbench .db-brand b { font: 700 15.5px/1.2 var(--db-font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.docbench.docbench.docbench .db-brand small { color: var(--db-ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.docbench.docbench.docbench .db-grow { flex: 1; }
.docbench.docbench.docbench .db-clocks { display: flex; gap: 6px; }
.docbench.docbench.docbench .db-clock { display: inline-flex; align-items: center; gap: 6px; background: var(--db-ink); color: var(--db-surface); border-radius: 6px; padding: 2px 8px 2px 7px; font-size: 11.5px; line-height: 1.25; white-space: nowrap; }
.docbench.docbench.docbench .db-clock .n { font: 500 13.5px/1.2 var(--db-font-mono); font-variant-numeric: tabular-nums; color: var(--db-go-soft); }
.docbench.docbench.docbench .db-clock.plan { background: var(--db-sunk); color: var(--db-ink-2); }
.docbench.docbench.docbench .db-clock.plan .n { color: var(--db-ink); }
.docbench.docbench.docbench .db-turns { display: flex; gap: 6px; }
.docbench.docbench.docbench .db-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; border: 0; background: var(--db-sunk); color: var(--db-ink-2); white-space: nowrap; }
.docbench.docbench.docbench .db-pill .n { font-family: var(--db-font-mono); font-variant-numeric: tabular-nums; }
.docbench.docbench.docbench .db-pill .ic, .docbench.docbench.docbench .db-send .ic { display: inline-flex; }
.docbench.docbench.docbench .db-pill .ic svg { width: 12px; height: 12px; }
.docbench.docbench.docbench .db-send { display: inline-flex; align-items: center; gap: 6px; }
.docbench.docbench.docbench .db-send .ic svg { width: 14px; height: 14px; }
.docbench.docbench.docbench .db-pill.owner { background: var(--db-wait-soft); color: var(--db-wait); }
.docbench.docbench.docbench .db-pill.assistant { background: var(--db-go-soft); color: var(--db-go); }
.docbench.docbench.docbench .db-toggle { display: none; }

/* ---------- 3단 골격 ---------- */
.docbench.docbench.docbench .db-shell { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: var(--db-rail) minmax(0, 1fr) var(--db-panel); grid-template-rows: minmax(0, 1fr) auto; }
.docbench.docbench.docbench .db-rail { grid-column: 1; grid-row: 1 / span 2; }
.docbench.docbench.docbench .db-main { grid-column: 2; grid-row: 1; }
.docbench.docbench.docbench .db-panel { grid-column: 3; grid-row: 1 / span 2; }
.docbench.docbench.docbench .db-dock { grid-column: 2; grid-row: 2; }
.docbench.docbench.docbench .db-rail, .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-panel { min-height: 0; overflow: auto; overscroll-behavior: contain; }
.docbench.docbench.docbench .db-rail { background: var(--db-surface); border-right: 1px solid var(--db-line); padding: 12px 10px 40px; }
.docbench.docbench.docbench .db-panel { background: var(--db-surface); border-left: 1px solid var(--db-line); display: flex; flex-direction: column; overflow: hidden; }
.docbench.docbench.docbench .db-panel:focus { outline: none; }
.docbench.docbench.docbench .db-main { position: relative; padding: 0 16px 120px; scroll-padding-top: 64px; }
.docbench.docbench.docbench .db-page { max-width: calc(74ch + 28px); margin: 0 auto; padding-left: 28px; }
.docbench.docbench.docbench .db-scrim { display: none; }

@container docbench (max-width: 1099px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: var(--db-rail) minmax(0, 1fr); }
  /* 겹쳐 뜨는 패널은 격자 칸이 아니라 작업대 전체를 기준으로 — 칸(3)을 그대로 두면 두 칸 격자에서 폭이 0 이 된다(0.3.0~0.5.0, 761~1099px) */
  .docbench.docbench.docbench .db-panel { grid-column: auto; grid-row: auto; position: absolute; inset: 0 0 0 auto; width: min(var(--db-panel), 100%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(105%); transition: transform .18s; }
  .docbench.docbench.docbench.panel-open .db-panel { transform: none; }
  .docbench.docbench.docbench .db-toggle.panel { display: inline-flex; }
  .docbench.docbench.docbench.panel-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
}
@container docbench (max-width: 760px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: minmax(0, 1fr); }
  .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-dock { grid-column: 1; }
  .docbench.docbench.docbench .db-rail { position: absolute; inset: 0 auto 0 0; width: min(300px, 88%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(-105%); transition: transform .18s; }
  .docbench.docbench.docbench.rail-open .db-rail { transform: none; }
  .docbench.docbench.docbench.rail-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
  .docbench.docbench.docbench .db-toggle.nav { display: inline-flex; }
  .docbench.docbench.docbench .db-brand small, .docbench.docbench.docbench .db-clock.plan, .docbench.docbench.docbench .db-clock .lbl, .docbench.docbench.docbench .db-pill .lbl, .docbench.docbench.docbench .db-bar .db-send .t, .docbench.docbench.docbench .db-claude .clk { display: none; }

@container docbench (max-width: 560px) {
  /* 휴대폰 너비: 위 띠가 한 줄에 들어가게 — 이름·Claude 글은 접고, 넘기기는 Claude 창 안에서(창이 기다리는 피드백을 보여 준다) */

  .docbench.docbench.docbench .db-me .n, .docbench.docbench.docbench .db-claude .lb, .docbench.docbench.docbench .db-bar .db-send.dockable { display: none; }
  .docbench.docbench.docbench .db-bar .db-claude .sh { display: inline; }
  .docbench.docbench.docbench .db-bar > .db-toggle, .docbench.docbench.docbench .db-bar > .db-me, .docbench.docbench.docbench .db-bar > .db-claude { flex: none; }
}
@container docbench (max-width: 460px) {
  .docbench.docbench.docbench .db-brand { display: none; }
  .docbench.docbench.docbench .db-bar { gap: 4px; padding-inline: 8px; }
  .docbench.docbench.docbench .db-pill { padding: 2px 8px; gap: 4px; }

@container docbench (max-width: 400px) {
  .docbench.docbench.docbench .db-bar .db-claude .sh { display: none; }
}

/* 중간 너비(태블릿·작은 노트북): 읽으며 적는 동안 문서를 가리지 않게 — 목록은 겹쳐 띄우고, 검토 패널은 옆에 둔다 */
@container docbench (min-width: 761px) and (max-width: 1099px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: minmax(0, 1fr); }
  .docbench.docbench.docbench.panel-open .db-shell { grid-template-columns: minmax(0, 1fr) min(var(--db-panel), 44%); }
  .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-dock { grid-column: 1; }
  .docbench.docbench.docbench .db-panel { position: static; transform: none; transition: none; box-shadow: none; width: auto; grid-column: 2; grid-row: 1 / span 2; display: none; }
  .docbench.docbench.docbench.panel-open .db-panel { display: flex; }
  .docbench.docbench.docbench.panel-open .db-scrim { display: none; }
  .docbench.docbench.docbench .db-rail { position: absolute; inset: 0 auto 0 0; width: min(300px, 88%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(-105%); transition: transform .18s; }
  .docbench.docbench.docbench.rail-open .db-rail { transform: none; }
  .docbench.docbench.docbench.rail-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
  .docbench.docbench.docbench .db-toggle.nav { display: inline-flex; }
}

/* 알림이 다음에 누를 단추(초안 칸의 저장, 보내기 막대)를 가리지 않게 — 넓으면 문서 칸 가운데 아래, 좁으면 위 띠 아래 */
@container docbench (min-width: 1100px) {
  .docbench.docbench.docbench .db-toast { left: calc(var(--db-rail) + (100% - var(--db-rail) - var(--db-panel)) / 2); max-width: calc(100% - var(--db-rail) - var(--db-panel) - 24px); }
}
@container docbench (min-width: 761px) and (max-width: 1099px) {
  .docbench.docbench.docbench.panel-open .db-toast { left: calc((100% - min(var(--db-panel), 44%)) / 2); max-width: calc(100% - min(var(--db-panel), 44%) - 24px); }
}
@container docbench (max-width: 760px) {
  .docbench.docbench.docbench .db-toast { bottom: auto; top: calc(var(--db-bar) + 10px); }
}

.docbench.docbench.docbench .db-md .db-figure { margin: 0 0 1em; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.docbench.docbench.docbench .db-md .db-img { max-width: 100%; max-height: 78vh; border: 1px solid var(--db-line); border-radius: 6px; background: repeating-conic-gradient(var(--db-sunk) 0% 25%, var(--db-surface) 0% 50%) 50% / 16px 16px; }
.docbench.docbench.docbench .db-md img.db-img-miss { min-width: 2em; min-height: 1.4em; outline: 1px dashed var(--db-line-2); }
.docbench.docbench.docbench .db-filecard { display: flex; align-items: center; gap: 12px; border: 1px solid var(--db-line); border-radius: 10px; background: var(--db-surface); padding: 14px 16px; max-width: 520px; }
.docbench.docbench.docbench .db-filecard > .ic svg { width: 28px; height: 28px; color: var(--db-ink-2); }
.docbench.docbench.docbench .db-filecard .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.docbench.docbench.docbench .db-filecard .t b { overflow-wrap: anywhere; }
.docbench.docbench.docbench .db-filecard .t small { color: var(--db-ink-3); font-size: 12px; }
.docbench.docbench.docbench .db-notice.db-row { justify-content: space-between; }
.docbench.docbench.docbench .db-notice.db-row > span { flex: 1; min-width: 14em; }

.docbench.docbench.docbench .db-fmt { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; background: var(--db-sunk); color: var(--db-ink-2); }
.docbench.docbench.docbench .db-fmt.claude { background: var(--db-chg-soft); color: var(--db-chg); cursor: help; }
.docbench.docbench.docbench .db-fm { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }
.docbench.docbench.docbench .db-fm-c { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; border-radius: 999px; padding: 0 9px; background: var(--db-sunk); color: var(--db-ink-2); line-height: 1.75; }
.docbench.docbench.docbench .db-fm-c svg { width: 12px; height: 12px; }
.docbench.docbench.docbench .db-fm-c b { font: 500 11px var(--db-font-mono); color: var(--db-ink-3); }
.docbench.docbench.docbench .db-fm-c.status { background: var(--db-info-soft); color: var(--db-info); font-weight: 600; }
.docbench.docbench.docbench .db-fm-c.tag { background: transparent; border: 1px solid var(--db-line); }
.docbench.docbench.docbench .db-fm-c.date.past { background: var(--db-wait-soft); color: var(--db-wait); }

.docbench.docbench.docbench .db-nav[data-group="data"] > .ic { color: var(--db-cat-gap); }
.docbench.docbench.docbench .db-nav[data-group="code"] > .ic { color: var(--db-cat-structure); }
.docbench.docbench.docbench .db-nav[data-group="office"] > .ic, .docbench.docbench.docbench .db-nav[data-group="pdf"] > .ic { color: var(--db-info); }
.docbench.docbench.docbench .db-nav[data-group="image"] > .ic { color: var(--db-cat-risk); }

/* ---------- 작업 공간 개요 (D88) ---------- */
.docbench.docbench.docbench .db-ov { max-width: 92ch; margin: 0 auto; }
.docbench.docbench.docbench .db-ov-purpose { margin: 6px 0 0; font-size: 15.5px; line-height: 1.65; color: var(--db-ink); }
.docbench.docbench.docbench .db-ov-purpose .db-linkbtn { font-size: 12.5px; }
.docbench.docbench.docbench .db-ov-h { margin: 22px 0 8px; font: 650 15px/1.4 var(--db-font-display); }
.docbench.docbench.docbench .db-stat .k.sub { font-size: 11.5px; opacity: .85; }
.docbench.docbench.docbench .db-linkbtn { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0; color: var(--db-info); cursor: pointer; font: inherit; text-align: left; }
.docbench.docbench.docbench .db-linkbtn:hover { text-decoration: underline; }
.docbench.docbench.docbench .db-linkbtn.soft { color: var(--db-ink-3); font-size: 12.5px; }
.docbench.docbench.docbench .db-linkbtn .ic svg { width: 13px; height: 13px; }
.docbench.docbench.docbench .db-ov-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--db-sunk); }
.docbench.docbench.docbench .db-ov-bar > span { flex-basis: 0; min-width: 3px; }
.docbench.docbench.docbench .db-ov-bar > span + span { border-left: 2px solid var(--db-surface); }
.docbench.docbench.docbench .db-ov-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12.5px; color: var(--db-ink-2); }
.docbench.docbench.docbench .db-ov-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.docbench.docbench.docbench .db-ov-legend i { width: 9px; height: 9px; border-radius: 2px; }
.docbench.docbench.docbench .db-ov-legend .ic svg { width: 13px; height: 13px; }
.docbench.docbench.docbench .db-ov-legend small { color: var(--db-ink-3); font-size: 11.5px; }
.docbench.docbench.docbench :is(.db-ov-bar > span, .db-ov-legend i).g-doc { background: var(--db-go); }
.docbench.docbench.docbench :is(.db-ov-bar > span, .db-ov-legend i).g-data { background: var(--db-cat-gap); }
.docbench.docbench.docbench :is(.db-ov-bar > span, .db-ov-legend i).g-code { background: var(--db-cat-structure); }
.docbench.docbench.docbench :is(.db-ov-bar > span, .db-ov-legend i).g-office { background: var(--db-info); }
.docbench.docbench.docbench :is(.db-ov-bar > span, .db-ov-legend i).g-pdf { background: var(--db-bad); }
.docbench.docbench.docbench :is(.db-ov-bar > span, .db-ov-legend i).g-image { background: var(--db-cat-risk); }
.docbench.docbench.docbench :is(.db-ov-bar > span, .db-ov-legend i).g-media { background: var(--db-chg); }
.docbench.docbench.docbench :is(.db-ov-bar > span, .db-ov-legend i).g-archive { background: var(--db-ink-2); }
.docbench.docbench.docbench :is(.db-ov-bar > span, .db-ov-legend i).g-other { background: var(--db-line-2); }
.docbench.docbench.docbench .db-ov-check .nt b { font-weight: 600; }
.docbench.docbench.docbench .db-ov-check > .db-btn { flex: none; align-self: center; }
.docbench.docbench.docbench .db-ov-paths { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.docbench.docbench.docbench .db-ov-paths .db-chip { font: 11.5px/1.7 var(--db-font-mono); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.docbench.docbench.docbench .db-ov-paths .db-hint { font-size: 11.5px; align-self: center; }
.docbench.docbench.docbench .db-ov-paths .db-chip .nt { margin-left: 6px; font: 11px/1.7 var(--db-font-body); color: var(--db-ink-3); }
.docbench.docbench.docbench .db-ov-check .scope { margin: 2px 0 0; font: 11.5px/1.5 var(--db-font-mono); }

.docbench.docbench.docbench .db-ov-rules { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 10px; font-size: 13px; }
.docbench.docbench.docbench .db-ov-rules.on { color: var(--db-ink-2); }
.docbench.docbench.docbench .db-ov-rules .db-hint { margin: 0; }
.docbench.docbench.docbench table.db-ov-folders { border-collapse: collapse; width: 100%; font-size: 13px; }
.docbench.docbench.docbench .db-ov-folders th, .docbench.docbench.docbench .db-ov-folders td { padding: 6px 10px; border-bottom: 1px solid var(--db-line); text-align: left; vertical-align: top; }
.docbench.docbench.docbench .db-ov-folders th { background: var(--db-sunk); font-size: 12px; color: var(--db-ink-2); font-weight: 600; white-space: nowrap; }
.docbench.docbench.docbench .db-ov-folders .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.docbench.docbench.docbench .db-ov-folders td.role { color: var(--db-ink-2); min-width: 14em; }
.docbench.docbench.docbench .db-ov-folders tr:last-child td { border-bottom: 0; }
.docbench.docbench.docbench .db-ov-meta { display: flex; flex-direction: column; gap: 6px; }
.docbench.docbench.docbench .db-ov-meta .db-hint { margin: 0; font-size: 12.5px; }
.docbench.docbench.docbench .db-ov-meta .row { display: flex; gap: 10px; align-items: baseline; }
.docbench.docbench.docbench .db-ov-meta .row .k { flex: none; width: 6.5em; font-size: 12px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-ov-folders td.nm { white-space: nowrap; overflow-wrap: normal; }

@container docbench (max-width: 560px) {
  .docbench.docbench.docbench .db-ov-folders :is(.sz, .md) { display: none; }

}
.docbench.docbench.docbench .db-ov-meta .db-fm { margin: 0; }
.docbench.docbench.docbench button.db-fm-c { border: 1px solid transparent; font-family: inherit; cursor: pointer; }
.docbench.docbench.docbench button.db-fm-c.tag { border-color: var(--db-line); }
.docbench.docbench.docbench button.db-fm-c:hover { border-color: var(--db-line-2); }

.docbench.docbench.docbench .db-ov-pick .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; }
.docbench.docbench.docbench .db-ov-pick .db-hint { margin: 6px 0 0; font-size: 12.5px; }
.docbench.docbench.docbench .db-ov-files { display: flex; flex-direction: column; border: 1px solid var(--db-line); border-radius: 9px; background: var(--db-surface); overflow: hidden; }
.docbench.docbench.docbench .db-ov-file { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border: 0; border-bottom: 1px solid var(--db-line); background: none; color: var(--db-ink); font: 12.5px/1.5 var(--db-font-mono); text-align: left; cursor: pointer; }

.docbench.docbench.docbench .db-ov-file .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docbench.docbench.docbench .db-ov-file small { flex: none; font: 11.5px var(--db-font-body); color: var(--db-ink-3); }
.docbench.docbench.docbench .db-ov-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 18px; }
.docbench.docbench.docbench .db-ov-foot { margin: 18px 0 8px; font-size: 12px; }

:where(.docbench.docbench.docbench) {
  --db-bg: #f4f6f3; --db-surface: #ffffff; --db-sunk: #eaeee9; --db-line: #d9dfd9; --db-line-2: #c3ccc5;
  --db-ink: #17201b; --db-ink-2: #46514b; --db-ink-3: #6f7a74;
  --db-go: #0b7a57; --db-go-ink: #ffffff; --db-go-soft: #dcefe6;
  --db-wait: #95600c; --db-wait-soft: #fbeed3;
  --db-bad: #b13a33; --db-bad-soft: #f7e2df;
  --db-info: #2d5b88; --db-info-soft: #e1eaf4;
  --db-mark: #ffe58a; --db-mark-ink: #3a2e00;
  --db-chg: #6a4fb3; --db-chg-soft: #ece6fa;
  --db-shadow: 0 1px 2px rgba(23,32,27,.06), 0 8px 24px rgba(23,32,27,.10);
  /* \uD53C\uB4DC\uBC31 \uC885\uB958(D85) \u2014 \uAE00\uC790\uC0C9\uC73C\uB85C\uB3C4 \uC77D\uD788\uB294 \uC9C4\uD558\uAE30 */
  --db-cat-typo: #5d6b72; --db-cat-fact: #2f5d8a; --db-cat-conflict: #b23a32; --db-cat-duplicate: #6b4fb3; --db-cat-gap: #8f5c0c;
  --db-cat-structure: #17707a; --db-cat-clarity: #4c7520; --db-cat-risk: #a8326e; --db-cat-direction: #0b7a57; --db-cat-none: #6f7a74;
  --db-font-body: "Pretendard", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --db-font-display: var(--db-font-body);
  --db-font-mono: "IBM Plex Mono", "D2Coding", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --db-rail: 260px; --db-panel: 360px; --db-bar: 50px; --db-radius: 8px;
  color-scheme: light;
}

:where(:root[data-theme="dark"] .docbench.docbench.docbench[data-theme="auto"]) {

  --db-info: #80b2e4; --db-info-soft: #17283a;
  --db-mark: #6b5a12; --db-mark-ink: #fff4c7;

  --db-shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
  --db-cat-typo: #a3b3ba; --db-cat-fact: #80b2e4; --db-cat-conflict: #ef7b73; --db-cat-duplicate: #b8a2f0; --db-cat-gap: #e3ab45;
  --db-cat-structure: #5cc6cf; --db-cat-clarity: #a6d16a; --db-cat-risk: #f08cc0; --db-cat-direction: #3fc597; --db-cat-none: #85918a;
  color-scheme: dark;
}

/* ---------- \uD638\uC2A4\uD2B8 CSS \uCC28\uB2E8\uB9C9 ----------
   \uB300\uC2DC\uBCF4\uB4DC \uC804\uC5ED \uADDC\uCE59(header{\u2026}, .card h2{\u2026}, button{\u2026})\uC774 \uC791\uC5C5\uB300 \uC548\uC73C\uB85C \uC0C8\uC9C0 \uC54A\uAC8C \uC548\uCABD \uC694\uC18C\uB97C \uBE0C\uB77C\uC6B0\uC800 \uAE30\uBCF8\uAC12\uC73C\uB85C
   \uB418\uB3CC\uB9B0 \uB4A4 \uC544\uB798 \uADDC\uCE59\uB9CC \uC5B9\uB294\uB2E4. svg\xB7img \uB294 \uC81C\uC678(\uC18D\uC131\uC73C\uB85C \uC900 \uD06C\uAE30\xB7\uC0C9\uAE4C\uC9C0 \uB418\uB3CC\uC544\uAC04\uB2E4). */
.docbench.docbench.docbench :where(header, nav, main, aside, section, article, footer, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, dl, dt, dd, blockquote, pre, code, kbd, table, thead, tbody, tfoot, tr, th, td, caption, button, input, textarea, select, label, dialog, mark, a, b, i, strong, em, del, ins, s, small, sup, sub, hr, details, summary, figure, figcaption) { all: revert; }

/* ---------- \uBC14\uD0D5 ---------- */
.docbench.docbench.docbench { container: docbench / inline-size; position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; min-height: 420px; background: var(--db-bg); color: var(--db-ink); font: 400 15px/1.7 var(--db-font-body); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; text-align: left; outline: none; letter-spacing: normal; word-spacing: normal; text-transform: none; text-indent: 0; text-shadow: none; font-style: normal; white-space: normal; }
.docbench.docbench.docbench *, .docbench.docbench.docbench *::before, .docbench.docbench.docbench *::after { box-sizing: border-box; }
.docbench.docbench.docbench button, .docbench.docbench.docbench input, .docbench.docbench.docbench textarea, .docbench.docbench.docbench select { font: inherit; color: inherit; letter-spacing: normal; }
.docbench.docbench.docbench button { cursor: pointer; }
.docbench.docbench.docbench :focus-visible { outline: 2px solid var(--db-go); outline-offset: 2px; border-radius: 4px; }
.docbench.docbench.docbench a { color: var(--db-info); }
.docbench.docbench.docbench [hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .docbench.docbench.docbench * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.docbench.docbench.docbench .db-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--db-line-2); background: var(--db-surface); border-radius: 7px; padding: 4px 11px; font-size: 13px; font-weight: 500; line-height: 1.35; white-space: nowrap; color: var(--db-ink); }
.docbench.docbench.docbench .db-btn:hover { border-color: var(--db-ink-3); }
.docbench.docbench.docbench .db-btn:disabled { opacity: .5; cursor: default; }
.docbench.docbench.docbench .db-btn.primary { background: var(--db-go); border-color: var(--db-go); color: var(--db-go-ink); }
.docbench.docbench.docbench .db-btn.ghost { border-color: transparent; background: transparent; }

/* \uC911\uAC04 \uB108\uBE44(\uD0DC\uBE14\uB9BF\xB7\uC791\uC740 \uB178\uD2B8\uBD81): \uC77D\uC73C\uBA70 \uC801\uB294 \uB3D9\uC548 \uBB38\uC11C\uB97C \uAC00\uB9AC\uC9C0 \uC54A\uAC8C \u2014 \uBAA9\uB85D\uC740 \uACB9\uCCD0 \uB744\uC6B0\uACE0, \uAC80\uD1A0 \uD328\uB110\uC740 \uC606\uC5D0 \uB454\uB2E4 */
@container docbench (min-width: 761px) and (max-width: 1099px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: minmax(0, 1fr); }
  .docbench.docbench.docbench.panel-open .db-shell { grid-template-columns: minmax(0, 1fr) min(var(--db-panel), 44%); }
  .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-dock { grid-column: 1; }
  .docbench.docbench.docbench .db-panel { position: static; transform: none; transition: none; box-shadow: none; width: auto; grid-column: 2; grid-row: 1 / span 2; display: none; }
  .docbench.docbench.docbench.panel-open .db-panel { display: flex; }
  .docbench.docbench.docbench.panel-open .db-scrim { display: none; }
  .docbench.docbench.docbench .db-rail { position: absolute; inset: 0 auto 0 0; width: min(300px, 88%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(-105%); transition: transform .18s; }
  .docbench.docbench.docbench.rail-open .db-rail { transform: none; }
  .docbench.docbench.docbench.rail-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
  .docbench.docbench.docbench .db-toggle.nav { display: inline-flex; }
}
.docbench.docbench.docbench .db-chip-s.created { background: var(--db-info-soft); color: var(--db-info); }
.docbench.docbench.docbench .db-msg.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* \uC54C\uB9BC\uC774 \uB2E4\uC74C\uC5D0 \uB204\uB97C \uB2E8\uCD94(\uCD08\uC548 \uCE78\uC758 \uC800\uC7A5, \uBCF4\uB0B4\uAE30 \uB9C9\uB300)\uB97C \uAC00\uB9AC\uC9C0 \uC54A\uAC8C \u2014 \uB113\uC73C\uBA74 \uBB38\uC11C \uCE78 \uAC00\uC6B4\uB370 \uC544\uB798, \uC881\uC73C\uBA74 \uC704 \uB760 \uC544\uB798 */
@container docbench (min-width: 1100px) {
  .docbench.docbench.docbench .db-toast { left: calc(var(--db-rail) + (100% - var(--db-rail) - var(--db-panel)) / 2); max-width: calc(100% - var(--db-rail) - var(--db-panel) - 24px); }
}
@container docbench (min-width: 761px) and (max-width: 1099px) {
  .docbench.docbench.docbench.panel-open .db-toast { left: calc((100% - min(var(--db-panel), 44%)) / 2); max-width: calc(100% - min(var(--db-panel), 44%) - 24px); }
}
@container docbench (max-width: 760px) {
  .docbench.docbench.docbench .db-toast { bottom: auto; top: calc(var(--db-bar) + 10px); }
}

- \uBB38\uC11C\uB97C \uB204\uB974\uBA74 \uC5F4\uB9BD\uB2C8\uB2E4 \u2014 \uB9C8\uD06C\uB2E4\uC6B4\uC740 \uBB3C\uB860 YAML\xB7JSON \uAC19\uC740 \uC124\uC815 \uD30C\uC77C(\uD0A4\uB9C8\uB2E4 \uC139\uC158), CSV \uD45C, \uAE00\xB7\uB85C\uADF8, Word\xB7PowerPoint\xB7Excel\xB7\uD55C\uAE00(HWPX)\xB7Jupyter(\uAE00\uC744 \uBF51\uC544 \uC77D\uAE30\uB9CC), PDF\xB7\uADF8\uB9BC\uAE4C\uC9C0. \uC791\uC5C5\uB300\uAC00 \uC5F4\uC9C0 \uC54A\uB294 \uD30C\uC77C\uC740 \uD750\uB9AC\uAC8C \uBCF4\uC785\uB2C8\uB2E4(\uCF54\uB4DC\uB294 \uAE30\uBCF8\uC73C\uB85C \uBE60\uC9D1\uB2C8\uB2E4).
- \uC790\uC8FC \uBCF4\uB294 \uD3F4\uB354\xB7\uBB38\uC11C\uB294 \uC904 \uB05D\uC758 \uD540\uC73C\uB85C **\uACE0\uC815**\uD558\uBA74 \uC704\uCABD "\uC791\uC5C5 \uC911"\uC5D0 \uB298 \uC788\uC2B5\uB2C8\uB2E4.
- \uD734\uB300\uD3F0\xB7\uD0DC\uBE14\uB9BF \uBE0C\uB77C\uC6B0\uC800\uB294 \uD3F4\uB354\uC5D0 \uC4F0\uC9C0 \uBABB\uD574 **\uB458\uB7EC\uBCF4\uAE30\uC640 \uC5F0\uC2B5**\uAE4C\uC9C0\uB9CC \uB429\uB2C8\uB2E4. \uB0B4 \uBB38\uC11C\uC640 Claude \uC791\uC5C5\uC740 PC \uC758 \uC5E3\uC9C0\xB7\uD06C\uB86C\uC5D0\uC11C \uC5EC\uC138\uC694.

## 2. \uC77D\uC73C\uBA70 \uC801\uC5B4 \uB450\uAE30

- \uBB38\uC11C\uB294 \uC81C\uBAA9\uB9C8\uB2E4 **\uC139\uC158**(\uC81C\uBAA9 \uD558\uB098\uC640 \uADF8 \uC544\uB798 \uAE00)\uC73C\uB85C \uB098\uB269\uB2C8\uB2E4. \uD0A4 \`1\`\uC740 \uBAA9\uCC28\uB9CC, \`0\`\uC740 \uC804\uBD80 \uD3BC\uCE69\uB2C8\uB2E4.
- \uC139\uC158 \uC606 \uB9D0\uD48D\uC120\uC744 \uB204\uB974\uAC70\uB098 \uBB38\uAD6C\uB97C \uACE0\uB974\uBA74 **\uADF8 \uC790\uB9AC\uC5D0 \uC791\uC740 \uCE78**\uC774 \uC5F4\uB9BD\uB2C8\uB2E4. \uC801\uC740 \uAC83\uC740 **\uCD08\uC548**\uC73C\uB85C \uBAA8\uC774\uACE0 \uC544\uC9C1 \uC544\uBB34\uC5D0\uAC8C\uB3C4 \uAC00\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4 \u2014 \uC77D\uC5B4 \uAC00\uBA70 \uACE0\uCE58\uACE0, \uC9C0\uC6B0\uACE0, \uD569\uCE58\uC138\uC694.
- \uC694\uCCAD \uBB38\uAD6C\uAC00 \uACE0\uBBFC\uB418\uBA74 **\uC774\uB807\uAC8C \uBC14\uAFD4**\uB85C \uBC14\uAFC0 \uAE00\uC744 \uC9C1\uC811 \uC4F0\uAC70\uB098 *\uC904\uC774\uAE30\xB7\uADFC\uAC70\xB7\uD45C\uB85C* \uAC19\uC740 \uB2E8\uCD94\uB97C \uB204\uB974\uC138\uC694. \uAE09\uD55C \uAC83\uC740 **\u2605**.
- \uC9C1\uC811 \uACE0\uCCD0\uB3C4 \uB429\uB2C8\uB2E4(\uC139\uC158 \uB2E8\uC704). \uADF8\uC0AC\uC774 \uB2E4\uB978 \uC0AC\uB78C\uC774\uB098 \uD504\uB85C\uADF8\uB7A8\uC774 \uAC19\uC740 \uACF3\uC744 \uBC14\uAFE8\uC73C\uBA74 \uCC28\uC774\uB97C \uBCF4\uC5EC \uC8FC\uACE0 \uACE0\uB974\uAC8C \uD569\uB2C8\uB2E4.

\uCC98\uC74C \uC800\uC7A5\uD560 \uB54C **\uAE30\uB85D \uD3F4\uB354**(\uD53C\uB4DC\uBC31\xB7\uC774\uB825\uC744 \uB458 \uACF3)\uB97C \uACE0\uB985\uB2C8\uB2E4. \uBB38\uC11C \uD3F4\uB354\uC5D0\uB294 \uC544\uBB34\uAC83\uB3C4 \uB9CC\uB4E4\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. HTML \uD30C\uC77C\uC744 \uB354\uBE14\uD074\uB9AD\uD574 \uC5F4\uC5C8\uB2E4\uBA74 \uC0C8 \uCC3D\uB9C8\uB2E4 \uBB38\uC11C \uD3F4\uB354\uC640 \uAE30\uB85D \uD3F4\uB354\uB97C \uB2E4\uC2DC \uACE0\uB985\uB2C8\uB2E4(\uAC19\uC740 \uACF3\uC744 \uACE0\uB974\uBA74 \uAE30\uB85D\uC774 \uC774\uC5B4\uC9D1\uB2C8\uB2E4).

## 3. Claude \uC640 \uC8FC\uACE0\uBC1B\uAE30

- \uB2E4 \uC77D\uC5C8\uC73C\uBA74 \uC624\uB978\uCABD \uAC80\uD1A0 \uD328\uB110\uC758 **\uCD08\uC548**\uC5D0\uC11C \uBCF4\uB0BC \uAC83\uC744 \uACE0\uB974\uACE0(\u2605\uB9CC \uBA3C\uC800\uB3C4 \uB429\uB2C8\uB2E4), \uBB36\uC74C \uC804\uCCB4\uC5D0 \uBD99\uC77C \uB9D0\uC744 \uD55C \uC904 \uC801\uC5B4 **\uBCF4\uB0B4\uAE30**. \uD558\uB098\uC529 \uB530\uB85C \uAC00\uC9C0 \uC54A\uACE0 \uD55C \uBC88\uC5D0 \uAC11\uB2C8\uB2E4.
- **\uBC14\uB85C \uACE0\uCE58\uAE30**(\uAE30\uBCF8)\uBA74 Claude \uAC00 \uBB38\uC11C\uB97C \uACE0\uCE58\uACE0, **\uC81C\uC548\uB9CC**\uC774\uBA74 \uACE0\uCE5C \uAE00\uC744 \uC81C\uC548\uC73C\uB85C \uC62C\uB9BD\uB2C8\uB2E4. \uACB0\uACFC\uB294 **\uBCFC \uAC83**\uC5D0 \uD68C\uCC28\uBCC4\uB85C \uBAA8\uC774\uACE0, \uD558\uB098\uC529 \uD655\uC778\xB7\uB418\uB3CC\uB9AC\uAE30\xB7\uB2E4\uC2DC \uC694\uCCAD\uC744 \uACE0\uB985\uB2C8\uB2E4.
- \uB0B4\uAC00 \uB2E4 \uC77D\uAE30 \uC804\uC5D0 **Claude \uAC80\uD1A0**\uB85C \uBA3C\uC800 \uC81C\uC548\xB7\uC9C8\uBB38\uC744 \uBC1B\uAC70\uB098, \uAE34 \uBB38\uC11C\uB97C **\uC77D\uAE30 \uC815\uB9AC**(\uC811\uC744 \uACF3\xB7\uBA3C\uC800 \uBCFC \uACF3)\uD574 \uB2EC\uB77C\uACE0 \uD560 \uC218\uB3C4 \uC788\uC2B5\uB2C8\uB2E4.
- Claude \uAC00 \uBA3C\uC800 \uB0A8\uAE34 \uC758\uACAC\uACFC \uC9C8\uBB38\uC740 **\uBCFC \uAC83**\uC758 "Claude \uAC00 \uBA3C\uC800 \uB0A8\uAE34 \uAC83"\uC5D0 \uBAA8\uC785\uB2C8\uB2E4. \uC758\uACAC\uC5D0 \uB3D9\uC758\uD558\uBA74 **\uBC18\uC601\uD574** \uD55C \uBC88, \uC9C8\uBB38\uC5D0\uB294 **\uB2F5\uD558\uAE30**.

| \uC5F0\uACB0 | \uD558\uB294 \uC77C | \uC900\uBE44 |
|---|---|---|

Claude \uB294 \uB0B4 **\uAD6C\uB3C5 \uB85C\uADF8\uC778 \uADF8\uB300\uB85C** \uC501\uB2C8\uB2E4(API \uD0A4 \uC5C6\uC74C). \uBB38\uC11C\uB97C \uC9C1\uC811 \uACE0\uCE58\uC9C0 \uC54A\uACE0 \uACB0\uACFC\uB9CC \uB0B4\uBA70, \uC791\uC5C5\uB300\uAC00 \uADF8\uC0AC\uC774 \uBB38\uC11C\uAC00 \uBC14\uB00C\uC9C0 \uC54A\uC558\uB294\uC9C0 \uD655\uC778\uD574 \uBC18\uC601\uD558\uACE0 \uC774\uB825\uC744 \uB0A8\uAE41\uB2C8\uB2E4.

> \uC774 \uC5F0\uC2B5 \uACF5\uAC04\uC5D0\uC11C\uB294 **\uD749\uB0B4 Claude** \uAC00 \uB2F5\uD569\uB2C8\uB2E4(\uC2E4\uC81C\uB85C \uBCF4\uB0B4\uC9C0 \uC54A\uC74C). \uC5F0\uC2B5\uC6A9 \uAE30\uD68D\uC11C\uC758 **\uC77C\uC815** \uC9C8\uBB38\uC5D0 **\uB2F5\uD558\uAE30**\uB85C \uAC12(\uC608: 11\uC6D4 3~14\uC77C, \uAE40\uBBFC\uC9C0)\uC744 \uC801\uC5B4 \uBCF4\uB0B4\uAC70\uB098, "\uC774\uB807\uAC8C \uBC14\uAFD4"\uB85C \uCD08\uC548\uC744 \uBA87 \uAC1C \uB9CC\uB4E0 \uB4A4 \uD55C \uBC88\uC5D0 \uBCF4\uB0B4 \uBCF4\uC138\uC694 \u2014 \uACE0\uCE68 \u2192 \uBCFC \uAC83 \u2192 \uB418\uB3CC\uB9AC\uAE30\uAE4C\uC9C0 \uBBF8\uB9AC \uBCFC \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC704\uC758 **Claude \uAC80\uD1A0**\uB3C4 \uB20C\uB7EC \uBCF4\uC138\uC694.

## 4. \uC774\uB984\uACFC \uACC4\uC815

\uC774\uB984\uC744 \uBB3B\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uC774 \uBE0C\uB77C\uC6B0\uC800\uC5D0 \uACC4\uC815\uC774 \uC800\uC808\uB85C \uC0DD\uAE30\uACE0, \uC624\uB978\uCABD \uC704 **\uB098**\uB97C \uB204\uB974\uBA74 \uD45C\uC2DC \uC774\uB984\uC744 \uC815\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4(\uC5EC\uB7FF\uC774 \uD568\uAED8 \uC4F8 \uB54C \uC11C\uB85C \uAD6C\uBD84\uB429\uB2C8\uB2E4).

## 5. \uB354 \uB458\uB7EC\uBCF4\uAE30

\uC67C\uCABD \uBAA9\uB85D\uC758 **\uD65C\uC6A9 \uAC00\uC774\uB4DC** \uD3F4\uB354\uC5D0 \uC138 \uBB38\uC11C\uAC00 \uB354 \uC788\uC2B5\uB2C8\uB2E4. \uBAA8\uB450 \uC5F0\uC2B5\uC6A9\uC774\uB77C \uC801\uACE0 \uBCF4\uB0B4 \uBD10\uB3C4 \uB429\uB2C8\uB2E4.

## \uAC1C\uBC1C \u2014 \uC124\uACC4 \uBB38\uC11C \uB9AC\uBDF0

\uB9AC\uBDF0 \uC758\uACAC\uC774 PR \uB313\uAE00, \uBA54\uC2E0\uC800, \uD68C\uC758\uB85D\uC5D0 \uD769\uC5B4\uC9C0\uBA74 \uBB34\uC5C7\uC774 \uBC18\uC601\uB410\uB294\uC9C0 \uB2E4\uC2DC \uCC3E\uC544\uC57C \uD569\uB2C8\uB2E4.

**\uC774\uB807\uAC8C**

1. \uC800\uC7A5\uC18C\uC758 \`docs/\` \uD3F4\uB354\uB97C \uC5FD\uB2C8\uB2E4. \uBB38\uC11C\uB294 \uADF8 \uC790\uB9AC\uC5D0 \uC788\uACE0, \uAE30\uB85D(\uC758\uACAC\xB7\uC774\uB825)\uC740 \uB530\uB85C \uC313\uC785\uB2C8\uB2E4.
2. \uC77D\uC73C\uBA74\uC11C \uC139\uC158\uB9C8\uB2E4 \uC9E7\uAC8C \uC801\uC2B5\uB2C8\uB2E4. "\uD398\uC774\uC9C0 \uB098\uB204\uAE30\uAC00 \uBE60\uC84C\uB2E4", "\uC774 \uBAA9\uB85D\uC740 \uD45C\uB85C". \uAE09\uD55C \uAC83\uC5D0\uB294 \u2605.
3. \uB2E4 \uC77D\uC73C\uBA74 **\u2605\uB9CC** \uACE8\uB77C \uBA3C\uC800 \uBCF4\uB0B4\uACE0, \uB098\uBA38\uC9C0\uB294 \uB9AC\uBDF0\uAC00 \uB05D\uB09C \uB4A4 \uD55C \uBC88\uC5D0 \uBCF4\uB0C5\uB2C8\uB2E4.
4. **\uBCFC \uAC83**\uC5D0\uC11C \uACE0\uCE5C \uC139\uC158\uC758 \uBC14\uB010 \uACF3\uC744 \uBCF4\uACE0 \uD655\uC778\uD558\uAC70\uB098 \uB418\uB3CC\uB9BD\uB2C8\uB2E4. \uD655\uC778\uD55C \uD68C\uCC28\uB294 **\uC694\uC57D \uBCF5\uC0AC**\uB85C \uCEE4\uBC0B \uBA54\uC2DC\uC9C0\uB098 PR \uC124\uBA85\uC5D0 \uBD99\uC785\uB2C8\uB2E4.

**\uC5BB\uB294 \uAC83**: \uC758\uACAC\uACFC \uBC18\uC601 \uACB0\uACFC\uAC00 \uC139\uC158 \uB2E8\uC704\uB85C \uB0A8\uC2B5\uB2C8\uB2E4. \uC190\uB300\uC9C0 \uC54A\uC740 \uC904\uC740 \uC904\uBC14\uAFC8\uAE4C\uC9C0 \uADF8\uB300\uB85C\uB77C git diff \uC5D0 \uACE0\uCE5C \uACF3\uB9CC \uB098\uC635\uB2C8\uB2E4.

## \uC778\uD504\uB77C\xB7\uC6B4\uC601 \u2014 \uB7F0\uBD81 \uC815\uBE44

\uB7F0\uBD81\uC740 \uC7A5\uC560\uAC00 \uB0AC\uC744 \uB54C\uB9CC \uD3BC\uCCD0 \uBCF4\uAC8C \uB418\uACE0, \uADF8\uC0AC\uC774 \uBE48\uCE78\uACFC \uB0A1\uC740 \uC808\uCC28\uAC00 \uC313\uC785\uB2C8\uB2E4.

**\uC774\uB807\uAC8C**

1. \uB7F0\uBD81 \uD3F4\uB354\uB97C \uC5FD\uB2C8\uB2E4. \`[\uC791\uC5C5 \uD6C4 \uAE30\uC785]\`, \`TODO\` \uAC19\uC740 \uBE48\uCE78\uC774 \uD615\uAD11\uC73C\uB85C \uBCF4\uC774\uACE0 \uBB38\uC11C \uC704\uC5D0 \uBE48\uCE78 \uC218\uAC00 \uB098\uC635\uB2C8\uB2E4.
2. **Claude \uAC80\uD1A0 \u2192 \uC81C\uC548\xB7\uC9C8\uBB38 \uBC1B\uAE30**\uB97C \uACE0\uB974\uACE0, \uBC94\uC704\uB97C \uAC19\uC740 \uD3F4\uB354\uC758 \uBB38\uC11C\uB85C \uB113\uD799\uB2C8\uB2E4. \uBB38\uC11C\uB07C\uB9AC \uC5B4\uAE0B\uB09C \uC6A9\uC5B4\uB098 \uC22B\uC790\uB3C4 \uC9DA\uC5B4 \uC90D\uB2C8\uB2E4.
3. \uC9C8\uBB38\uC5D0\uB294 \uC544\uB294 \uAC12\uC744 \uB2F5\uD558\uACE0, \uC81C\uC548\uC740 \uBC14\uB010 \uACF3\uC744 \uBCF4\uACE0 \uC801\uC6A9\uD569\uB2C8\uB2E4.
4. \uBC14\uB010 \uC808\uCC28\uB294 **\uBCC0\uACBD \uC774\uB825**(\uC67C\uCABD **\uC791\uC5C5\uB300** \uC544\uB798)\uC5D0 \uB204\uAC00, \uC5B8\uC81C, \uC5B4\uB5A4 \uC758\uACAC\uC73C\uB85C \uBC14\uAFE8\uB294\uC9C0 \uB0A8\uC2B5\uB2C8\uB2E4.

**\uC5BB\uB294 \uAC83**: \uC7A5\uC560\uAC00 \uB098\uAE30 \uC804\uC5D0 \uB7F0\uBD81\uC774 \uCD5C\uC2E0\uC774 \uB418\uACE0, "\uC774 \uC808\uCC28 \uB204\uAC00 \uBC14\uAFE8\uC9C0?"\uC5D0 \uBC14\uB85C \uB2F5\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.

## \uB370\uC774\uD130\xB7AI \u2014 \uC2E4\uD5D8 \uBCF4\uACE0\uC11C \uAC80\uC99D

\uC22B\uC790\uAC00 \uCE21\uC815\uAC12\uC778\uC9C0 \uCD94\uC815\uAC12\uC778\uC9C0 \uC11E\uC5EC \uC788\uC73C\uBA74 \uC77D\uB294 \uC0AC\uB78C\uC774 \uD310\uB2E8\uD560 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4.

**\uC774\uB807\uAC8C**

1. \uADFC\uAC70 \uD45C\uAE30\uB97C \uC501\uB2C8\uB2E4: \`[\uC2E4\uCE21]\` \`[\uBB38\uC11C]\` \`[\uC870\uC0AC]\` \`[\uCD94\uC815]\` \`[\uBBF8\uD655\uC778]\`. \uD654\uBA74\uC774 \uC0C9\uC73C\uB85C \uB098\uB220 \uBCF4\uC5EC \uC90D\uB2C8\uB2E4.
2. **Claude \uAC80\uD1A0**\uB97C "\uADFC\uAC70 \uC5C6\uB294 \uC218\uCE58\uC640 \uD45C\uAE30\uAC00 \uBE60\uC9C4 \uC8FC\uC7A5\uC744 \uC9DA\uC5B4 \uC918"\uB77C\uB294 \uB9D0\uACFC \uD568\uAED8 \uBCF4\uB0C5\uB2C8\uB2E4.
3. \uC9C8\uBB38\uC73C\uB85C \uB3CC\uC544\uC628 \uACF3\uC5D0\uB294 \uCD9C\uCC98\uB97C \uB2F5\uD558\uACE0, \uACE0\uCE68\uC740 \uBC14\uB010 \uACF3\uC744 \uD655\uC778\uD569\uB2C8\uB2E4. Claude \uB294 \uD45C\uAE30\uB97C \uC9C0\uC6B0\uAC70\uB098 \uC22B\uC790\uB97C \uC9C0\uC5B4\uB0B4\uC9C0 \uB9D0\uB77C\uB294 \uC9C0\uC2DC\uB97C \uB298 \uD568\uAED8 \uBC1B\uC2B5\uB2C8\uB2E4.

**\uC5BB\uB294 \uAC83**: \uC22B\uC790\uB9C8\uB2E4 \uADFC\uAC70\uAC00 \uBD99\uC740 \uBCF4\uACE0\uC11C\uAC00 \uB418\uACE0, \uAC80\uD1A0\uAC00 \uB290\uB08C\uC774 \uC544\uB2C8\uB77C \uADFC\uAC70 \uD45C\uAE30\uB97C \uD558\uB098\uC529 \uC9DA\uC73C\uBA70 \uC774\uC5B4\uC9D1\uB2C8\uB2E4.

## \uC11C\uBE44\uC2A4 \uAE30\uD68D\xB7PM \u2014 \uAE30\uD68D\uC11C \uC758\uACAC \uBAA8\uC73C\uAE30

\uB9AC\uBDF0\uC5B4 \uB2E4\uC12F \uBA85\uC758 \uC758\uACAC\uC744 \uAE30\uD68D\uC11C \uD558\uB098\uC5D0 \uBAA8\uC73C\uB294 \uB370\uB9CC \uBC18\uB098\uC808\uC774 \uAC78\uB9AC\uAE30\uB3C4 \uD569\uB2C8\uB2E4.

**\uC774\uB807\uAC8C**

1. \uAE30\uD68D\uC11C \uD3F4\uB354\uB97C \uC5FD\uB2C8\uB2E4. \uCC98\uC74C \uC800\uC7A5\uD560 \uB54C \uAE30\uB85D \uD3F4\uB354\uB97C **\uBB38\uC11C \uD3F4\uB354 \uC548\uC5D0 \uB450\uAE30**\uB85C \uACE0\uB974\uBA74, \uAC19\uC740 \uD3F4\uB354\uB97C \uC5EC\uB294 \uC0AC\uB78C\uB07C\uB9AC \uACB0\uACFC\uC640 \uC774\uB825\uC744 \uD568\uAED8 \uBD05\uB2C8\uB2E4(git \uC73C\uB85C \uB098\uB204\uB294 \uD300\uC5D0 \uB9DE\uC2B5\uB2C8\uB2E4).
2. \uB9AC\uBDF0\uC5B4\uB294 \uAC01\uC790 \uBB38\uAD6C\uB97C \uACE8\uB77C \uADF8 \uC790\uB9AC\uC5D0 \uC801\uACE0, \uACE0\uCE60 \uAE00\uC774 \uBD84\uBA85\uD558\uBA74 **\uC774\uB807\uAC8C \uBC14\uAFD4**\uB85C \uBC14\uAFC0 \uAE00\uC744 \uC9C1\uC811 \uC501\uB2C8\uB2E4. \uBCF4\uB0B4\uAE30 \uC804\uC758 \uCD08\uC548\uC740 \uC801\uC740 \uC0AC\uB78C\uC5D0\uAC8C\uB9CC \uBCF4\uC785\uB2C8\uB2E4.
3. \uB9AC\uBDF0\uC5B4\uB294 \uB2E4 \uC801\uC73C\uBA74 \uBD99\uC77C \uB9D0 \uD55C \uC904("\uACB0\uB860\uC740 \uADF8\uB300\uB85C, \uADFC\uAC70\uB9CC \uBCF4\uAC15")\uACFC \uD568\uAED8 **\uC81C\uC548\uB9CC**\uC73C\uB85C \uBCF4\uB0C5\uB2C8\uB2E4. \uBB38\uC11C\uB294 \uC544\uC9C1 \uADF8\uB300\uB85C\uC785\uB2C8\uB2E4.
4. \uAE30\uD68D\uC790\uB294 **\uBCFC \uAC83**\uC5D0\uC11C \uB9AC\uBDF0\uC5B4\uBCC4 \uD68C\uCC28\uB97C \uBCF4\uBA70 \uC81C\uC548\uC744 **\uC801\uC6A9**\uD558\uAC70\uB098 **\uAC70\uC808**\uD569\uB2C8\uB2E4. \uB9AC\uBDF0 \uD68C\uC758\uC5D0\uC11C \uB4E4\uC740 \uB9D0\uC740 \uAE30\uD68D\uC790\uAC00 \uADF8 \uC790\uB9AC\uC5D0 \uC801\uC5B4 \uB450\uC5C8\uB2E4\uAC00 \uD68C\uC758 \uB4A4 \uD55C \uBC88\uC5D0 \uBCF4\uB0B4\uB3C4 \uB429\uB2C8\uB2E4.

**\uC5BB\uB294 \uAC83**: \uC758\uACAC \uBAA8\uC73C\uAE30, \uBC18\uC601, \uD655\uC778\uC774 \uBB38\uC11C \uD55C \uACF3\uC5D0\uC11C \uB05D\uB098\uACE0, \uC5B4\uB290 \uC758\uACAC\uC774 \uC5B4\uB5BB\uAC8C \uBC18\uC601\uB410\uB294\uC9C0 \uB0A8\uC2B5\uB2C8\uB2E4.

## \uC601\uC5C5\xB7\uB9C8\uCF00\uD305 \u2014 \uAC19\uC740 \uAE30\uC900\uC73C\uB85C \uC5EC\uB7EC \uBB38\uC11C

\uC81C\uC548\uC11C\uC640 \uBCF4\uB3C4\uC790\uB8CC\uB294 \uBB38\uC11C\uB9C8\uB2E4 \uAC19\uC740 \uD1A4\uACFC \uAE08\uCE59\uC5B4\uB97C \uC9C0\uCF1C\uC57C \uD569\uB2C8\uB2E4.

**\uC774\uB807\uAC8C**

1. **\uB298 \uC9C0\uD0AC \uC9C0\uC2DC**\uC5D0 \uD55C \uBC88 \uC801\uC5B4 \uB461\uB2C8\uB2E4. \uC608: "\uC874\uB313\uB9D0", "\uACBD\uC7C1\uC0AC \uC774\uB984\uC740 \uC4F0\uC9C0 \uC54A\uB294\uB2E4", "\uC218\uCE58\uB294 \uCD9C\uCC98\uC640 \uD568\uAED8".
2. \uBB38\uC11C\uB9C8\uB2E4 \uACE0\uCE60 \uACF3\uB9CC \uC801\uC5B4 \uBCF4\uB0B4\uBA74 \uB298 \uC9C0\uD0AC \uC9C0\uC2DC\uAC00 \uB9E4\uBC88 \uD568\uAED8 \uAC11\uB2C8\uB2E4.
3. \uACE0\uAC1D\uBCC4 \uBC84\uC804\uC744 \uB9CC\uB4E4 \uB54C\uB3C4 \uAC19\uC740 \uAE30\uC900\uC774 \uC801\uC6A9\uB418\uACE0, \uD68C\uCC28 \uC694\uC57D\uC744 \uBCF5\uC0AC\uD574 \uC2B9\uC778 \uC694\uCCAD\uC5D0 \uBD99\uC785\uB2C8\uB2E4.

**\uC5BB\uB294 \uAC83**: \uB2F4\uB2F9\uC790\uAC00 \uBC14\uB00C\uAC70\uB098 \uC5EC\uB7EC \uBC88 \uACE0\uCCD0\uB3C4 \uAC19\uC740 \uAE30\uC900\uC774 \uB9E4\uBC88 \uD568\uAED8 \uAC11\uB2C8\uB2E4.

## \uACE0\uAC1D\uC9C0\uC6D0 \u2014 \uBC14\uB010 \uC815\uCC45\uC744 \uC5EC\uB7EC \uBB38\uC11C\uC5D0

\uD658\uBD88 \uAE30\uD55C \uD558\uB098\uAC00 \uBC14\uB00C\uC5B4\uB3C4 \uC751\uB300 \uB9E4\uB274\uC5BC, \uB3C4\uC6C0\uB9D0, \uC790\uC8FC \uBB3B\uB294 \uC9C8\uBB38\uC744 \uBAA8\uB450 \uCC3E\uC544 \uACE0\uCCD0\uC57C \uD569\uB2C8\uB2E4.

**\uC774\uB807\uAC8C**

1. \uC751\uB300 \uBB38\uC11C \uD3F4\uB354\uB97C \uC5F4\uACE0 **Claude \uAC80\uD1A0 \u2192 \uC81C\uC548\xB7\uC9C8\uBB38 \uBC1B\uAE30**\uB97C \uACE0\uB985\uB2C8\uB2E4.
2. \uBC94\uC704\uB97C \uAC19\uC740 \uD3F4\uB354\uC758 \uBB38\uC11C(\uCD5C\uB300 10\uAC1C)\uB85C \uB113\uD788\uACE0 **\uC911\uC810** \uCE78\uC5D0 "\uD658\uBD88 \uAE30\uD55C\uC774 14\uC77C\uC5D0\uC11C 30\uC77C\uB85C \uBC14\uB00C\uC5C8\uB2E4. \uC608\uC804 \uAE30\uD55C\uC774 \uB0A8\uC740 \uACF3\uC744 \uACE0\uCCD0 \uC918"\uB77C\uACE0 \uC801\uC2B5\uB2C8\uB2E4.
3. **\uBCFC \uAC83**\uC5D0\uC11C \uBB38\uC11C\uBCC4 \uC81C\uC548\uC744 \uBCF4\uACE0 **\uC801\uC6A9**\uD558\uAC70\uB098 **\uAC70\uC808**\uD558\uACE0, \uB05D\uB098\uBA74 **\uC694\uC57D \uBCF5\uC0AC**\uB85C \uD300\uC5D0 \uC54C\uB9BD\uB2C8\uB2E4.

**\uC5BB\uB294 \uAC83**: \uBE60\uB728\uB9B0 \uBB38\uC11C \uC5C6\uC774 \uBC18\uC601\uD558\uAE30 \uC27D\uACE0, \uC5B4\uB290 \uBB38\uC11C\uC758 \uC5B4\uB290 \uBB38\uC7A5\uC744 \uACE0\uCCE4\uB294\uC9C0 \uB0A8\uC2B5\uB2C8\uB2E4.

## \uC778\uC0AC\xB7\uAD50\uC721 \u2014 \uADDC\uC815 \uAC1C\uC815

\uAC1C\uC815\uC548\uC740 \uACE0\uCE58\uB294 \uC77C\uBCF4\uB2E4 \uBB34\uC5C7\uC774 \uC65C \uBC14\uB00C\uC5C8\uB294\uC9C0 \uC124\uBA85\uD558\uB294 \uC77C\uC774 \uB354 \uC624\uB798 \uAC78\uB9B4 \uB54C\uAC00 \uB9CE\uC2B5\uB2C8\uB2E4.

**\uC774\uB807\uAC8C**

1. \uD604\uC7AC \uADDC\uC815\uC744 \uC5F4\uACE0 \uAC1C\uC815\uD560 \uC870\uD56D\uB9C8\uB2E4 \uC774\uC720\uC640 \uD568\uAED8 \uC758\uACAC\uC744 \uC801\uC2B5\uB2C8\uB2E4.
2. \uBC18\uC601 \uBC29\uC2DD\uC744 **\uC81C\uC548\uB9CC**\uC73C\uB85C \uBCF4\uB0C5\uB2C8\uB2E4. \uBB38\uC11C\uB294 \uADF8\uB300\uB85C \uB450\uACE0 \uACE0\uCE5C \uAE00\uC774 \uC81C\uC548\uC73C\uB85C \uC635\uB2C8\uB2E4. \uBC14\uB010 \uACF3\uC744 \uBCF4\uACE0 \uD558\uB098\uC529 \uC801\uC6A9\uD558\uAC70\uB098 \uAC70\uC808\uD569\uB2C8\uB2E4.
3. \uAC1C\uC815 \uD68C\uC758\uC5D0\uC11C\uB294 \uC81C\uC548 \uCE74\uB4DC\uC758 \uCC28\uC774(\uC9C0\uC6B4 \uAE00\xB7\uB354\uD55C \uAE00)\uB97C \uADF8\uB300\uB85C \uB744\uC6C1\uB2C8\uB2E4. \uC801\uC6A9\uD55C \uACB0\uACFC\uB294 **\uBCC0\uACBD \uC774\uB825**\uC5D0 \uC5B4\uB5A4 \uC758\uACAC\uC73C\uB85C \uBC14\uAFE8\uB294\uC9C0\uC640 \uD568\uAED8 \uB0A8\uACE0, DocBench \uC571\uC73C\uB85C \uC5F0 git \uD3F4\uB354\uB77C\uBA74 \uB9C8\uC9C0\uB9C9 \uCEE4\uBC0B(HEAD)\uACFC\uB3C4 \uBE44\uAD50\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.

**\uC5BB\uB294 \uAC83**: \uC870\uD56D\uB9C8\uB2E4 \uAC1C\uC815 \uC774\uC720(\uC758\uACAC)\uC640 \uACB0\uACFC(\uBC14\uB010 \uAE00)\uAC00 \uC9DD\uC73C\uB85C \uB0A8\uC544 \uAC1C\uC815 \uACF5\uC9C0\uBB38\uC744 \uC4F0\uAE30 \uC27D\uC2B5\uB2C8\uB2E4.

## \uBC95\uBB34\xB7\uCEF4\uD50C\uB77C\uC774\uC5B8\uC2A4 \u2014 \uACE0\uCE58\uC9C0 \uC54A\uACE0 \uC9DA\uC5B4\uB9CC \uBC1B\uAE30

\uC57D\uAD00\uACFC \uADDC\uC815\uC740 \uD55C \uAE00\uC790\uB97C \uBC14\uAFD4\uB3C4 \uBB34\uC5C7\uC744 \uC65C \uBC14\uAFE8\uB294\uC9C0 \uB0A8\uC544\uC57C \uD569\uB2C8\uB2E4.

**\uC774\uB807\uAC8C**

1. **\uB298 \uC9C0\uD0AC \uC9C0\uC2DC**\uC5D0 "\uC870\uD56D \uBC88\uD638\uC640 \uC815\uC758\uB41C \uC6A9\uC5B4\uB294 \uBC14\uAFB8\uC9C0 \uC54A\uB294\uB2E4", "\uADFC\uAC70\uAC00 \uC5C6\uC73C\uBA74 \`[\uD655\uC778 \uD544\uC694]\`\uB85C \uB454\uB2E4"\uB97C \uC801\uC5B4 \uB461\uB2C8\uB2E4.
2. \uC870\uD56D\uB9C8\uB2E4 \uC758\uACAC\uC744 \uC801\uACE0 **\uC81C\uC548\uB9CC**\uC73C\uB85C \uBCF4\uB0C5\uB2C8\uB2E4. \uB9DE\uB294\uC9C0\uB9CC \uBCFC \uACF3\uC740 \uC801\uB294 \uCE78\uC758 **\uD655\uC778\uB9CC** \uB2E8\uCD94\uB97C \uC501\uB2C8\uB2E4.
3. \uC81C\uC548\uC740 \uC0AC\uB78C\uC774 \uBC14\uB010 \uACF3\uC744 \uBCF4\uACE0 **\uC801\uC6A9**\uD558\uAC70\uB098 **\uAC70\uC808**\uD569\uB2C8\uB2E4. \uC801\uC6A9\uD55C \uAC83\uC740 \uC5B4\uB5A4 \uC758\uACAC\uC73C\uB85C \uBC14\uAFE8\uB294\uC9C0\uC640 \uD568\uAED8 \uC774\uB825\uC5D0 \uB0A8\uC2B5\uB2C8\uB2E4.

**\uC5BB\uB294 \uAC83**: Claude \uB294 \uC9DA\uACE0 \uC81C\uC548\uB9CC \uD558\uACE0, \uBC14\uAFB8\uB294 \uACB0\uC815\uC740 \uC0AC\uB78C\uC774 \uD569\uB2C8\uB2E4.

## \uB9AC\uB354\xB7\uACBD\uC601\uC9C4 \u2014 \uAE34 \uBCF4\uACE0\uC11C \uBE60\uB974\uAC8C \uC77D\uAE30

\uD68C\uC758 10\uBD84 \uC804\uC5D0 30\uCABD\uC9DC\uB9AC \uBCF4\uACE0\uC11C\uB97C \uBC1B\uC2B5\uB2C8\uB2E4.

**\uC774\uB807\uAC8C**

1. \uBB38\uC11C\uB97C \uC5F4\uACE0 **Claude \uAC80\uD1A0 \u2192 \uC77D\uAE30 \uC815\uB9AC**\uB97C \uACE0\uB985\uB2C8\uB2E4.
2. Claude \uAC00 \uBA3C\uC800 \uBCFC \uC139\uC158\uC740 \uD3BC\uCE58\uACE0 \uB098\uBA38\uC9C0\uB294 \uC811\uC5B4 \uB461\uB2C8\uB2E4. \uBB38\uC11C \uB0B4\uC6A9\uC740 \uADF8\uB300\uB85C\uC774\uACE0 \uB0B4 \uD654\uBA74\uC758 \uC811\uAE30\uB9CC \uBC14\uB01D\uB2C8\uB2E4. \uB418\uB3CC\uB9B4 \uC218\uB3C4 \uC788\uC2B5\uB2C8\uB2E4.
3. \uC77D\uB2E4\uAC00 \uC0DD\uAE34 \uC9C8\uBB38\uC740 \uADF8 \uC790\uB9AC\uC5D0 \uC801\uC5B4 \uB450\uC5C8\uB2E4\uAC00 \uD68C\uC758 \uB4A4 \uD55C \uBC88\uC5D0 \uBCF4\uB0C5\uB2C8\uB2E4.

**\uC5BB\uB294 \uAC83**: \uD575\uC2EC\uBD80\uD130 \uC77D\uACE0, \uC9C8\uBB38\uC740 \uBB38\uC11C\uC758 \uADF8 \uC790\uB9AC\uC5D0 \uB0A8\uC544 \uC791\uC131\uC790\uAC00 \uBC14\uB85C \uB2F5\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.

## \uB0B4 \uC5C5\uBB34\uC5D0 \uC801\uC6A9\uD574 \uBCF4\uAE30

\uB0B4 \uC5C5\uBB34 \uBB38\uC11C \uD558\uB098\uB85C \uC2DC\uC791\uD574 \uBCF4\uC138\uC694. \uBB38\uC11C \uC704\uC758 **Claude \uAC80\uD1A0**\uB97C \uB204\uB974\uACE0 **\uC81C\uC548\xB7\uC9C8\uBB38 \uBC1B\uAE30**\uB97C \uACE0\uB974\uBA74 \uC5F0\uC2B5\uC6A9 Claude \uAC00 \uC544\uB798 \uBE48\uCE78\uC744 \uC9C8\uBB38\uC73C\uB85C \uC62C\uB9BD\uB2C8\uB2E4. \uD45C\uAC00 \uC138 \uCE78\uC774\uB2C8 **\uB2F5\uD558\uAE30**\uC5D0 \uAC12 \uC14B\uC744 \uC27C\uD45C\uB85C \uB098\uB220 \uC801\uC5B4 \uBCF4\uB0B4\uBA74(\uC608: \uC8FC\uAC04 \uBCF4\uACE0, \uBA54\uC2E0\uC800\uB85C \uC758\uACAC \uBC1B\uAE30, \uC77D\uAE30 \uC815\uB9AC) \uD45C\uB97C \uCC44\uC6C1\uB2C8\uB2E4.

`;var jh='# \uC0AC\uC6A9 \uD301\n\n> \uCC98\uC74C \uD558\uB8E8 \uB3D9\uC548 \uC54C\uC544 \uB450\uBA74 \uC88B\uC740 \uAC83\uB4E4\uC785\uB2C8\uB2E4. \uC704\uC5D0\uC11C\uBD80\uD130 \uC77D\uC5B4\uB3C4 \uB418\uACE0, \uD544\uC694\uD55C \uC808\uB9CC \uD3BC\uCCD0\uB3C4 \uB429\uB2C8\uB2E4(\uD0A4 `1`\uC740 \uBAA9\uCC28, `0`\uC740 \uC804\uBD80).\n\n## \uC77D\uAE30\n\n- **\uAE4A\uC774\uB85C \uD6D1\uAE30**: \uD0A4 `1`\uC740 \uD070 \uC81C\uBAA9\uB9CC \uBCF4\uC774\uB294 \uBAA9\uCC28\uC785\uB2C8\uB2E4. \uC81C\uBAA9 \uB2E8\uACC4\uAC00 \uB354 \uAE4A\uC740 \uBB38\uC11C\uB294 `2` `3`\uC73C\uB85C \uD55C \uB2E8\uACC4\uC529 \uD3BC\uCE69\uB2C8\uB2E4. \uC811\uC740 \uC0C1\uD0DC\uB294 \uB2E4\uC74C\uC5D0 \uC5F4\uC5B4\uB3C4 \uADF8\uB300\uB85C\uC785\uB2C8\uB2E4.\n- **\uCC3E\uAE30**: `/` \uB97C \uB204\uB974\uBA74 \uC811\uD78C \uC139\uC158 \uC548\uAE4C\uC9C0 \uCC3E\uC2B5\uB2C8\uB2E4.\n- **\uADFC\uAC70 \uD45C\uAE30**: `[\uC2E4\uCE21]` `[\uBB38\uC11C]` `[\uC870\uC0AC]` `[\uCD94\uC815]` `[\uBBF8\uD655\uC778]`\uC744 \uC4F0\uBA74 \uC0C9\uC73C\uB85C \uB098\uB269\uB2C8\uB2E4. \uC5B4\uB290 \uC22B\uC790\uAC00 \uC7B0 \uAC12\uC774\uACE0 \uC5B4\uB290 \uAC83\uC774 \uCD94\uC815\uC778\uC9C0 \uBC14\uB85C \uBCF4\uC785\uB2C8\uB2E4.\n- **\uBE48\uCE78**: `[\uC791\uC5C5 \uD6C4 \uAE30\uC785]`, `[\uD655\uC778 \uD544\uC694]`, `TODO` \uB294 \uD615\uAD11\uC73C\uB85C \uBCF4\uC774\uACE0 \uBB38\uC11C \uC704\uC5D0 \uBE48\uCE78 \uC218\uAC00 \uB098\uC635\uB2C8\uB2E4.\n- **\uC774\uB984\uD45C\uB9CC \uBCF4\uAE30**: \uBAA9\uB85D \uC904\uC774 `**\uC9C8\uBB38:**`, `**\uB2F5:**`\uCC98\uB7FC \uAD75\uC740 \uC774\uB984\uD45C\uB85C \uC2DC\uC791\uD558\uACE0 \uC138 \uBC88 \uC774\uC0C1 \uBC18\uBCF5\uB418\uBA74 \uBB38\uC11C \uC704\uC5D0 \uC774\uB984\uD45C \uCE69\uC774 \uB739\uB2C8\uB2E4. **\uC9C8\uBB38**\uC744 \uB204\uB974\uBA74 \uB2F5 \uC904\uC774 \uC228\uC5B4 \uD63C\uC790 \uB2F5\uD574 \uBCF4\uBA70 \uBCF5\uC2B5\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4(**\uD6A8\uC6A9\uACFC \uD55C\uACC4**\uC758 "\uC790\uC8FC \uBB3B\uB294 \uC9C8\uBB38"\uC5D0\uC11C \uD574 \uBCF4\uC138\uC694).\n- **\uC791\uC5C5 \uC911 \uACE0\uC815**: \uC790\uC8FC \uC5EC\uB294 \uBB38\uC11C\uC640 \uD3F4\uB354\uB294 \uC904 \uB05D \uD540\uC73C\uB85C \uACE0\uC815\uD574 \uC704\uCABD "\uC791\uC5C5 \uC911"\uC5D0 \uB461\uB2C8\uB2E4.\n- **\uBC14\uB010 \uACF3**: \uB9C8\uC9C0\uB9C9\uC73C\uB85C \uBCF8 \uB4A4 \uBC14\uB010 \uAE00\uC740 \uBB38\uC11C \uC704\uC5D0 \uBC14\uB85C \uD45C\uC2DC\uB429\uB2C8\uB2E4(\uB354\uD55C \uAE00 \uCD08\uB85D, \uC9C0\uC6B4 \uAE00 \uCDE8\uC18C\uC120, \uB204\uAC00\xB7\uC5B8\uC81C). \uB2E4 \uBD24\uC73C\uBA74 **\uD45C\uC2DC \uC9C0\uC6B0\uAE30**.\n\n## \uC801\uAE30\n\n- **\uC5B4\uB514\uC5D0\uB098**: \uC139\uC158 \uC606 \uB9D0\uD48D\uC120\uC740 \uADF8 \uC139\uC158 \uC804\uCCB4\uC5D0, \uBB38\uAD6C\uB97C \uACE0\uB974\uBA74 \uADF8 \uBB38\uAD6C\uC5D0, \uBB38\uC11C \uC704 **\uBB38\uC11C \uC804\uCCB4\uC5D0**\uB294 \uBB38\uC11C \uD558\uB098\uC5D0 \uC801\uC2B5\uB2C8\uB2E4. \uAE38\uAC8C(500\uC790 \uB118\uAC8C) \uACE0\uB974\uBA74 \uC778\uC6A9 \uC5C6\uC774 \uADF8 \uBC94\uC704\uB97C \uB2F4\uB294 \uC139\uC158\uC5D0, \uBB38\uC11C \uB300\uBD80\uBD84\uC774\uBA74 \uBB38\uC11C \uC804\uCCB4\uC5D0 \uC801\uC2B5\uB2C8\uB2E4. \uC811\uD78C \uC139\uC158\uC5D0 \uC801\uC73C\uBA74 \uADF8 \uC544\uB798 \uB0B4\uC6A9 \uC804\uCCB4\uAC00 \uB300\uC0C1\uC785\uB2C8\uB2E4.\n- **\uCD08\uC548\uC740 \uC544\uBB34 \uB370\uB3C4 \uC548 \uAC11\uB2C8\uB2E4**: \uC801\uC740 \uAC83\uC740 \uCD08\uC548\uC73C\uB85C \uBAA8\uC77C \uBFD0\uC785\uB2C8\uB2E4. \uC77D\uC73C\uBA74\uC11C \uACE0\uCE58\uACE0, \uC9C0\uC6B0\uACE0, \uD569\uCE58\uC138\uC694(**\uD569\uCE58\uAE30**: \uAC19\uC740 \uC139\uC158\uC774\uBA74 \uADF8 \uC139\uC158\uC5D0, \uC5EC\uB7EC \uC139\uC158\uC774\uBA74 \uBB38\uC11C \uC804\uCCB4 \uC694\uCCAD\uC73C\uB85C).\n- **\uBB38\uAD6C\uAC00 \uACE0\uBBFC\uB418\uBA74**: \uC790\uC8FC \uC4F0\uB294 \uB9D0 \uB2E8\uCD94(**\uC904\uC774\uAE30 \xB7 \uC27D\uAC8C \xB7 \uADFC\uAC70 \xB7 \uD45C\uB85C \xB7 \uC811\uAE30 \xB7 \uB098\uB204\uAE30 \xB7 \uBE7C\uAE30 \xB7 \uD655\uC778\uB9CC**)\uB97C \uB204\uB974\uAC70\uB098, **\uC774\uB807\uAC8C \uBC14\uAFD4**\uB85C \uBC14\uAFC0 \uAE00\uC744 \uC9C1\uC811 \uC501\uB2C8\uB2E4. "\uC65C"\uB97C \uD55C \uC904 \uB367\uBD99\uC774\uBA74 Claude \uAC00 \uC758\uB3C4\uB97C \uB35C \uB193\uCE69\uB2C8\uB2E4.\n- **\uACE0\uCE58\uC9C0 \uB9D0\uACE0 \uBB3B\uAE30**: **\uD655\uC778\uB9CC**\uC740 "\uB9DE\uB294\uC9C0 \uD655\uC778\uD574 \uC8FC\uC138\uC694(\uACE0\uCE58\uC9C0 \uB9D0\uACE0 \uB2F5\uB9CC)"\uB97C \uB123\uC2B5\uB2C8\uB2E4. \uCC98\uC74C \uB9E1\uC740 \uADDC\uC815\xB7\uB9E4\uB274\uC5BC\uC744 \uC77D\uB2E4 \uC0DD\uAE34 \uC9C8\uBB38\uC744 \uADF8 \uC790\uB9AC\uC5D0 \uC801\uC5B4 \uB450\uC5C8\uB2E4\uAC00 \uD55C \uBC88\uC5D0 \uBCF4\uB0B4\uBA74 \uB2F5\uC774 **\uBCFC \uAC83**\uC5D0 \uBAA8\uC785\uB2C8\uB2E4.\n- **\uAE09\uD55C \uAC83**: \u2605 \uB97C \uCF1C \uB450\uBA74 \uB098\uC911\uC5D0 **\u2605\uB9CC** \uACE8\uB77C \uBA3C\uC800 \uBCF4\uB0BC \uC218 \uC788\uC2B5\uB2C8\uB2E4.\n- **\uC885\uB958**: \uC801\uB294 \uCE78\uC5D0\uC11C \uC624\uD0C8\uC790 \xB7 \uC0AC\uC2E4\xB7\uC218\uCE58 \xB7 \uCDA9\uB3CC \xB7 \uC911\uBCF5 \xB7 \uB204\uB77D \xB7 \uAD6C\uC870 \xB7 \uD45C\uD604 \xB7 \uC704\uD5D8 \xB7 \uBC29\uD5A5 \uAC00\uC6B4\uB370 \uD558\uB098\uB97C \uACE0\uB97C \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uBE44\uC6CC \uB450\uBA74 \uBCF4\uB0BC \uB54C Claude \uAC00 \uBD99\uC774\uACE0, \uB0B4\uAC00 \uACE0\uB978 \uAC83\uC740 Claude \uAC00 \uBC14\uAFB8\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. Claude \uAC00 \uBA3C\uC800 \uB0A8\uAE30\uB294 \uC758\uACAC\uC5D0\uB294 \uC885\uB958\uC640 \uC911\uC694\uB3C4\uAC00 \uB298 \uBD99\uC2B5\uB2C8\uB2E4.\n- **\uAE00\uC744 \uC783\uC9C0 \uC54A\uAC8C**: \uC801\uB2E4\uAC00 \uB2E4\uB978 \uACF3\uC5D0 \uC0C8\uB85C \uC801\uAC70\uB098 \uBB38\uC11C\uB97C \uC62E\uAE30\uBA74 \uC801\uB358 \uAE00\uC740 \uCD08\uC548\uC73C\uB85C \uB0A8\uC2B5\uB2C8\uB2E4. Esc \uB294 \uD55C \uBC88 \uB354 \uB20C\uB7EC\uC57C \uBC84\uB9BD\uB2C8\uB2E4.\n- **\uD0A4\uBCF4\uB4DC\uB85C**: `c` \uB294 \uC9C0\uAE08 \uC139\uC158\uC5D0 \uC801\uAE30, `Ctrl+Enter` \uB294 \uCD08\uC548\uC5D0 \uB450\uAE30, `Ctrl+Shift+Enter` \uB294 \uC774\uAC83\uB9CC \uBC14\uB85C \uBCF4\uB0B4\uAE30.\n\n## \uBCF4\uB0B4\uAE30\n\n- **\uB2E4 \uC77D\uACE0 \uD55C \uBC88\uC5D0**: \uAC80\uD1A0 \uD328\uB110 **\uCD08\uC548**\uC5D0\uC11C \uBCF4\uB0BC \uAC83\uC744 \uACE0\uB974\uACE0 **\uBCF4\uB0B4\uAE30**. \uD558\uB098\uC529 \uB530\uB85C \uAC00\uC9C0 \uC54A\uACE0 \uD55C \uC694\uCCAD\uC73C\uB85C \uAC11\uB2C8\uB2E4.\n- **\uBD99\uC77C \uB9D0**: \uC774\uBC88 \uBB36\uC74C \uC804\uCCB4\uC5D0 \uBD99\uC77C \uB9D0\uC744 \uD55C \uC904 \uC801\uC2B5\uB2C8\uB2E4. \uC608: "\uC874\uB313\uB9D0 \uC720\uC9C0, \uD45C\uC758 \uC22B\uC790\uB294 \uADF8\uB300\uB85C".\n- **\uBC18\uC601 \uBC29\uC2DD**: **\uBC14\uB85C \uACE0\uCE58\uAE30**\uB294 \uBD84\uBA85\uD55C \uC694\uCCAD\uC744 \uBC14\uB85C \uACE0\uCE58\uACE0(\uB418\uB3CC\uB9B4 \uC218 \uC788\uC74C), \uD070 \uBCC0\uACBD\uC740 \uC81C\uC548\uC73C\uB85C, \uBAA8\uB974\uB294 \uAC83\uC740 \uC9C8\uBB38\uC73C\uB85C \uB3CC\uB824\uC90D\uB2C8\uB2E4. **\uC81C\uC548\uB9CC**\uC740 \uBB38\uC11C\uB97C \uADF8\uB300\uB85C \uB450\uACE0 \uACE0\uCE5C \uAE00\uC744 \uC81C\uC548\uC73C\uB85C\uB9CC \uC62C\uB9BD\uB2C8\uB2E4. \uACE0\uB978 \uBC29\uC2DD\uC740 \uAE30\uC5B5\uB429\uB2C8\uB2E4.\n- **\uB298 \uC9C0\uD0AC \uC9C0\uC2DC**: \uB9E4\uBC88 \uAC19\uC740 \uB9D0\uC744 \uBD99\uC774\uACE0 \uC788\uB2E4\uBA74 **\uB298 \uC9C0\uD0AC \uC9C0\uC2DC**\uC5D0 \uD55C \uBC88 \uC801\uC5B4 \uB450\uC138\uC694. \uBCF4\uB0BC \uB54C\uB9C8\uB2E4 \uD568\uAED8 \uAC11\uB2C8\uB2E4.\n- **\uC5B4\uB514\uB85C**: \uC774 PC \uC758 DocBench \uC571(\uBC31\uADF8\uB77C\uC6B4\uB4DC \uCC98\uB9AC, \uC9C4\uD589 \uB85C\uADF8), **\uD130\uBBF8\uB110 \uD55C \uC904**(DocBench \uC124\uCE58 \uC5C6\uC774 \uC9C0\uAE08 \uC4F0\uB294 Claude Code \uB85C \u2014 **Claude Code \uC5D0\uC11C \uC5F4\uAE30** \uB2E8\uCD94 \uD558\uB098), \uB300\uC2DC\uBCF4\uB4DC \uD0ED \uC911\uC5D0\uC11C \uACE0\uB985\uB2C8\uB2E4. \uBAA8\uB450 \uB0B4 \uAD6C\uB3C5 \uB85C\uADF8\uC778 \uADF8\uB300\uB85C\uC774\uACE0 API \uD0A4\uAC00 \uD544\uC694 \uC5C6\uC2B5\uB2C8\uB2E4.\n\n## \uBCFC \uAC83\n\n- **\uD68C\uCC28\uBCC4\uB85C**: \uD55C \uBC88 \uBCF4\uB0B8 \uBB36\uC74C\uC774 \uD55C \uD68C\uCC28\uC785\uB2C8\uB2E4. \uD68C\uCC28 \uBA38\uB9AC\uC5D0 \uBD99\uC778 \uB9D0\uACFC Claude \uC758 \uC694\uC57D\uC774 \uBCF4\uC785\uB2C8\uB2E4.\n- **\uACE0\uCE68**: **\uBC14\uB010 \uACF3**\uC73C\uB85C \uC804\uD6C4\uB97C \uBCF4\uACE0 **\uD655\uC778**, \uB9C8\uC74C\uC5D0 \uC548 \uB4E4\uBA74 **\uB418\uB3CC\uB9AC\uAE30**(\uACE0\uCE58\uAE30 \uC804 \uAE00\uB85C), \uB2E4\uB974\uAC8C \uD558\uB824\uBA74 **\uB2E4\uC2DC \uC694\uCCAD**. \uB418\uB3CC\uB9B0 \uB4A4 \uB2E4\uC2DC \uBCF4\uB0B4\uBA74 Claude \uC5D0\uAC8C \uB418\uB3CC\uB838\uB2E4\uB294 \uC0AC\uC2E4\uC774 \uD568\uAED8 \uAC11\uB2C8\uB2E4.\n- **\uC81C\uC548**: \uCC28\uC774\uB97C \uBCF4\uACE0 **\uC801\uC6A9** \uB610\uB294 **\uAC70\uC808**. **\uC9C8\uBB38**: **\uB2F5\uD558\uAE30**\uB85C \uB2F5\uD558\uBA74 \uCD08\uC548\uC774 \uB418\uC5B4 \uB2E4\uC74C \uBB36\uC74C\uACFC \uD568\uAED8 \uAC11\uB2C8\uB2E4.\n- **Claude \uAC00 \uBA3C\uC800 \uB0A8\uAE34 \uAC83**: \uC758\uACAC\uC5D0 \uB3D9\uC758\uD558\uBA74 **\uBC18\uC601\uD574** \uD55C \uBC88(\uB2E8\uCD95\uD0A4 `a`), \uB2E4\uB974\uAC8C \uD558\uB824\uBA74 \uB2F5\uD558\uAE30, \uD544\uC694 \uC5C6\uC73C\uBA74 \uB2EB\uAE30. \uC9C8\uBB38\uC5D0\uB294 \uB2F5\uD558\uAE30.\n- **\uBABB \uD568**: \uBC18\uC601\uD558\uC9C0 \uBABB\uD55C \uAC83\uC740 \uAE4C\uB2ED\uACFC \uD568\uAED8 \uC62C\uB77C\uC635\uB2C8\uB2E4. **\uB2E4\uC2DC \uBCF4\uB0B4\uAE30** \uB610\uB294 **\uCD08\uC548\uC73C\uB85C**.\n- **\uBAA8\uB450 \uD655\uC778 \xB7 \uC774 \uD68C\uCC28 \uB418\uB3CC\uB9AC\uAE30 \xB7 \uC694\uC57D \uBCF5\uC0AC**: \uD68C\uCC28 \uBA38\uB9AC\uC758 \uB2E8\uCD94\uC785\uB2C8\uB2E4. \uC694\uC57D\uC740 \uD300 \uACF5\uC720\uB098 \uCEE4\uBC0B \uBA54\uC2DC\uC9C0\uC5D0 \uADF8\uB300\uB85C \uBD99\uC785\uB2C8\uB2E4.\n- **\uD0A4\uBCF4\uB4DC\uB85C**: `f` \uB85C \uAC80\uD1A0 \uD328\uB110\uC744 \uC5F4\uACE0(\uB610\uB294 \uD328\uB110 \uC548\uC744 \uD55C \uBC88 \uB204\uB974\uACE0) `j` `k` \uB85C \uCE74\uB4DC\uB97C \uC624\uAC00\uBA70 `a`(\uD655\uC778\xB7\uC801\uC6A9\xB7\uBC18\uC601\uD574), `u`(\uB418\uB3CC\uB9AC\uAE30), `r`(\uB2F5\uD558\uAE30).\n- **\uB9D0\uD48D\uC120**: \uBB38\uC11C \uC704 **\uB9D0\uD48D\uC120**(\uD0A4 `b`)\uC744 \uCF1C\uBA74 \uD53C\uB4DC\uBC31\uC774 \uBB38\uC11C \uC548 \uADF8 \uC790\uB9AC\uC5D0 \uB739\uB2C8\uB2E4 \u2014 \uACE0\uB978 \uBB38\uAD6C \uBC14\uB85C \uC544\uB798, \uC139\uC158 \uD53C\uB4DC\uBC31\uC740 \uC139\uC158 \uBA38\uB9AC \uC544\uB798, \uBB38\uC11C \uC804\uCCB4 \uD53C\uB4DC\uBC31\uC740 \uB9E8 \uC704. \uB204\uB974\uBA74 \uAC80\uD1A0 \uD328\uB110\uC758 \uADF8 \uCE74\uB4DC\uB85C \uAC11\uB2C8\uB2E4.\n- **\uACE8\uB77C \uBCF4\uAE30**: \uAE54\uB54C\uAE30 \uB2E8\uCD94\uC5D0\uC11C \uC911\uC694\uB3C4(\uBAA8\uB450 \xB7 \uC911\uAC04 \uC774\uC0C1 \xB7 \uB192\uC74C\uB9CC)\uC640 \uC885\uB958\uB97C \uACE0\uB974\uBA74 \uB9D0\uD48D\uC120\uACFC \uAC80\uD1A0 \uD328\uB110(\uCD08\uC548 \uCE78\uC740 \uBE7C\uACE0)\uC774 \uD568\uAED8 \uAC78\uB7EC\uC9D1\uB2C8\uB2E4. \uC758\uACAC\uC774 \uB9CE\uC744 \uB54C **\uB192\uC74C\uB9CC** \uBA3C\uC800, \uADF8\uB2E4\uC74C **\uC624\uD0C8\uC790**\uB9CC \uBAA8\uC544 \uD55C \uBC88\uC5D0 \uCC98\uB9AC\uD558\uB294 \uC2DD\uC785\uB2C8\uB2E4. \uACE0\uB978 \uC870\uAC74\uC740 \uAE30\uC5B5\uB429\uB2C8\uB2E4.\n\n## Claude \uBA3C\uC800\n\n- **\uC81C\uC548\xB7\uC9C8\uBB38 \uBC1B\uAE30**: \uB0B4\uAC00 \uB2E4 \uC77D\uAE30 \uC804\uC5D0 Claude \uAC00 \uBA3C\uC800 \uC77D\uACE0 \uACE0\uCE60 \uACF3\uC740 \uC81C\uC548\uC73C\uB85C, \uBAA8\uB974\uB294 \uACF3\uC740 \uC9C8\uBB38\uC73C\uB85C \uC62C\uB9BD\uB2C8\uB2E4. \uBC94\uC704\uB294 \uC774 \uBB38\uC11C, \uC9C0\uAE08 \uC139\uC158, \uAC19\uC740 \uD3F4\uB354\uC758 \uBB38\uC11C(\uCD5C\uB300 10\uAC1C) \uC911\uC5D0\uC11C \uACE0\uB985\uB2C8\uB2E4. \uD3F4\uB354\uB85C \uACE0\uB974\uBA74 \uBB38\uC11C \uC0AC\uC774\uC758 \uC5B4\uAE0B\uB0A8(\uC6A9\uC5B4\xB7\uC22B\uC790\xB7\uC911\uBCF5)\uB3C4 \uC9DA\uAC8C \uD569\uB2C8\uB2E4.\n- **\uC77D\uAE30 \uC815\uB9AC**: \uAE34 \uBB38\uC11C\uC5D0\uC11C \uBA3C\uC800 \uBCFC \uACF3\uC740 \uD3BC\uCE58\uACE0 \uB098\uBA38\uC9C0\uB294 \uC811\uC5B4 \uB461\uB2C8\uB2E4. \uBB38\uC11C\uB294 \uADF8\uB300\uB85C\uC774\uACE0 \uB0B4 \uD654\uBA74\uB9CC \uBC14\uB00C\uBA70, \uB418\uB3CC\uB9B4 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC544\uC9C1 \uD655\uC778\uD558\uC9C0 \uC54A\uC740 \uBC14\uB010 \uC139\uC158\uC740 \uC811\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.\n\n## \uD568\uAED8 \uC4F0\uAE30\n\n- **\uD45C\uC2DC \uC774\uB984**: \uC624\uB978\uCABD \uC704 **\uB098**\uC5D0\uC11C \uC774\uB984\uC744 \uC815\uD558\uBA74 \uC5EC\uB7FF\uC774 \uC4F8 \uB54C \uB204\uAC00 \uC801\uACE0 \uACE0\uCCE4\uB294\uC9C0 \uAD6C\uBD84\uB429\uB2C8\uB2E4.\n- **\uAE30\uB85D \uD3F4\uB354**: \uCC98\uC74C \uC800\uC7A5\uD560 \uB54C \uACE0\uB985\uB2C8\uB2E4. \uD63C\uC790 \uC4F0\uBA74 \uBB38\uC11C \uD3F4\uB354 \uBC16\uC758 \uAE30\uB85D \uBCF4\uAD00\uD568, \uD300\uC774 git \uC73C\uB85C \uB098\uB204\uBA74 **\uBB38\uC11C \uD3F4\uB354 \uC548\uC5D0 \uB450\uAE30**(`.docbench`). HTML \uD30C\uC77C\uC744 \uB354\uBE14\uD074\uB9AD\uD574 \uC5F4\uC5C8\uB2E4\uBA74 \uC0C8 \uCC3D\uB9C8\uB2E4 \uB2E4\uC2DC \uACE0\uB985\uB2C8\uB2E4(\uAC19\uC740 \uACF3\uC744 \uACE0\uB974\uBA74 \uAE30\uB85D\uC774 \uC774\uC5B4\uC9D1\uB2C8\uB2E4).\n- **\uB36E\uC5B4\uC4F0\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4**: \uC800\uC7A5\uD560 \uB54C\uB9C8\uB2E4 \uADF8\uC0AC\uC774 \uBB38\uC11C\uAC00 \uBC14\uB00C\uC5C8\uB294\uC9C0 \uD655\uC778\uD569\uB2C8\uB2E4. \uB2E4\uB978 \uC139\uC158\uC774 \uBC14\uB00C\uC5C8\uC73C\uBA74 \uCD5C\uC2E0 \uAE00\uC5D0 \uB0B4 \uACE0\uCE68\uC744 \uB2E4\uC2DC \uB123\uACE0, \uAC19\uC740 \uC139\uC158\uC774 \uBC14\uB00C\uC5C8\uC73C\uBA74 \uB0B4 \uAE00\uC744 \uC9C0\uD0A8 \uCC44 \uCC28\uC774\uB97C \uBCF4\uC5EC \uC90D\uB2C8\uB2E4.\n- **\uCD08\uC548\uC740 \uB0B4 \uAC83\uB9CC**: \uBCF4\uB0B4\uAE30 \uC804\uC758 \uCD08\uC548\uC740 \uC801\uC740 \uC0AC\uB78C\uC5D0\uAC8C\uB9CC \uBCF4\uC785\uB2C8\uB2E4. \uD568\uAED8 \uBCF4\uB294 \uAC83\uC740 \uBCF4\uB0B8 \uB4A4\uC758 \uACB0\uACFC\uC640 \uC774\uB825\uC785\uB2C8\uB2E4.\n\n## \uD30C\uC77C\uACFC \uD658\uACBD\n\n- **\uBB38\uC11C\uB294 \uADF8 \uC790\uB9AC\uC5D0**: \uC6D0\uBCF8\uC740 \uB0B4 \uD3F4\uB354\uC758 \uD30C\uC77C \uADF8\uB300\uB85C\uC774\uACE0 DocBench \uB294 \uC5B4\uB514\uB85C\uB3C4 \uBCF4\uB0B4\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.\n- **\uAC1C\uC694\uB85C \uACF5\uAC04 \uAD00\uB9AC**: \uB9E8 \uC704 README \uC758 \uCCAB \uBB38\uB2E8\uC774 \uC774 \uACF5\uAC04\uC758 **\uBAA9\uC801**, \uD3F4\uB354\uB9C8\uB2E4 README \uB97C \uB450\uBA74 \uADF8 \uCCAB \uBB38\uB2E8\uC774 **\uD3F4\uB354 \uC5ED\uD560**\uC774 \uB429\uB2C8\uB2E4. \uBB38\uC11C \uB9E8 \uC55E \uC55E\uBA38\uB9AC\uC5D0 `status`\xB7`owner`\xB7`tags`\xB7`review`(\uAC80\uD1A0 \uAE30\uD55C)\uB97C \uC801\uC73C\uBA74 \uAC1C\uC694\uC5D0 \uC0C1\uD0DC\xB7\uB2F4\uB2F9\xB7\uAF2C\uB9AC\uD45C\uAC00 \uBAA8\uC774\uACE0, \uAE30\uD55C\uC774 \uC9C0\uB098\uBA74 \uC0B4\uD3B4\uBCFC \uAC83\uC5D0 \uB739\uB2C8\uB2E4. \uAE68\uC9C4 \uB9C1\uD06C\xB7\uAE30\uD55C \uC9C0\uB09C \uBB38\uC11C\uB294 \uADF8 \uC790\uB9AC\uC5D0\uC11C Claude \uC5D0\uAC8C \uB9E1\uAE38 \uCD08\uC548\uC73C\uB85C.\n- **\uC124\uC815 \uD30C\uC77C\uB3C4 \uC139\uC158\uC73C\uB85C**: YAML\xB7JSON\xB7TOML\xB7INI \uB294 \uD0A4(\uD45C)\uB9C8\uB2E4 \uC139\uC158\uC774\uB77C \uADF8 \uD0A4\uC5D0 \uC801\uACE0 \uADF8 \uD0A4\uB9CC \uACE0\uCE69\uB2C8\uB2E4. \uD504\uB85C\uADF8\uB7A8\uC774 \uC77D\uB294 \uD30C\uC77C\uC774\uB77C Claude \uB294 \uC81C\uC548\uB9CC \uD569\uB2C8\uB2E4.\n- **\uC61B \uD615\uC2DD\uB3C4 \uADF8\uB300\uB85C**: \uC61B \uD55C\uAE00 \uD615\uC2DD(EUC-KR)\uC774\uB098 Windows \uC904\uBC14\uAFC8 \uBB38\uC11C\uB3C4 \uACE0\uCE58\uC9C0 \uC54A\uC740 \uC904\uC740 \uC6D0\uB798 \uBAA8\uC591 \uADF8\uB300\uB85C \uC800\uC7A5\uD569\uB2C8\uB2E4(IT \uB2F4\uB2F9\uC790\uC6A9: CP949\xB7UTF-16LE\xB7BOM\xB7CRLF). \uADF8 \uD615\uC2DD\uC73C\uB85C \uC800\uC7A5\uD560 \uC218 \uC5C6\uB294 \uAE00\uC790\uAC00 \uB4E4\uC5B4\uAC00\uBA74 \uC800\uC7A5 \uC804\uC5D0 \uBB3B\uC2B5\uB2C8\uB2E4.\n- **\uD070 \uD3F4\uB354\uB3C4 \uBC14\uB85C**: \uB4DC\uB77C\uC774\uBE0C\uB97C \uD1B5\uC9F8\uB85C \uC5F4\uC5B4\uB3C4 \uD0D0\uC0C9\uAE30\uCC98\uB7FC \uD3BC\uCE5C \uD3F4\uB354\uB9CC \uC77D\uC2B5\uB2C8\uB2E4.\n- **\uD734\uB300\uD3F0**: \uD734\uB300\uD3F0\xB7\uD0DC\uBE14\uB9BF \uBE0C\uB77C\uC6B0\uC800\uB294 \uD3F4\uB354\uC5D0 \uC4F0\uC9C0 \uBABB\uD574 \uB458\uB7EC\uBCF4\uAE30\uC640 \uC5F0\uC2B5\uAE4C\uC9C0 \uB429\uB2C8\uB2E4.\n- **\uB9C8\uD06C\uB2E4\uC6B4\uC774 \uCC98\uC74C\uC774\uB77C\uBA74**: \uBA54\uBAA8\uC7A5\uC73C\uB85C\uB3C4 \uC4F0\uB294 \uAE00 \uD30C\uC77C\uC785\uB2C8\uB2E4. `#` \uC73C\uB85C \uC2DC\uC791\uD558\uB294 \uC904\uC774 \uC81C\uBAA9\uC774\uACE0 \uC81C\uBAA9\uB9C8\uB2E4 \uC139\uC158\uC774 \uB429\uB2C8\uB2E4(`##` \uB294 \uD55C \uB2E8\uACC4 \uC544\uB798). `-` \uB294 \uBAA9\uB85D, `|` \uB85C \uB098\uB208 \uC904\uC740 \uD45C\uC785\uB2C8\uB2E4. \uBA54\uBAA8\uC7A5\uC5D0\uC11C \uC774\uB984\uC744 `.md` \uB85C \uC800\uC7A5\uD558\uBA74 \uC0C8 \uBB38\uC11C\uAC00 \uB429\uB2C8\uB2E4.\n- **\uC6CC\uB4DC\xB7\uD55C\uAE00 \uBB38\uC11C\uB294**: \uC5F4\uBA74 \uAE00\uC744 \uBF51\uC544 \uBCF4\uC5EC \uC8FC\uC5B4 \uC77D\uACE0 \uC801\uAE30\xB7Claude \uAC80\uD1A0\uAE4C\uC9C0 \uB429\uB2C8\uB2E4(\uC6D0\uBCF8\uC740 \uADF8\uB300\uB85C, **\uC6D0\uBCF8 \uB0B4\uB824\uBC1B\uAE30**). \uD568\uAED8 \uACE0\uCCD0 \uAC00\uBA70 \uC4F8 \uBB38\uC11C\uB294 `.md` \uB85C \uD558\uACE0 \uC11C\uC2DD\uC740 \uB9C8\uC9C0\uB9C9\uC5D0 \uC6D0\uB798 \uD504\uB85C\uADF8\uB7A8\uC5D0\uC11C \uC785\uD788\uB294 \uD750\uB984\uC774 \uAC00\uC7A5 \uD3B8\uD569\uB2C8\uB2E4 \u2014 Claude Code \uC5D0 "\uC774 \uC6CC\uB4DC \uD30C\uC77C\uC744 .md \uB85C \uBC14\uAFD4 \uC918".\n\n## \uC0C1\uD669\uBCC4 \uB808\uC2DC\uD53C\n\n| \uC0C1\uD669 | \uC774\uB807\uAC8C |\n|---|---|\n| \uD68C\uC758 10\uBD84 \uC804, \uAE34 \uBCF4\uACE0\uC11C | Claude \uAC80\uD1A0 \u2192 \uC77D\uAE30 \uC815\uB9AC \u2192 \uD3BC\uCCD0\uC9C4 \uACF3\uB9CC \uC77D\uACE0, \uC9C8\uBB38\uC740 \uADF8 \uC790\uB9AC\uC5D0 \uC801\uAE30 |\n| \uD300\uC7A5 \uC758\uACAC 20\uAC1C \uBC18\uC601 | \uD558\uB098\uC529 \uC801\uC5B4 \uCD08\uC548\uC73C\uB85C \u2192 \u2605\uB9CC \uBA3C\uC800 \uBCF4\uB0B4\uAE30 \u2192 \uB098\uBA38\uC9C0\uB294 \uD55C \uBC88\uC5D0 |\n| Claude \uC758\uACAC\uC774 \uC218\uC2ED \uAC1C | \uACE8\uB77C \uBCF4\uAE30 **\uB192\uC74C\uB9CC** \u2192 \uB9D0\uD48D\uC120\uC744 \uCF1C\uACE0 \uBB38\uC11C\uB97C \uC77D\uC73C\uBA70 \uCC98\uB9AC \u2192 \uB2E4\uC74C\uC740 **\uC624\uD0C8\uC790**\uB9CC \uBAA8\uC544 \uBC18\uC601\uD574 |\n| \uD68C\uC758\uB85D\uC5D0\uC11C \uD560 \uC77C\uB9CC \uBF51\uACE0 \uC2F6\uB2E4 | \uB9E8 \uB05D\uC5D0 `## \uD560 \uC77C` \uC81C\uBAA9\uACFC \uBE48 \uD45C(\uD560 \uC77C\xB7\uB2F4\uB2F9\xB7\uAE30\uD55C)\uB97C \uB450\uACE0 **\uBB38\uC11C \uC804\uCCB4\uC5D0** "\uB17C\uC758\uC5D0\uC11C \uACB0\uC815\uACFC \uD560 \uC77C\uC744 \uBF51\uC544 \uC774 \uD45C\uB97C \uCC44\uC6CC \uC918. \uBAA8\uB974\uB294 \uCE78\uC740 `[\uD655\uC778 \uD544\uC694]`" \u2192 \uBCF4\uB0B4\uAE30 \u2192 \uD615\uAD11\uC73C\uB85C \uB0A8\uC740 \uCE78\uB9CC \uC0AC\uB78C\uC5D0\uAC8C \uBB3B\uAE30 |\n| \uB9E4\uBC88 \uAC19\uC740 \uC9C0\uC801\uC744 \uBC1B\uB294\uB2E4 | \uADF8 \uC9C0\uC801\uC744 \uB298 \uC9C0\uD0AC \uC9C0\uC2DC\uC5D0 \uD55C \uC904\uB85C |\n| Claude \uAC00 \uACE0\uCE5C \uAE00\uC774 \uC544\uC27D\uB2E4 | \uB418\uB3CC\uB9AC\uAE30 \u2192 \uB2E4\uC2DC \uC694\uCCAD\uC5D0 \uC774\uC720 \uD55C \uC904 |\n| \uAC1C\uC815 \uB0B4\uC6A9\uC744 \uACF5\uC9C0\uD574\uC57C \uD55C\uB2E4 | \uD68C\uCC28\uB97C \uD655\uC778\uD55C \uB4A4 \uC694\uC57D \uBCF5\uC0AC \u2192 \uACF5\uC9C0\uBB38\uC5D0 \uBD99\uC774\uAE30 |\n| \uB0A8\uC774 \uC4F4 \uBB38\uC11C\uB97C \uCC98\uC74C \uB9E1\uC558\uB2E4 | \uD0A4 `1`\uB85C \uBAA9\uCC28 \u2192 Claude \uAC80\uD1A0(\uAC19\uC740 \uD3F4\uB354) \u2192 \uC9C8\uBB38\uBD80\uD130 \uB2F5\uD558\uAE30 |\n\n## \uB2E8\uCD95\uD0A4\n\n| \uD0A4 | \uD558\uB294 \uC77C |\n|---|---|\n| `j` / `k` | \uB2E4\uC74C / \uC774\uC804 \uC139\uC158 |\n| `o` | \uC9C0\uAE08 \uC139\uC158 \uC811\uAE30\xB7\uD3BC\uCE58\uAE30 |\n| `1` `2` `3` \xB7 `0` | \uAE4A\uC774 \xB7 \uC804\uBD80 |\n| `/` | \uCC3E\uAE30 |\n| `c` | \uC9C0\uAE08 \uC139\uC158\uC5D0 \uC801\uAE30 |\n| `b` | \uB9D0\uD48D\uC120 \uCF1C\uAE30\xB7\uB044\uAE30 |\n| `e` | \uC9C0\uAE08 \uC139\uC158 \uD3B8\uC9D1 |\n| `f` | \uAC80\uD1A0 \uD328\uB110 \uC5F4\uAE30\xB7\uB2EB\uAE30 |\n| `?` | \uB2E8\uCD95\uD0A4 \uC804\uCCB4 |\n';var zh=`# \uD6A8\uC6A9\uACFC \uD55C\uACC4

> \uD55C \uC904\uB85C: \uC77D\uC73C\uBA70 \uBAA8\uC740 \uC758\uACAC\uC744 \uD55C \uBC88\uC5D0 \uB9E1\uAE30\uACE0, Claude \uAC00 \uD55C \uC77C\uC740 \uD655\uC778\uD558\uAC70\uB098 \uB418\uB3CC\uB9BD\uB2C8\uB2E4. \uBB38\uC11C\uB294 \uB0B4 \uD3F4\uB354\uC5D0 \uADF8\uB300\uB85C \uC788\uC2B5\uB2C8\uB2E4.

## \uC4F0\uAE30 \uC26C\uC6B4 \uC810

- \uC124\uCE58 \uC5C6\uC774 \uD30C\uC77C \uD558\uB098(HTML)\uB97C \uC5E3\uC9C0\xB7\uD06C\uB86C\uC73C\uB85C \uC5FD\uB2C8\uB2E4. \uCC98\uC74C\uC5D0\uB294 \uC774\uB984\uB3C4 \uD3F4\uB354\uB3C4 \uBB3B\uC9C0 \uC54A\uACE0 \uC774 \uC5F0\uC2B5 \uACF5\uAC04\uC774 \uB739\uB2C8\uB2E4.
- Claude \uB294 \uB0B4 \uAD6C\uB3C5 \uB85C\uADF8\uC778 \uADF8\uB300\uB85C \uC501\uB2C8\uB2E4. Claude Code \uB97C \uC4F8 \uC218 \uC788\uB294 \uAD6C\uB3C5\uC774\uBA74 API \uD0A4\uB3C4, \uB530\uB85C \uB0BC \uB3C8\uB3C4 \uC5C6\uC2B5\uB2C8\uB2E4(\uC4F4 \uB9CC\uD07C \uAD6C\uB3C5 \uC0AC\uC6A9\uB7C9\uC5D0 \uB4E4\uC5B4\uAC11\uB2C8\uB2E4).
- \uC801\uAE30\uC640 \uBCF4\uB0B4\uAE30\uB97C \uB098\uB234\uC2B5\uB2C8\uB2E4. \uACE0\uBBFC\uD558\uBA70 \uC801\uACE0, \uB2E4 \uC77D\uC740 \uB4A4 \uD55C \uBC88\uC5D0 \uBCF4\uB0C5\uB2C8\uB2E4. \uAE09\uD55C \uAC83\uB9CC \uBA3C\uC800 \uBCF4\uB0B4\uB3C4 \uB429\uB2C8\uB2E4.
- Claude \uC5D0\uAC8C \uB9E1\uAE30\uB294 \uAE38\uC740 \uC571\uC758 \uB2E8\uCD94 \uD558\uB098, \uB610\uB294 **Claude Code \uC5D0\uC11C \uC5F4\uAE30** \uD55C \uBC88\uC785\uB2C8\uB2E4(\uCC98\uC74C \uD55C \uBC88\uC740 Claude Code \uAC00 \uBB3B\uB294 "\uC774 \uD3F4\uB354\uB97C \uBBFF\uB098\uC694?"\uC5D0 Yes).

## \uC5B4\uB514\uC5D0\uB098 \uC4F0\uB294 \uC810

- **\uC9C1\uAD70\uC744 \uAC00\uB9AC\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4**: \uC124\uACC4 \uBB38\uC11C\uBD80\uD130 \uADDC\uC815, \uBCF4\uB3C4\uC790\uB8CC\uAE4C\uC9C0 \uAC19\uC740 \uBC29\uC2DD\uC73C\uB85C \uB2E4\uB8F9\uB2C8\uB2E4(**\uC9C1\uAD70\uBCC4 \uD65C\uC6A9** \uCC38\uACE0). \uB9C8\uD06C\uB2E4\uC6B4\xB7\uAE00\xB7\uD45C(CSV)\xB7\uC124\uC815 \uD30C\uC77C(YAML\xB7JSON\xB7TOML)\uC740 \uC77D\uACE0 \uACE0\uCE58\uACE0, \uC6CC\uB4DC\xB7\uD30C\uC6CC\uD3EC\uC778\uD2B8\xB7\uC5D1\uC140\xB7\uD55C\uAE00(HWPX)\uC740 \uAE00\uC744 \uBF51\uC544 \uC77D\uACE0 \uD53C\uB4DC\uBC31\uC744 \uB0A8\uAE41\uB2C8\uB2E4.
- **\uC5B4\uB514\uC11C\uB098 \uAC19\uC740 \uD654\uBA74**: \uD30C\uC77C \uD558\uB098, \uC774 PC \uC758 \uC571, \uC0AC\uB0B4 \uB300\uC2DC\uBCF4\uB4DC\uC758 \uD0ED\uC5D0\uC11C \uAC19\uC740 \uD654\uBA74\uC774 \uB728\uACE0, \uAC19\uC740 \uAE30\uB85D \uD3F4\uB354\uB97C \uC4F0\uBA74 \uAE30\uB85D\uC774 \uC774\uC5B4\uC9D1\uB2C8\uB2E4.
- **\uC788\uB294 \uBB38\uC11C \uADF8\uB300\uB85C**: \uB4DC\uB77C\uC774\uBE0C \uAC19\uC740 \uD070 \uD3F4\uB354, \uC61B \uD55C\uAE00 \uD615\uC2DD(EUC-KR), Windows \uC904\uBC14\uAFC8\uB3C4 \uBC14\uAFB8\uC9C0 \uC54A\uACE0 \uB2E4\uB8F9\uB2C8\uB2E4.
- **\uC0AC\uB0B4\uB9DD\uC5D0\uC11C\uB3C4**: \uD654\uBA74\uC5D0 \uD544\uC694\uD55C \uAC83\uC774 \uD30C\uC77C \uD558\uB098\uC5D0 \uB2E4 \uB4E4\uC5B4 \uC788\uC5B4 \uC778\uD130\uB137\uC5D0\uC11C \uB530\uB85C \uBC1B\uC544 \uC624\uB294 \uAC83 \uC5C6\uC774 \uB3D5\uB2C8\uB2E4.

## \uBBFF\uACE0 \uB9E1\uAE38 \uC218 \uC788\uB294 \uAE4C\uB2ED

- **Claude \uB294 \uBB38\uC11C\uB97C \uC9C1\uC811 \uACE0\uCE58\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4**: \uACE0\uCE5C \uAE00\uC744 \uC815\uD574\uC9C4 \uBAA8\uC591\uC73C\uB85C \uB3CC\uB824\uC8FC\uBA74 DocBench \uAC00 \uADF8\uC0AC\uC774 \uBB38\uC11C\uAC00 \uBC14\uB00C\uC9C0 \uC54A\uC558\uB294\uC9C0 \uD655\uC778\uD574 \uBC18\uC601\uD569\uB2C8\uB2E4. \uADF8\uC0AC\uC774 \uC0AC\uB78C\uC774 \uAC19\uC740 \uC139\uC158\uC744 \uACE0\uCCE4\uC73C\uBA74 \uB36E\uC9C0 \uC54A\uACE0 \uC81C\uC548\uC73C\uB85C \uB3CC\uB9BD\uB2C8\uB2E4.
- **\uAD8C\uD55C\uC744 \uC881\uD600 \uB461\uB2C8\uB2E4**: \uC571\uC73C\uB85C \uB9E1\uAE30\uBA74 Claude \uB294 \uBB38\uC11C \uD3F4\uB354 \uBC16\uC5D0\uC11C \uC77D\uAE30 \uB3C4\uAD6C\uB9CC \uAC00\uC9C0\uACE0 \uC2E4\uD589\uB418\uC5B4, \uBB38\uC11C \uC18D \uAE00\uC774 \uC18D\uC774\uB824 \uD574\uB3C4 \uBA85\uB839\uC744 \uC2E4\uD589\uD558\uAC70\uB098 \uD3F4\uB354 \uBC16\uC744 \uC77D\uC9C0 \uBABB\uD569\uB2C8\uB2E4. \uD130\uBBF8\uB110 \uD55C \uC904\uB85C \uB9E1\uAE30\uBA74 \uAE30\uB85D \uD3F4\uB354\uC758 \uAD8C\uD55C \uC124\uC815\uC774 \uACB0\uACFC \uD30C\uC77C\uB9CC \uBB3B\uC9C0 \uC54A\uACE0 \uC4F0\uAC8C \uD558\uACE0 \uAE30\uB85D\uC740 \uACE0\uCE58\uC9C0 \uBABB\uD558\uAC8C \uB9C9\uC2B5\uB2C8\uB2E4. \uADF8 \uBC16\uC758 \uC77C\uC740 (\uAE30\uBCF8 \uC124\uC815\uC774\uBA74) Claude Code \uAC00 \uBA3C\uC800 \uBB3B\uC2B5\uB2C8\uB2E4.
- **\uC0AC\uB78C\uC774 \uD655\uC778\uD574\uC57C \uB05D\uB0A9\uB2C8\uB2E4**: \uACB0\uACFC\uB294 \uD655\uC778\uD560 \uB54C\uAE4C\uC9C0 **\uBCFC \uAC83**\uC5D0 \uB0A8\uACE0, \uC798\uBABB \uACE0\uCE5C \uAC83\uC740 \uB418\uB3CC\uB9BD\uB2C8\uB2E4.
- **\uAE30\uB85D\uC740 \uC0AC\uB78C\uC774 \uC77D\uC744 \uC218 \uC788\uAC8C**: \uD53C\uB4DC\uBC31\uACFC \uC774\uB825\uC740 \uBA54\uBAA8\uC7A5\uC73C\uB85C\uB3C4 \uC5F4\uB9AC\uB294 \uAE00 \uD30C\uC77C(JSON)\uB85C \uAE30\uB85D \uD3F4\uB354\uC5D0 \uB0A8\uC2B5\uB2C8\uB2E4. \uB3C4\uAD6C\uB97C \uADF8\uB9CC \uC368\uB3C4 \uAE30\uB85D\uC740 \uB0A8\uC2B5\uB2C8\uB2E4.

## \uC7AC \uBCFC \uC218 \uC788\uB294 \uD6A8\uACFC

\uD6A8\uACFC\uB294 \uD300\uB9C8\uB2E4 \uB2E4\uB985\uB2C8\uB2E4. \uC544\uB798\uCC98\uB7FC \uC6B0\uB9AC \uD300 \uAE30\uC900\uC73C\uB85C \uC7AC \uBCF4\uC138\uC694. \uAE30\uB85D \uD3F4\uB354\uC758 \uD53C\uB4DC\uBC31 \uD30C\uC77C\uC5D0 \uC801\uC740 \uC2DC\uAC01\uACFC \uBC14\uB010 \uC2DC\uAC01\uC774 \uB0A8\uC544 \uB530\uB85C \uC801\uC9C0 \uC54A\uC544\uB3C4 \uB429\uB2C8\uB2E4.
