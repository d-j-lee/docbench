/* DocBench — 작업대 스타일.
   레이아웃: 3단 작업대 — 문서 레일 · 읽기 칼럼(~74ch) · 피드백 패널.
   반응형 기준은 화면이 아니라 .docbench.docbench.docbench 컨테이너 폭이다(대시보드 패널에 넣어도 맞춰진다).
   호스트는 --db-* 토큰만 덮어써서 사내 디자인 시스템 색·글꼴에 맞춘다:
     doc-bench { --db-go: #0050b3; --db-font-body: "사내 글꼴", sans-serif; }
   토큰은 :where() 로 선언해 호스트의 어떤 선택자로도 덮어쓸 수 있다.
   그 밖의 규칙은 빌드가 .docbench.docbench.docbench 를 세 번 겹쳐(scripts/build.mjs) 호스트 전역 CSS 보다 우선하게 한다. */

:where(.docbench.docbench.docbench) {
  --db-bg: #f4f6f3; --db-surface: #ffffff; --db-sunk: #eaeee9; --db-line: #d9dfd9; --db-line-2: #c3ccc5;
  --db-ink: #17201b; --db-ink-2: #46514b; --db-ink-3: #6f7a74;
  --db-go: #0b7a57; --db-go-ink: #ffffff; --db-go-soft: #dcefe6;
  --db-wait: #95600c; --db-wait-soft: #fbeed3;
  --db-bad: #b13a33; --db-bad-soft: #f7e2df;
  --db-info: #2d5b88; --db-info-soft: #e1eaf4;
  --db-mark: #ffe58a; --db-mark-ink: #3a2e00;
  --db-chg: #6a4fb3; --db-chg-soft: #ece6fa;
  --db-shadow: 0 1px 2px rgba(23,32,27,.06), 0 8px 24px rgba(23,32,27,.10);
  --db-font-body: "Pretendard", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --db-font-display: var(--db-font-body);
  --db-font-mono: "IBM Plex Mono", "D2Coding", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --db-rail: 260px; --db-panel: 360px; --db-bar: 50px; --db-radius: 8px;
  color-scheme: light;
}
:where(.docbench.docbench.docbench[data-theme="dark"]),
:where(:root[data-theme="dark"] .docbench.docbench.docbench[data-theme="auto"]) {
  --db-bg: #0f1412; --db-surface: #151b18; --db-sunk: #1c2420; --db-line: #28322d; --db-line-2: #38453e;
  --db-ink: #e3eae5; --db-ink-2: #afbab3; --db-ink-3: #85918a;
  --db-go: #3fc597; --db-go-ink: #06140e; --db-go-soft: #163428;
  --db-wait: #e3ab45; --db-wait-soft: #33270e;
  --db-bad: #ef7b73; --db-bad-soft: #3a1e1c;
  --db-info: #80b2e4; --db-info-soft: #17283a;
  --db-mark: #6b5a12; --db-mark-ink: #fff4c7;
  --db-chg: #b8a2f0; --db-chg-soft: #2a2140;
  --db-shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :where(:root:not([data-theme="light"]) .docbench.docbench.docbench[data-theme="auto"]) {
    --db-bg: #0f1412; --db-surface: #151b18; --db-sunk: #1c2420; --db-line: #28322d; --db-line-2: #38453e;
    --db-ink: #e3eae5; --db-ink-2: #afbab3; --db-ink-3: #85918a;
    --db-go: #3fc597; --db-go-ink: #06140e; --db-go-soft: #163428;
    --db-wait: #e3ab45; --db-wait-soft: #33270e;
    --db-bad: #ef7b73; --db-bad-soft: #3a1e1c;
    --db-info: #80b2e4; --db-info-soft: #17283a;
    --db-mark: #6b5a12; --db-mark-ink: #fff4c7;
    --db-chg: #b8a2f0; --db-chg-soft: #2a2140;
    --db-shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}

/* ---------- 호스트 CSS 차단막 ----------
   대시보드 전역 규칙(header{…}, .card h2{…}, button{…})이 작업대 안으로 새지 않게 안쪽 요소를 브라우저 기본값으로
   되돌린 뒤 아래 규칙만 얹는다. svg·img 는 제외(속성으로 준 크기·색까지 되돌아간다). */
.docbench.docbench.docbench :where(header, nav, main, aside, section, article, footer, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, dl, dt, dd, blockquote, pre, code, kbd, table, thead, tbody, tfoot, tr, th, td, caption, button, input, textarea, select, label, dialog, mark, a, b, i, strong, em, del, ins, s, small, sup, sub, hr, details, summary, figure, figcaption) { all: revert; }

/* ---------- 바탕 ---------- */
.docbench.docbench.docbench { container: docbench / inline-size; position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; min-height: 420px; background: var(--db-bg); color: var(--db-ink); font: 400 15px/1.7 var(--db-font-body); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; text-align: left; outline: none; letter-spacing: normal; word-spacing: normal; text-transform: none; text-indent: 0; text-shadow: none; font-style: normal; white-space: normal; }
.docbench.docbench.docbench *, .docbench.docbench.docbench *::before, .docbench.docbench.docbench *::after { box-sizing: border-box; }
.docbench.docbench.docbench button, .docbench.docbench.docbench input, .docbench.docbench.docbench textarea, .docbench.docbench.docbench select { font: inherit; color: inherit; letter-spacing: normal; }
.docbench.docbench.docbench button { cursor: pointer; }
.docbench.docbench.docbench :focus-visible { outline: 2px solid var(--db-go); outline-offset: 2px; border-radius: 4px; }
.docbench.docbench.docbench a { color: var(--db-info); }
.docbench.docbench.docbench [hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .docbench.docbench.docbench * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.docbench.docbench.docbench .db-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--db-line-2); background: var(--db-surface); border-radius: 7px; padding: 4px 11px; font-size: 13px; font-weight: 500; line-height: 1.35; white-space: nowrap; color: var(--db-ink); }
.docbench.docbench.docbench .db-btn:hover { border-color: var(--db-ink-3); }
.docbench.docbench.docbench .db-btn:disabled { opacity: .5; cursor: default; }
.docbench.docbench.docbench .db-btn.primary { background: var(--db-go); border-color: var(--db-go); color: var(--db-go-ink); }
.docbench.docbench.docbench .db-btn.ghost { border-color: transparent; background: transparent; }
.docbench.docbench.docbench .db-btn.danger { color: var(--db-bad); }
.docbench.docbench.docbench .db-btn.sm { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
.docbench.docbench.docbench .db-btn svg { width: 13px; height: 13px; }
.docbench.docbench.docbench .db-chip { border: 1px solid var(--db-line-2); background: var(--db-surface); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; color: var(--db-ink-2); line-height: 1.6; }
.docbench.docbench.docbench .db-chip[aria-pressed="true"] { background: var(--db-ink); border-color: var(--db-ink); color: var(--db-surface); }
.docbench.docbench.docbench .db-seg { display: inline-flex; border: 1px solid var(--db-line-2); border-radius: 7px; overflow: hidden; }
.docbench.docbench.docbench .db-seg button { border: 0; border-right: 1px solid var(--db-line); background: var(--db-surface); padding: 3px 10px; font-size: 12.5px; color: var(--db-ink-2); }
.docbench.docbench.docbench .db-seg button:last-child { border-right: 0; }
.docbench.docbench.docbench .db-seg button[aria-pressed="true"] { background: var(--db-ink); color: var(--db-surface); font-weight: 600; }
.docbench.docbench.docbench .db-lbl { font-size: 11.5px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-hint { font-size: 12px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 상단 바 ---------- */
.docbench.docbench.docbench .db-bar { flex: none; height: var(--db-bar); display: flex; align-items: center; gap: 10px; padding-inline: 14px; background: var(--db-surface); border-bottom: 1px solid var(--db-line); z-index: 5; }
.docbench.docbench.docbench .db-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.docbench.docbench.docbench .db-logo { width: 20px; height: 20px; flex: none; display: grid; gap: 3px; align-content: center; }
.docbench.docbench.docbench .db-logo i { display: block; height: 3px; border-radius: 2px; background: var(--db-ink); }
.docbench.docbench.docbench .db-logo i:nth-child(2) { width: 70%; background: var(--db-go); }
.docbench.docbench.docbench .db-logo i:nth-child(3) { width: 45%; }
.docbench.docbench.docbench .db-brand b { font: 700 15.5px/1.2 var(--db-font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.docbench.docbench.docbench .db-brand small { color: var(--db-ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.docbench.docbench.docbench .db-grow { flex: 1; }
.docbench.docbench.docbench .db-clocks { display: flex; gap: 6px; }
.docbench.docbench.docbench .db-clock { display: inline-flex; align-items: center; gap: 6px; background: var(--db-ink); color: var(--db-surface); border-radius: 6px; padding: 2px 8px 2px 7px; font-size: 11.5px; line-height: 1.25; white-space: nowrap; }
.docbench.docbench.docbench .db-clock .n { font: 500 13.5px/1.2 var(--db-font-mono); font-variant-numeric: tabular-nums; color: var(--db-go-soft); }
.docbench.docbench.docbench .db-clock.plan { background: var(--db-sunk); color: var(--db-ink-2); }
.docbench.docbench.docbench .db-clock.plan .n { color: var(--db-ink); }
.docbench.docbench.docbench .db-turns { display: flex; gap: 6px; }
.docbench.docbench.docbench .db-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; border: 0; background: var(--db-sunk); color: var(--db-ink-2); white-space: nowrap; }
.docbench.docbench.docbench .db-pill .n { font-family: var(--db-font-mono); font-variant-numeric: tabular-nums; }
.docbench.docbench.docbench .db-pill.owner { background: var(--db-wait-soft); color: var(--db-wait); }
.docbench.docbench.docbench .db-pill.assistant { background: var(--db-go-soft); color: var(--db-go); }
.docbench.docbench.docbench .db-toggle { display: none; }

/* ---------- 3단 골격 ---------- */
.docbench.docbench.docbench .db-shell { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: var(--db-rail) minmax(0, 1fr) var(--db-panel); grid-template-rows: minmax(0, 1fr) auto; }
.docbench.docbench.docbench .db-rail { grid-column: 1; grid-row: 1 / span 2; }
.docbench.docbench.docbench .db-main { grid-column: 2; grid-row: 1; }
.docbench.docbench.docbench .db-panel { grid-column: 3; grid-row: 1 / span 2; }
.docbench.docbench.docbench .db-dock { grid-column: 2; grid-row: 2; }
.docbench.docbench.docbench .db-rail, .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-panel { min-height: 0; overflow: auto; overscroll-behavior: contain; }
.docbench.docbench.docbench .db-rail { background: var(--db-surface); border-right: 1px solid var(--db-line); padding: 12px 10px 40px; }
.docbench.docbench.docbench .db-panel { background: var(--db-surface); border-left: 1px solid var(--db-line); display: flex; flex-direction: column; overflow: hidden; }
.docbench.docbench.docbench .db-main { position: relative; padding: 0 16px 120px; scroll-padding-top: 64px; }
.docbench.docbench.docbench .db-page { max-width: calc(74ch + 28px); margin: 0 auto; padding-left: 28px; }
.docbench.docbench.docbench .db-scrim { display: none; }

@container docbench (max-width: 1099px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: var(--db-rail) minmax(0, 1fr); }
  .docbench.docbench.docbench .db-panel { position: absolute; inset: 0 0 0 auto; width: min(var(--db-panel), 100%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(105%); transition: transform .18s; }
  .docbench.docbench.docbench.panel-open .db-panel { transform: none; }
  .docbench.docbench.docbench .db-toggle.panel { display: inline-flex; }
  .docbench.docbench.docbench.panel-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
}
@container docbench (max-width: 760px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: minmax(0, 1fr); }
  .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-dock { grid-column: 1; }
  .docbench.docbench.docbench .db-rail { position: absolute; inset: 0 auto 0 0; width: min(300px, 88%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(-105%); transition: transform .18s; }
  .docbench.docbench.docbench.rail-open .db-rail { transform: none; }
  .docbench.docbench.docbench.rail-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
  .docbench.docbench.docbench .db-toggle.nav { display: inline-flex; }
  .docbench.docbench.docbench .db-brand small, .docbench.docbench.docbench .db-clock.plan, .docbench.docbench.docbench .db-clock .lbl, .docbench.docbench.docbench .db-pill .lbl, .docbench.docbench.docbench .db-bar .db-send, .docbench.docbench.docbench .db-claude .clk { display: none; }
  .docbench.docbench.docbench .db-bar { gap: 6px; padding-inline: 10px; }
  .docbench.docbench.docbench .db-page { padding-left: 4px; }
  .docbench.docbench.docbench .db-main { padding-inline: 16px; }
}
@container docbench (max-width: 460px) {
  .docbench.docbench.docbench .db-brand b { display: none; }
}

/* ---------- 문서 레일 ---------- */
.docbench.docbench.docbench .db-grp { margin-bottom: 12px; }
.docbench.docbench.docbench .db-grp-h { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 4px 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; color: var(--db-ink-3); text-align: left; }
.docbench.docbench.docbench .db-grp-h .car { font-size: 9px; transition: transform .15s; }
.docbench.docbench.docbench .db-grp.closed .db-grp-h .car { transform: rotate(-90deg); }
.docbench.docbench.docbench .db-grp.closed .db-grp-list { display: none; }
.docbench.docbench.docbench .db-grp-note { font-size: 11.5px; color: var(--db-ink-3); padding: 0 8px 4px; line-height: 1.45; }
.docbench.docbench.docbench .db-nav { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; border-radius: 7px; padding: 5px 8px; text-align: left; font-size: 13.5px; color: var(--db-ink-2); line-height: 1.35; }
.docbench.docbench.docbench .db-nav:hover { background: var(--db-sunk); color: var(--db-ink); }
.docbench.docbench.docbench .db-nav[aria-current="page"] { background: var(--db-go-soft); color: var(--db-ink); font-weight: 600; }
.docbench.docbench.docbench .db-nav .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.docbench.docbench.docbench .db-dots { display: flex; gap: 3px; align-items: center; flex: none; }
.docbench.docbench.docbench .db-dot { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font: 500 10.5px/18px var(--db-font-mono); text-align: center; font-variant-numeric: tabular-nums; }
.docbench.docbench.docbench .db-dot.assistant { background: var(--db-go); color: var(--db-go-ink); }
.docbench.docbench.docbench .db-dot.owner { background: var(--db-wait-soft); color: var(--db-wait); }
/* 빈칸 수는 피드백 차례와 헷갈리지 않게 테두리만 */
.docbench.docbench.docbench .db-dot.todo { background: transparent; color: var(--db-ink-3); box-shadow: inset 0 0 0 1px var(--db-line-2); }
.docbench.docbench.docbench .db-dot.chg { background: var(--db-chg-soft); color: var(--db-chg); }
.docbench.docbench.docbench .db-outline { margin: 2px 0 8px 10px; padding-left: 8px; border-left: 1px solid var(--db-line); display: flex; flex-direction: column; }
.docbench.docbench.docbench .db-ol { display: flex; align-items: center; gap: 6px; border: 0; background: none; text-align: left; padding: 3px 6px; border-radius: 6px; font-size: 12.5px; line-height: 1.35; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-ol:hover { background: var(--db-sunk); color: var(--db-ink); }
.docbench.docbench.docbench .db-ol.h3 { padding-left: 18px; font-size: 12px; }
.docbench.docbench.docbench .db-ol.cur { color: var(--db-ink); font-weight: 600; background: var(--db-sunk); }
.docbench.docbench.docbench .db-ol .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docbench.docbench.docbench .db-ol .chg { width: 6px; height: 6px; border-radius: 50%; background: var(--db-chg); flex: none; }
.docbench.docbench.docbench .db-rail-foot { margin-top: 18px; padding: 10px 8px 0; border-top: 1px solid var(--db-line); font-size: 11.5px; color: var(--db-ink-3); line-height: 1.55; display: flex; flex-direction: column; gap: 3px; }
.docbench.docbench.docbench .db-status { display: flex; align-items: center; gap: 6px; }
.docbench.docbench.docbench .db-status i { width: 7px; height: 7px; border-radius: 50%; background: var(--db-ink-3); }
.docbench.docbench.docbench .db-status.live i { background: var(--db-go); }
.docbench.docbench.docbench .db-status.warn i { background: var(--db-wait); }

/* ---------- 문서 머리·도구줄 ---------- */
.docbench.docbench.docbench .db-dochead { padding: 22px 0 12px; }
.docbench.docbench.docbench .db-eyebrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--db-ink-3); margin-bottom: 4px; }
.docbench.docbench.docbench .db-trust { font-size: 11.5px; font-weight: 600; border-radius: 4px; padding: 0 7px; }
.docbench.docbench.docbench .tone-good { background: var(--db-go-soft); color: var(--db-go); }
.docbench.docbench.docbench .tone-info { background: var(--db-info-soft); color: var(--db-info); }
.docbench.docbench.docbench .tone-neutral { background: var(--db-sunk); color: var(--db-ink-2); }
.docbench.docbench.docbench .tone-warn { background: var(--db-wait-soft); color: var(--db-wait); }
.docbench.docbench.docbench .tone-bad { background: var(--db-bad-soft); color: var(--db-bad); }
.docbench.docbench.docbench .tone-accent, .docbench.docbench.docbench .tone-todo { background: var(--db-mark); color: var(--db-mark-ink); }
.docbench.docbench.docbench .db-doctitle { font: 700 25px/1.3 var(--db-font-display); letter-spacing: -.015em; margin: 2px 0 4px; text-wrap: balance; }
.docbench.docbench.docbench .db-docrole { color: var(--db-ink-2); font-size: 14px; margin: 0 0 8px; }
.docbench.docbench.docbench .db-meta { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-meta code { font: 11.5px var(--db-font-mono); color: var(--db-ink-2); background: none; padding: 0; word-break: break-all; }
.docbench.docbench.docbench .db-meta .ok { color: var(--db-go); }
.docbench.docbench.docbench .db-notice { margin: 12px 0 0; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; line-height: 1.55; }
.docbench.docbench.docbench .db-toolbar { position: sticky; top: 0; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 0; margin-bottom: 4px; background: color-mix(in srgb, var(--db-bg) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--db-line); }

.docbench.docbench.docbench .db-chip-s.failed { background: var(--db-bad-soft); color: var(--db-bad); }
.docbench.docbench.docbench .db-runlog-wrap { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--db-line); border-radius: 9px; background: var(--db-bg); overflow: hidden; }
.docbench.docbench.docbench .db-runlog-h { flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 10px; border-bottom: 1px solid var(--db-line); background: var(--db-surface); }
.docbench.docbench.docbench .db-runlog-h:empty { display: none; }
.docbench.docbench.docbench .db-runlog-t { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12.5px; }
.docbench.docbench.docbench .db-run-st { font-size: 11.5px; font-weight: 600; border-radius: 4px; padding: 0 6px; background: var(--db-sunk); color: var(--db-ink-2); }
.docbench.docbench.docbench .db-run-st.running, .docbench.docbench.docbench .db-run-st.queued { background: var(--db-go-soft); color: var(--db-go); }
.docbench.docbench.docbench .db-run-st.done { background: var(--db-go-soft); color: var(--db-go); }
.docbench.docbench.docbench .db-run-st.failed { background: var(--db-bad-soft); color: var(--db-bad); }
.docbench.docbench.docbench .db-run-clock { font: 11.5px var(--db-font-mono); color: var(--db-ink-3); font-variant-numeric: tabular-nums; }
.docbench.docbench.docbench .db-run-phase { font-size: 12px; color: var(--db-go); }
.docbench.docbench.docbench .db-runlog { flex: 1; min-height: 0; overflow: auto; padding: 6px 10px 10px; font-size: 12.5px; line-height: 1.5; display: flex; flex-direction: column; gap: 2px; }
.docbench.docbench.docbench .db-ll { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; color: var(--db-ink-2); }
.docbench.docbench.docbench .db-ll time { flex: none; font: 11px var(--db-font-mono); color: var(--db-ink-3); font-variant-numeric: tabular-nums; }
.docbench.docbench.docbench .db-ll .m { flex: 1; min-width: 0; white-space: pre-wrap; }
.docbench.docbench.docbench .db-ll q { flex-basis: 100%; quotes: none; margin-left: 58px; padding-left: 8px; border-left: 2px solid var(--db-line-2); color: var(--db-ink-2); font-size: 12px; }
.docbench.docbench.docbench .db-ll.say .m { color: var(--db-ink); }
.docbench.docbench.docbench .db-ll.good .m { color: var(--db-go); font-weight: 500; }
.docbench.docbench.docbench .db-ll.accent .m { color: var(--db-chg); font-weight: 500; }
.docbench.docbench.docbench .db-ll.owner .m { color: var(--db-wait); font-weight: 500; }
.docbench.docbench.docbench .db-ll.warn .m { color: var(--db-wait); }
.docbench.docbench.docbench .db-ll.bad .m, .docbench.docbench.docbench .db-ll.error { color: var(--db-bad); }
.docbench.docbench.docbench .db-ll.muted .m { color: var(--db-ink-3); }
.docbench.docbench.docbench .db-ll .db-btn { padding: 0 6px; font-size: 11.5px; }

/* ---------------------------------------------------------------- 문서: 최신 표시 · Claude 처리 중 · 바뀐 글 */
.docbench.docbench.docbench .db-fresh { color: var(--db-ink-3); }
.docbench.docbench.docbench .db-fresh.live { color: var(--db-go); }
.docbench.docbench.docbench .db-refresh { padding: 0 6px; font-size: 11.5px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-refresh:hover { color: var(--db-ink); }
.docbench.docbench.docbench .db-busybar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; padding: 7px 12px; border-radius: 8px; background: var(--db-go-soft); color: var(--db-ink); font-size: 13px; }
.docbench.docbench.docbench .db-banner { justify-content: space-between; }
.docbench.docbench.docbench .db-banner-t { flex: 1 1 100%; min-width: 0; }
.docbench.docbench.docbench .db-banner-t .db-hint { margin-top: 2px; }
.docbench.docbench.docbench .db-banner-a { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.docbench.docbench.docbench .db-banner-a .db-btn svg { width: 12px; height: 12px; }
.docbench.docbench.docbench .db-sec[data-changed="changed"] > .db-sec-head::after, .docbench.docbench.docbench .db-sec[data-changed="new"] > .db-sec-head::after, .docbench.docbench.docbench .db-sec[data-changed="big"] > .db-sec-head::after { content: ""; position: absolute; left: -9px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--db-chg); opacity: .55; }
.docbench.docbench.docbench .db-sec[data-changed] { --chg-bar: 1; }
.docbench.docbench.docbench .db-sec[data-changed="new"] > .db-sec-body, .docbench.docbench.docbench .db-sec[data-changed="big"] > .db-sec-body { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--db-chg) 55%, transparent); padding-left: 10px; margin-left: -13px; }
.docbench.docbench.docbench .db-md ins.db-chg-ins { text-decoration: none; background: color-mix(in srgb, var(--db-go) 22%, transparent); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--db-go) 70%, transparent); border-radius: 2px; color: inherit; }
.docbench.docbench.docbench .db-md del.db-chg-del { text-decoration: line-through; text-decoration-color: var(--db-bad); color: var(--db-bad); background: color-mix(in srgb, var(--db-bad) 10%, transparent); border-radius: 2px; font-size: .92em; margin: 0 .15em; user-select: none; }
.docbench.docbench.docbench .db-md:not(.db-show-chg) ins.db-chg-ins { background: none; box-shadow: none; }
.docbench.docbench.docbench .db-badge.chg { cursor: help; }

/* ---------------------------------------------------------------- 마우스를 올리면: 피드백 미리보기 · 카드 → 본문 밝히기 */
.docbench.docbench.docbench .db-pop { position: absolute; z-index: 30; max-width: calc(100% - 16px); background: var(--db-surface); color: var(--db-ink); border: 1px solid var(--db-line-2); border-radius: 10px; box-shadow: var(--db-shadow); padding: 9px 11px; font-size: 13px; line-height: 1.55; }
.docbench.docbench.docbench .db-pop-b { display: flex; flex-direction: column; gap: 8px; }
.docbench.docbench.docbench .db-pop-fb { display: flex; flex-direction: column; gap: 4px; padding-left: 8px; border-left: 3px solid var(--db-line-2); }
.docbench.docbench.docbench .db-pop-fb.t-assistant { border-left-color: var(--db-go); }
.docbench.docbench.docbench .db-pop-fb.t-owner { border-left-color: var(--db-wait); }
.docbench.docbench.docbench .db-pop-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11.5px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-pop-h .db-turnlbl { margin-left: 0; }
.docbench.docbench.docbench .db-pop-body { white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.docbench.docbench.docbench .db-pop-last { font-size: 12px; color: var(--db-ink-2); background: var(--db-sunk); border-radius: 6px; padding: 3px 7px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.docbench.docbench.docbench .db-pop-last.assistant { background: var(--db-go-soft); }
.docbench.docbench.docbench .db-pop-prop { font-size: 12px; font-weight: 600; color: var(--db-chg); }
.docbench.docbench.docbench .db-pop-q.del { text-decoration: line-through; color: var(--db-bad); white-space: pre-wrap; max-height: 9em; overflow: auto; }
.docbench.docbench.docbench .db-pop-who { font-size: 12.5px; }
.docbench.docbench.docbench mark.db-fbq.hl { background: color-mix(in srgb, var(--db-go) 22%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--db-go) 35%, transparent); border-radius: 2px; }
.docbench.docbench.docbench mark.db-fbq.owner.hl { background: color-mix(in srgb, var(--db-wait) 22%, transparent); }
.docbench.docbench.docbench .db-sec.db-fb-hl > .db-sec-head { background: color-mix(in srgb, var(--db-go-soft) 70%, transparent); border-radius: 6px; }
.docbench.docbench.docbench .db-card[data-id] { transition: box-shadow .12s; }
.docbench.docbench.docbench .db-card[data-id]:hover { box-shadow: 0 0 0 1px var(--db-line-2); }

/* ---------------------------------------------------------------- 단일 HTML: 이름 안내 */
.docbench.docbench.docbench .db-start label.db-start-name { gap: 6px; }

.docbench.docbench.docbench .db-start label .db-start-note { display: block; font-weight: 400; font-size: 13px; line-height: 1.55; color: var(--db-ink); background: var(--db-wait-soft); border-left: 3px solid var(--db-wait); border-radius: 6px; padding: 7px 10px; }
.docbench.docbench.docbench .db-start label .db-start-note b { color: var(--db-ink); font-weight: 650; }
.docbench.docbench.docbench .db-start label .db-start-note small { color: var(--db-ink-2); font-size: 12px; }
.docbench.docbench.docbench .db-railview { margin: 0 8px 8px; display: flex; }
.docbench.docbench.docbench .db-railview button { flex: 1; padding: 2px 8px; font-size: 12px; }

:where(.docbench.docbench.docbench) {
  --db-bg: #f4f6f3; --db-surface: #ffffff; --db-sunk: #eaeee9; --db-line: #d9dfd9; --db-line-2: #c3ccc5;
  --db-ink: #17201b; --db-ink-2: #46514b; --db-ink-3: #6f7a74;
  --db-go: #0b7a57; --db-go-ink: #ffffff; --db-go-soft: #dcefe6;
  --db-wait: #95600c; --db-wait-soft: #fbeed3;
  --db-bad: #b13a33; --db-bad-soft: #f7e2df;
  --db-info: #2d5b88; --db-info-soft: #e1eaf4;
  --db-mark: #ffe58a; --db-mark-ink: #3a2e00;
  --db-chg: #6a4fb3; --db-chg-soft: #ece6fa;
  --db-shadow: 0 1px 2px rgba(23,32,27,.06), 0 8px 24px rgba(23,32,27,.10);
  --db-font-body: "Pretendard", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --db-font-display: var(--db-font-body);
  --db-font-mono: "IBM Plex Mono", "D2Coding", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --db-rail: 260px; --db-panel: 360px; --db-bar: 50px; --db-radius: 8px;
  color-scheme: light;
}
:where(.docbench.docbench.docbench[data-theme="dark"]),
:where(:root[data-theme="dark"] .docbench.docbench.docbench[data-theme="auto"]) {
  --db-bg: #0f1412; --db-surface: #151b18; --db-sunk: #1c2420; --db-line: #28322d; --db-line-2: #38453e;
  --db-ink: #e3eae5; --db-ink-2: #afbab3; --db-ink-3: #85918a;
  --db-go: #3fc597; --db-go-ink: #06140e; --db-go-soft: #163428;
  --db-wait: #e3ab45; --db-wait-soft: #33270e;
  --db-bad: #ef7b73; --db-bad-soft: #3a1e1c;
  --db-info: #80b2e4; --db-info-soft: #17283a;
  --db-mark: #6b5a12; --db-mark-ink: #fff4c7;
  --db-chg: #b8a2f0; --db-chg-soft: #2a2140;
  --db-shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :where(:root:not([data-theme="light"]) .docbench.docbench.docbench[data-theme="auto"]) {
    --db-bg: #0f1412; --db-surface: #151b18; --db-sunk: #1c2420; --db-line: #28322d; --db-line-2: #38453e;
    --db-ink: #e3eae5; --db-ink-2: #afbab3; --db-ink-3: #85918a;
    --db-go: #3fc597; --db-go-ink: #06140e; --db-go-soft: #163428;
    --db-wait: #e3ab45; --db-wait-soft: #33270e;
    --db-bad: #ef7b73; --db-bad-soft: #3a1e1c;
    --db-info: #80b2e4; --db-info-soft: #17283a;
    --db-mark: #6b5a12; --db-mark-ink: #fff4c7;
    --db-chg: #b8a2f0; --db-chg-soft: #2a2140;

    color-scheme: dark;
  }
}

/* ---------- \uD638\uC2A4\uD2B8 CSS \uCC28\uB2E8\uB9C9 ----------
   \uB300\uC2DC\uBCF4\uB4DC \uC804\uC5ED \uADDC\uCE59(header{\u2026}, .card h2{\u2026}, button{\u2026})\uC774 \uC791\uC5C5\uB300 \uC548\uC73C\uB85C \uC0C8\uC9C0 \uC54A\uAC8C \uC548\uCABD \uC694\uC18C\uB97C \uBE0C\uB77C\uC6B0\uC800 \uAE30\uBCF8\uAC12\uC73C\uB85C
   \uB418\uB3CC\uB9B0 \uB4A4 \uC544\uB798 \uADDC\uCE59\uB9CC \uC5B9\uB294\uB2E4. svg\xB7img \uB294 \uC81C\uC678(\uC18D\uC131\uC73C\uB85C \uC900 \uD06C\uAE30\xB7\uC0C9\uAE4C\uC9C0 \uB418\uB3CC\uC544\uAC04\uB2E4). */
.docbench.docbench.docbench :where(header, nav, main, aside, section, article, footer, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, dl, dt, dd, blockquote, pre, code, kbd, table, thead, tbody, tfoot, tr, th, td, caption, button, input, textarea, select, label, dialog, mark, a, b, i, strong, em, del, ins, s, small, sup, sub, hr, details, summary, figure, figcaption) { all: revert; }

/* ---------- \uBC14\uD0D5 ---------- */
.docbench.docbench.docbench { container: docbench / inline-size; position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; min-height: 420px; background: var(--db-bg); color: var(--db-ink); font: 400 15px/1.7 var(--db-font-body); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; text-align: left; outline: none; letter-spacing: normal; word-spacing: normal; text-transform: none; text-indent: 0; text-shadow: none; font-style: normal; white-space: normal; }
.docbench.docbench.docbench *, .docbench.docbench.docbench *::before, .docbench.docbench.docbench *::after { box-sizing: border-box; }
.docbench.docbench.docbench button, .docbench.docbench.docbench input, .docbench.docbench.docbench textarea, .docbench.docbench.docbench select { font: inherit; color: inherit; letter-spacing: normal; }
.docbench.docbench.docbench button { cursor: pointer; }
.docbench.docbench.docbench :focus-visible { outline: 2px solid var(--db-go); outline-offset: 2px; border-radius: 4px; }
.docbench.docbench.docbench a { color: var(--db-info); }
.docbench.docbench.docbench [hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .docbench.docbench.docbench * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.docbench.docbench.docbench .db-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--db-line-2); background: var(--db-surface); border-radius: 7px; padding: 4px 11px; font-size: 13px; font-weight: 500; line-height: 1.35; white-space: nowrap; color: var(--db-ink); }
.docbench.docbench.docbench .db-btn:hover { border-color: var(--db-ink-3); }
.docbench.docbench.docbench .db-btn:disabled { opacity: .5; cursor: default; }
.docbench.docbench.docbench .db-btn.primary { background: var(--db-go); border-color: var(--db-go); color: var(--db-go-ink); }
.docbench.docbench.docbench .db-btn.ghost { border-color: transparent; background: transparent; }
.docbench.docbench.docbench .db-btn.danger { color: var(--db-bad); }
.docbench.docbench.docbench .db-btn.sm { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
.docbench.docbench.docbench .db-btn svg { width: 13px; height: 13px; }
.docbench.docbench.docbench .db-chip { border: 1px solid var(--db-line-2); background: var(--db-surface); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; color: var(--db-ink-2); line-height: 1.6; }
.docbench.docbench.docbench .db-chip[aria-pressed="true"] { background: var(--db-ink); border-color: var(--db-ink); color: var(--db-surface); }
.docbench.docbench.docbench .db-seg { display: inline-flex; border: 1px solid var(--db-line-2); border-radius: 7px; overflow: hidden; }
.docbench.docbench.docbench .db-seg button { border: 0; border-right: 1px solid var(--db-line); background: var(--db-surface); padding: 3px 10px; font-size: 12.5px; color: var(--db-ink-2); }
.docbench.docbench.docbench .db-seg button:last-child { border-right: 0; }
.docbench.docbench.docbench .db-seg button[aria-pressed="true"] { background: var(--db-ink); color: var(--db-surface); font-weight: 600; }
.docbench.docbench.docbench .db-lbl { font-size: 11.5px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-hint { font-size: 12px; color: var(--db-ink-3); }
.docbench.docbench.docbench .db-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- \uC0C1\uB2E8 \uBC14 ---------- */
.docbench.docbench.docbench .db-bar { flex: none; height: var(--db-bar); display: flex; align-items: center; gap: 10px; padding-inline: 14px; background: var(--db-surface); border-bottom: 1px solid var(--db-line); z-index: 5; }
.docbench.docbench.docbench .db-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.docbench.docbench.docbench .db-logo { width: 20px; height: 20px; flex: none; display: grid; gap: 3px; align-content: center; }
.docbench.docbench.docbench .db-logo i { display: block; height: 3px; border-radius: 2px; background: var(--db-ink); }
.docbench.docbench.docbench .db-logo i:nth-child(2) { width: 70%; background: var(--db-go); }
.docbench.docbench.docbench .db-logo i:nth-child(3) { width: 45%; }
.docbench.docbench.docbench .db-brand b { font: 700 15.5px/1.2 var(--db-font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.docbench.docbench.docbench .db-brand small { color: var(--db-ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.docbench.docbench.docbench .db-grow { flex: 1; }
.docbench.docbench.docbench .db-clocks { display: flex; gap: 6px; }
.docbench.docbench.docbench .db-clock { display: inline-flex; align-items: center; gap: 6px; background: var(--db-ink); color: var(--db-surface); border-radius: 6px; padding: 2px 8px 2px 7px; font-size: 11.5px; line-height: 1.25; white-space: nowrap; }
.docbench.docbench.docbench .db-clock .n { font: 500 13.5px/1.2 var(--db-font-mono); font-variant-numeric: tabular-nums; color: var(--db-go-soft); }
.docbench.docbench.docbench .db-clock.plan { background: var(--db-sunk); color: var(--db-ink-2); }
.docbench.docbench.docbench .db-clock.plan .n { color: var(--db-ink); }
.docbench.docbench.docbench .db-turns { display: flex; gap: 6px; }
.docbench.docbench.docbench .db-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; border: 0; background: var(--db-sunk); color: var(--db-ink-2); white-space: nowrap; }
.docbench.docbench.docbench .db-pill .n { font-family: var(--db-font-mono); font-variant-numeric: tabular-nums; }
.docbench.docbench.docbench .db-pill.owner { background: var(--db-wait-soft); color: var(--db-wait); }
.docbench.docbench.docbench .db-pill.assistant { background: var(--db-go-soft); color: var(--db-go); }
.docbench.docbench.docbench .db-toggle { display: none; }

/* ---------- 3\uB2E8 \uACE8\uACA9 ---------- */
.docbench.docbench.docbench .db-shell { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: var(--db-rail) minmax(0, 1fr) var(--db-panel); grid-template-rows: minmax(0, 1fr) auto; }
.docbench.docbench.docbench .db-rail { grid-column: 1; grid-row: 1 / span 2; }
.docbench.docbench.docbench .db-main { grid-column: 2; grid-row: 1; }
.docbench.docbench.docbench .db-panel { grid-column: 3; grid-row: 1 / span 2; }
.docbench.docbench.docbench .db-dock { grid-column: 2; grid-row: 2; }
.docbench.docbench.docbench .db-rail, .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-panel { min-height: 0; overflow: auto; overscroll-behavior: contain; }
.docbench.docbench.docbench .db-rail { background: var(--db-surface); border-right: 1px solid var(--db-line); padding: 12px 10px 40px; }
.docbench.docbench.docbench .db-panel { background: var(--db-surface); border-left: 1px solid var(--db-line); display: flex; flex-direction: column; overflow: hidden; }
.docbench.docbench.docbench .db-main { position: relative; padding: 0 16px 120px; scroll-padding-top: 64px; }
.docbench.docbench.docbench .db-page { max-width: calc(74ch + 28px); margin: 0 auto; padding-left: 28px; }
.docbench.docbench.docbench .db-scrim { display: none; }

@container docbench (max-width: 1099px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: var(--db-rail) minmax(0, 1fr); }
  .docbench.docbench.docbench .db-panel { position: absolute; inset: 0 0 0 auto; width: min(var(--db-panel), 100%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(105%); transition: transform .18s; }
  .docbench.docbench.docbench.panel-open .db-panel { transform: none; }
  .docbench.docbench.docbench .db-toggle.panel { display: inline-flex; }
  .docbench.docbench.docbench.panel-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
}
@container docbench (max-width: 760px) {
  .docbench.docbench.docbench .db-shell { grid-template-columns: minmax(0, 1fr); }
  .docbench.docbench.docbench .db-main, .docbench.docbench.docbench .db-dock { grid-column: 1; }
  .docbench.docbench.docbench .db-rail { position: absolute; inset: 0 auto 0 0; width: min(300px, 88%); z-index: 8; box-shadow: var(--db-shadow); transform: translateX(-105%); transition: transform .18s; }
  .docbench.docbench.docbench.rail-open .db-rail { transform: none; }
  .docbench.docbench.docbench.rail-open .db-scrim { display: block; position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.22); }
  .docbench.docbench.docbench .db-toggle.nav { display: inline-flex; }
  .docbench.docbench.docbench .db-brand small, .docbench.docbench.docbench .db-clock.plan, .docbench.docbench.docbench .db-clock .lbl, .docbench.docbench.docbench .db-pill .lbl, .docbench.docbench.docbench .db-bar .db-send, .docbench.docbench.docbench .db-claude .clk { display: none; }
