<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드 탭 예</title>
<!-- 백엔드(server.mjs)가 앱 주소·열쇠·탭 목록을 여기에 넣는다. 다른 언어의 대시보드도 이 한 줄만 채우면 된다 -->
<script id="docbench-config" type="application/json">"%DOCBENCH_CONFIG%"</script>
<style>
  :root { --bg: #eef1ee; --panel: #fff; --ink: #17201b; --mute: #6f7a74; --line: #d9dfd9; --accent: #1f6f4a; --term: #101512; --term-ink: #c9d6cf; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0f0d; --panel: #121815; --ink: #e4ebe7; --mute: #8d9a93; --line: #26302b; --accent: #5fc394; } }
  :root[data-theme="dark"] { --bg: #0b0f0d; --panel: #121815; --ink: #e4ebe7; --mute: #8d9a93; --line: #26302b; --accent: #5fc394; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header b { font-size: 15px; }
  header .sp { flex: 1; }
  header label { color: var(--mute); font-size: 13px; }
  button { font: inherit; color: inherit; }
  [role="tablist"] { display: flex; gap: 4px; flex-wrap: wrap; }
  [role="tab"] { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  [role="tab"][aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
  .badge { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--panel); font-size: 11px; text-align: center; }
  .badge:empty { display: none; }
  #theme { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  main { display: grid; grid-template-columns: 1fr minmax(240px, 30%); gap: 10px; padding: 10px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .card h2 { margin: 0; padding: 8px 12px; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line); }
  #panes { flex: 1; min-height: 0; position: relative; }
  #panes > div { position: absolute; inset: 0; }
  #panes > p { margin: 24px; color: var(--mute); }
  #term { flex: 1; margin: 0; padding: 12px; background: var(--term); color: var(--term-ink); font: 12px/1.6 ui-monospace, Consolas, "D2Coding", monospace; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 160px; } }
</style>
</head>
<body>
<header>
  <b>운영 대시보드</b><span>· 예제</span>
  <div role="tablist" id="tabs" aria-label="문서 폴더"></div>
  <span class="sp"></span>
  <label><input type="checkbox" id="take" checked> 넘기기를 이 대시보드 터미널로</label>
  <button id="theme" type="button">테마: 자동</button>
</header>
<main>
  <section class="card"><div id="panes"></div></section>
  <section class="card"><h2>터미널 (흉내) — 탭의 이벤트·넘긴 프롬프트가 여기에</h2><pre id="term"></pre></section>
</main>
<script>
  const cfg = JSON.parse(document.getElementById('docbench-config').textContent);
  const term = document.getElementById('term');
  const panes = document.getElementById('panes');
  const tabs = document.getElementById('tabs');
  const log = (s) => { term.textContent += s + '\n'; term.scrollTop = term.scrollHeight; };
  const notice = (s) => { const p = document.createElement('p'); p.textContent = s; panes.replaceChildren(p); };

  /** 탭마다 DocBenchHost.mount(…) 가 돌려준 것 — 처음 열 때 끼우고, 다른 탭으로 가도 남겨 둔다 */
  const benches = new Map();
  let theme = 'auto';

  function select(i) {
    tabs.querySelectorAll('[role="tab"]').forEach((b, j) => b.setAttribute('aria-selected', String(i === j)));
    panes.querySelectorAll(':scope > div').forEach((p, j) => { p.hidden = i !== j; });
    if (benches.has(i)) return;
    const tab = cfg.tabs[i];
    const badge = tabs.children[i].querySelector('.badge');
    benches.set(i, DocBenchHost.mount(panes.children[i], {
      app: cfg.app,            // 앱 주소 (app.json 의 url — 기본 포트가 쓰이고 있으면 바뀐다)
      key: cfg.key,            // 앱 열쇠 (app-token) — 백엔드가 넣었다
      root: tab.root,          // 이 탭이 보여 줄 폴더(전체 경로)
      theme,
      onTodo: (c) => {         // 사람 차례·Claude 차례 수 — 바뀔 때만 온다
        badge.textContent = c.owner + c.assistant || '';
        badge.title = `내 차례 ${c.owner} · Claude 차례 ${c.assistant}`;
      },
      onHandoff: async (req) => {
        // 실제 대시보드: 떠 있는 Claude Code 터미널에 req.prompt 를 밀어 넣는다(Enter 가 필요하면 '\r' 를 붙여)
        if (!document.getElementById('take').checked) return { handled: false };   // → 작업대의 Claude 작업 창이 맡는다
        log(`$ ${req.prompt}`);
        return { handled: true, message: '대시보드 터미널로 보냈습니다' };
      },
      onEvent: (ev) => log(`[${tab.name}] ${ev.type} ${JSON.stringify(ev)}`),   // id·상태만 온다 — 문서·피드백 본문은 없다
    }));
  }

  document.getElementById('theme').onclick = (e) => {
    theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme];
    document.documentElement.dataset.theme = theme;
    e.currentTarget.textContent = '테마: ' + { auto: '자동', light: '밝게', dark: '어둡게' }[theme];
    for (const b of benches.values()) b.setTheme(theme);
  };

  cfg.tabs.forEach((tab, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.title = tab.root;
    b.append(tab.name, Object.assign(document.createElement('span'), { className: 'badge' }));
    b.onclick = () => select(i);
    tabs.append(b);
  });

  if (cfg.problem) log('[docbench] ' + cfg.problem);
  if (!cfg.app || cfg.problem) notice(cfg.problem || 'DocBench 앱을 찾지 못했습니다.');
  else {
    // host.js 는 앱이 내준다(열쇠 없이) — 앱 출처와만 메시지를 주고받는다
    const s = document.createElement('script');
    s.src = cfg.app + 'host.js';
    s.onload = () => {
      cfg.tabs.forEach(() => panes.append(document.createElement('div')));
      select(0);
      log(`[docbench] 앱 ${cfg.version} · ${cfg.app}`);
    };
    s.onerror = () => notice('host.js 를 받지 못했습니다 — ' + cfg.app);
    document.head.append(s);
  }
</script>
</body>
</html>
