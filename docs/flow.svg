<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="13" role="img" aria-label="DocBench 흐름: 브라우저의 사람과 터미널의 Claude Code 가 같은 작업 폴더를 다룬다">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#46514b"/></marker>
    <style>
      .box{fill:#fff;stroke:#c3ccc5;stroke-width:1.2}
      .core{fill:#dcefe6;stroke:#0b7a57;stroke-width:1.4}
      .t{fill:#17201b;font-weight:600}
      .s{fill:#46514b;font-size:11.5px}
      .l{stroke:#46514b;stroke-width:1.3;fill:none}
      .lab{fill:#6f7a74;font-size:11px}
    </style>
  </defs>
  <rect width="860" height="300" fill="#f4f6f3"/>
  <!-- 사람 -->
  <rect class="box" x="20" y="40" width="200" height="96" rx="10"/>
  <text class="t" x="36" y="66">사람 · 브라우저</text>
  <text class="s" x="36" y="88">읽기·접기·초안 모으기</text>
  <text class="s" x="36" y="106">보내기 · 볼 것(확인·되돌리기)</text>
  <text class="s" x="36" y="124">대시보드 패널 또는 단독 화면</text>
  <!-- 서버 -->
  <rect class="box" x="300" y="40" width="220" height="96" rx="10"/>
  <text class="t" x="316" y="66">DocBench 앱 · 서버</text>
  <text class="s" x="316" y="88">REST · SSE · 파일 감시</text>
  <text class="s" x="316" y="106">인코딩·줄바꿈 보존 저장</text>
  <text class="s" x="316" y="124">판 비교(충돌 감지)</text>
  <!-- 작업 폴더 -->
  <rect class="core" x="300" y="178" width="220" height="100" rx="10"/>
  <text class="t" x="316" y="204">작업 폴더 (로컬 드라이브)</text>
  <text class="s" x="316" y="226">*.md — 문서 원본</text>
  <text class="s" x="316" y="244">기록 폴더/feedback/*.json</text>
  <text class="s" x="316" y="262">기록 폴더/changes.jsonl</text>
  <!-- Claude Code -->
  <rect class="box" x="620" y="178" width="220" height="100" rx="10"/>
  <text class="t" x="636" y="204">Claude Code · 터미널</text>
  <text class="s" x="636" y="226">기록 폴더에서 한 줄 (설치 없음)</text>
  <text class="s" x="636" y="244">또는 스킬 + docbench CLI</text>
  <text class="s" x="636" y="262">결과는 사람의 "볼 것"으로</text>
  <!-- claude -p -->
  <rect class="box" x="620" y="40" width="220" height="96" rx="10" stroke-dasharray="4 3"/>
  <text class="t" x="636" y="66">claude -p (헤드리스)</text>
  <text class="s" x="636" y="88">보낸 묶음 · Claude 검토</text>
  <text class="s" x="636" y="106">읽기 도구만 · 문서 폴더 밖</text>
  <text class="s" x="636" y="124">구독 로그인 그대로</text>
  <!-- 선 -->
  <path class="l" d="M220 80H298" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="lab" x="232" y="72">HTTP·SSE</text>
  <path class="l" d="M410 136V176" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="lab" x="418" y="160">읽기·쓰기·감시</text>
  <path class="l" d="M520 228H618" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="lab" x="536" y="220">CLI (서버 없어도)</text>
  <path class="l" d="M520 88H618" marker-end="url(#a)"/>
  <text class="lab" x="532" y="80">보낸 묶음</text>
  <text class="lab" x="20" y="24">사람은 모아 보내고 Claude 의 결과는 "볼 것"에 — 초안·보냄·볼 것·끝남이 피드백마다 기록된다</text>
</svg>
