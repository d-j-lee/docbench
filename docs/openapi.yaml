openapi: 3.1.0
info:
  title: DocBench REST
  version: 0.5.0
  description: |
    화면(createRestAdapters)과 저장소 서버 사이의 계약. 로컬 작업 폴더 서버(server/handler.mjs)가 구현하며,
    사내 백엔드가 같은 계약을 구현하면 화면을 그대로 붙일 수 있다.

    두 갈래
    - 작업 공간(tag workspace): 작업 폴더 하나. docbench serve(/api), 대시보드에 끼우는 처리기(createDocBenchHandler 의 base),
      DocBench 앱의 작업 공간마다 /api/w/{id} — 셋 다 같은 동작이다.
    - DocBench 앱(tag app, server/app.mjs): 이 PC 에 하나 도는 서비스. 작업 공간 목록·폴더 둘러보기·대시보드 끼움(/embed, /host.js).

    공통 규칙
    - 본문 줄바꿈은 항상 LF. 원래 줄바꿈·인코딩 복원은 서버 책임.
    - GET 이 아닌 요청은 `X-DocBench: 1` 헤더 필수(CSRF). 토큰을 쓰면 `Authorization: Bearer <token>`.
    - Host 헤더가 localhost·127.0.0.1·::1(처리기는 allowHosts 도)이 아니면 403 HOST_NOT_ALLOWED (DNS rebinding 방지).
    - 판(version)은 서버가 정하는 불투명 문자열. 같으면 같은 본문.
servers:
  - url: http://127.0.0.1:4317/api
    description: docbench serve — 작업 폴더 하나
  - url: http://127.0.0.1:4317/api/w/{workspace}
    description: DocBench 앱의 작업 공간 하나 — 위와 같은 동작, 앱 열쇠 필수
    variables:
      workspace: { default: '0123456789ab', description: '작업 공간 id — 폴더 경로의 짧은 지문(16진 12자리). GET /api/app/info 의 workspaces[].id' }
tags:
  - name: workspace
    description: 작업 폴더 하나의 문서·피드백·이력·Claude 작업. docbench serve·처리기·앱의 /api/w/{id} 가 같은 것을 내준다.
  - name: app
    description: |
      DocBench 앱(docbench app, D67) — 이 PC 에 하나 도는 서비스. 여러 작업 공간과 그 Claude 작업 엔진(kind app)을 맡는다.
      127.0.0.1 에만 연다(기본 포트 4317, 쓰이고 있으면 다음 자리 — 실제 주소는 docbench app --status).

      열쇠 (D70)
      - 화면 껍데기(/), /host.js, /assets/* 말고는 모두 앱 열쇠가 있어야 한다. 열쇠는 이 PC 의 설정 폴더 app-token 에만 있다(같은 사용자만 읽는다, 한 번 만들면 그대로).
      - API 는 `Authorization: Bearer <열쇠>`, 실시간 연결(EventSource — 헤더를 못 단다)은 `?token=`, 대시보드 iframe 은 `/embed?t=`.
        서버는 셋 중 어디로 와도 받는다.
      - 쿠키는 쓰지 않는다 — 쿠키는 포트를 가리지 않아 127.0.0.1 의 다른 로컬 서버(개발 서버·대시보드)로도 실려 간다.
        화면은 처음 연 주소(/?t=)의 열쇠를 이 출처(포트 포함)의 localStorage 에 두고 주소에서 지운다.
      - 열쇠가 없거나 틀리면 /api/* 는 401 UNAUTHORIZED(JSON), 그 밖의 주소는 여는 방법을 알려 주는 401 HTML.

      그 밖
      - Host 헤더가 localhost·127.0.0.1·::1 이 아니면 모든 주소가 403 HOST_NOT_ALLOWED.
      - /api/app/* 의 GET 이 아닌 요청은 `X-DocBench: 1` 필수(403 CSRF). /api/w/{id}/* 는 작업 공간 계약 그대로.
      - 오류는 { error, message } (AppError). /api/app/* 의 요청 본문은 1 MB 까지.
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: 'docbench serve --token·처리기 token, DocBench 앱은 앱 열쇠' }
    token: { type: apiKey, in: query, name: token, description: '같은 토큰을 주소로 — EventSource(/events)처럼 헤더를 못 달 때' }
    embedKey: { type: apiKey, in: query, name: t, description: 'DocBench 앱 열쇠를 주소로 — 대시보드 iframe(/embed?t=). iframe 을 만든 쪽이 이미 가진 열쇠다' }
  parameters:
    DocId:
      name: id
      in: query
      required: true
      description: 작업 폴더 기준 상대 경로 (예 docs/설계-노트.md)
      schema: { type: string }
  responses:
    AppUnauthorized: { description: 'UNAUTHORIZED — 앱 열쇠가 없거나 틀림', content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } } }
    AppForbidden: { description: 'HOST_NOT_ALLOWED — Host 헤더가 허용 목록에 없음 / CSRF — GET 이 아닌데 X-DocBench: 1 이 없음', content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } } }
  schemas:
    Person:
      type: object
      description: 'id = 계정, name = 표시 이름(별명). 이름을 바꿔도 id 는 그대로라 예전 피드백은 계속 그 사람 것 (D63)'
      properties:
        kind: { enum: [human, assistant, external] }
        id: { type: string }
        name: { type: string }
      required: [kind]
    Manifest:
      type: object
      description: src/types.ts Manifest (schema 2)
      properties:
        schema: { const: 2 }
        project: { type: object, properties: { name: { type: string }, subtitle: { type: string }, links: { type: array }, storage: { type: string, description: '기록(피드백·이력)이 있는 자리 — 화면 아래 "기록: …" (D57)' } } }
        milestones: { type: array }
        trust: { type: object, additionalProperties: true }
        groups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              note: { type: string }
              docs: { type: array, items: { type: string } }
              views: { type: array, items: { enum: [map, changes] } }
              collapsed: { type: boolean }
        docs: { type: object, additionalProperties: { $ref: '#/components/schemas/DocMeta' } }
        render: { type: object }
        assistantName: { type: string }
        folders: { type: object, additionalProperties: { type: object, properties: { files: { type: integer } } }, description: "작업 폴더의 폴더 나무 — 상대 경로('' = 맨 위) → 바로 아래 문서가 아닌 파일 수. 있으면 화면이 탐색기처럼 그린다(선택)" }
        rootName: { type: string, description: 작업 폴더 이름 (선택) }
        index:
          type: object
          description: '문서 목록(docs)을 얼마나 찾았나 (D64, 선택). 열 때 한도(들른 항목 2만·2.5초, 문서 수 maxDocs) 안에서만 찾는다 — 나머지는 GET /tree 로 펼칠 때 목록에 더해진다'
          properties:
            complete: { type: boolean, description: 전부 찾음 }
            docs: { type: integer, description: 지금 목록에 있는 문서 수 }
            reason: { enum: [big-root, many], description: 'big-root = 드라이브·홈처럼 보여 맨 위만 봄, many = 찾다가 한도(시간·개수)에 닿음' }
          required: [complete, docs]
      required: [schema, project, groups, docs]
    TreeEntry:
      type: object
      description: src/types.ts TreeEntry — 폴더 나무의 한 항목
      properties:
        name: { type: string }
        path: { type: string, description: "작업 폴더 기준 '/' 경로" }
        kind: { enum: [dir, file] }
        doc: { type: boolean, description: '작업대가 여는 문서인가 (설정의 include·exclude)' }
        size: { type: integer, description: 바이트 (문서만) }
        modified: { type: string, format: date-time, description: 고친 때 (문서만) }
      required: [name, path, kind]
    DocMeta:
      type: object
      properties:
        title: { type: string }
        role: { type: string }
        audience: { type: string }
        trust: { type: string }
        depth: { type: integer }
        notice: { type: object, properties: { text: { type: string }, tone: { type: string } } }
        source: { type: object }
        readOnly: { type: boolean }
      required: [title]
    DocContent:
      type: object
      properties:
        id: { type: string }
        md: { type: string, description: LF 텍스트 }
        version: { type: string }
        updatedAt: { type: string, format: date-time }
        encoding: { enum: [utf-8, euc-kr, utf-16le, utf-16be] }
        mixedEol: { type: boolean, description: CRLF 와 LF 가 섞인 파일 }
        eol: { enum: [lf, crlf] }
        bom: { type: boolean }
        readOnly: { type: boolean }
        readOnlyReason: { enum: [encoding, invalid-utf8, config], description: 'encoding = 바이트 그대로 다시 쓸 수 없는 인코딩, invalid-utf8 = 깨진 바이트가 섞인 UTF-8' }
      required: [id, md, version]
    Feedback:
      type: object
      description: src/types.ts Feedback. 예전 모양도 받아 normalizeFeedback 으로 맞춘다.
      properties:
        id: { type: string }
        version: { type: integer }
        docId: { type: string }
        target:
          oneOf:
            - { type: object, properties: { kind: { const: doc } } }
            - { type: object, properties: { kind: { const: section }, path: { type: array, items: { type: string } }, heading: { type: string }, occurrence: { type: integer, minimum: 2 } } }
            - { type: object, properties: { kind: { const: item }, itemId: { type: string }, label: { type: string } } }
        selector: { type: object, properties: { exact: { type: string }, prefix: { type: string }, suffix: { type: string } } }
        title: { type: string }
        body: { type: string }
        kind: { type: string }
        severity: { enum: [high, medium, low] }
        status: { enum: [open, resolved, declined] }
        waitingOn: { enum: [owner, assistant] }
        author: { $ref: '#/components/schemas/Person' }
        thread: { type: array, items: { type: object, properties: { author: { $ref: '#/components/schemas/Person' }, text: { type: string }, at: { type: string } } } }
        proposal: { type: object, properties: { path: { type: array, items: { type: string } }, before: { type: string }, after: { type: string }, rationale: { type: string }, author: { $ref: '#/components/schemas/Person' }, at: { type: string }, state: { enum: [pending, applied, rejected] } } }
        wasCollapsed: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    Change:
      type: object
      properties:
        at: { type: string }
        docId: { type: string }
        by: { $ref: '#/components/schemas/Person' }
        summary: { type: string }
        fromVersion: { type: string }
        toVersion: { type: string }
        feedbackIds: { type: array, items: { type: string } }
        sections: { type: array, items: { type: string }, description: 바뀐·새 섹션 키 }
        removed: { type: array, items: { type: string }, description: 없어진 섹션 키 }
    RunStartInput:
      type: object
      properties:
        kind: { enum: [handoff, propose] }
        feedbackIds: { type: array, items: { type: string }, minItems: 1, maxItems: 40, description: propose 는 한 건 }
        model: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._\[\]-]{0,63}$', description: "'opus' 'sonnet' 'haiku' 'fable' 같은 별칭이나 전체 이름. 비우면 Claude Code 기본" }
        effort: { enum: [low, medium, high, xhigh, max] }
        mode: { enum: [auto, propose], description: auto = Claude 가 판단(바로 고치기 포함), propose = 제안만 }
      required: [kind, feedbackIds]
    RunStatus:
      type: object
      description: src/types.ts RunStatus
      properties:
        id: { type: string }
        kind: { enum: [handoff, propose] }
        feedbackIds: { type: array, items: { type: string } }
        model: { type: string }
        effort: { type: string }
        mode: { enum: [auto, propose] }
        runner: { type: string, description: 이 요청을 실행할 엔진 id }
        by: { $ref: '#/components/schemas/Person' }
        at: { type: string }
        state: { enum: [queued, running, done, failed, canceled] }
        startedAt: { type: string }
        endedAt: { type: string }
        progress: { type: object, properties: { phase: { enum: [starting, thinking, reading, writing, applying] }, tokens: { type: integer }, at: { type: string } } }
        summary: { type: object, properties: { edited: { type: integer }, proposed: { type: integer }, answered: { type: integer }, asked: { type: integer }, declined: { type: integer }, skipped: { type: integer }, failed: { type: integer } } }
        docs: { type: array, items: { type: string } }
        error: { type: string }
        usage: { type: object, description: '모델·시간·토큰·(구독) 5시간 한도 몫 — Claude Code 가 알려 준 값' }
      required: [id, kind, feedbackIds, runner, at, state]
    RunLogLine:
      type: object
      properties:
        at: { type: string }
        k: { type: string, description: "화면 사전 run.log.<k> — start safe claude text read search list denied tool toolError output apply.edit apply.propose apply.answer apply.ask apply.decline skip applyFail summary done error canceled timeout warn" }
        v: { type: object }
        text: { type: string, description: Claude 가 쓴 글·회신 }
        ref: { type: object, properties: { docId: { type: string }, feedbackId: { type: string }, section: { type: string } } }
      required: [at, k]
    RunnerInfo:
      type: object
      description: src/types.ts RunnerInfo — Claude 작업 엔진 하나
      properties:
        id: { type: string, description: "'<kind>:<user>@<host>'" }
        kind: { enum: [runner, server, app], description: 'runner = 단일 HTML 용 실행기(폴더 하나), app = 이 PC 의 DocBench 앱(여러 폴더), server = docbench serve·대시보드 처리기' }
        owners: { type: array, items: { type: string }, description: '이 엔진을 "내 것"으로 쓰는 계정 id — 연결 안내의 docbench link --owner 가 이 PC 의 설정에 적는다. 표시 이름이 달라도 잇는다 (D63)' }
        user: { type: string }
        host: { type: string }
        pid: { type: integer }
        version: { type: string }
        protocol: { type: integer }
        startedAt: { type: string }
        seenAt: { type: string }
        claude: { type: object, properties: { ok: { type: boolean }, version: { type: string }, problem: { type: string }, reason: { enum: [no-claude, old-claude, not-logged-in] } }, required: [ok] }
        models: { type: array, items: { type: string } }
        efforts: { type: array, items: { enum: [low, medium, high, xhigh, max] } }
        busy: { type: [string, 'null'], description: 돌고 있는 작업 id }
        queue: { type: integer, description: 줄 선 작업 수 }
      required: [id, kind, user, host, pid, version, protocol, startedAt, seenAt, claude, models, efforts]
    RunsAvailability:
      type: object
      properties:
        available: { type: boolean }
        reason: { enum: [no-runner, not-mine, no-claude, old-claude, not-logged-in, read-only, disabled], description: 'not-mine = 켜진 실행기가 내 것이 아니어서(짝지은 계정 owners 에 없고 이름도 다름) 저절로 고르지 않음(단일 HTML), not-logged-in = Claude Code 에 로그인하지 않음(claude auth status — 구독 로그인 /login)' }
        message: { type: string }
        runner: { $ref: '#/components/schemas/RunnerInfo' }
        others: { type: array, items: { $ref: '#/components/schemas/RunnerInfo' } }
      required: [available]
    Error:
      type: object
      properties:
        error: { enum: [CONFLICT, BUSY, NOT_FOUND, BAD_REQUEST, READ_ONLY, TOO_LARGE, CSRF, UNAUTHORIZED, HOST_NOT_ALLOWED, NO_ASSISTANT, SECTION_MOVED, UNAVAILABLE, INTERNAL] }
        message: { type: string }
        reason: { type: string }
        current: { description: 409 일 때 서버의 현재 값 (DocContent 또는 Feedback) }
    AppError:
      type: object
      description: |
        DocBench 앱 API 의 오류 (server/app.mjs fail). error 에는 오류의 code 가 그대로 실린다:
        400 BAD_REQUEST(상대 경로·열 수 없는 폴더·JSON 아님·본문 1 MB 넘음), 404 NOT_FOUND,
        409 DATA_LOCATION(이 PC 의 설정 파일을 읽지 못해 고치지 않음 — 그 밖의 기록 자리 오류 DATA_MISSING·DATA_CONFLICT·NO_DATA 도 409),
        그 밖은 500(code 가 없으면 INTERNAL). 열쇠·Host·CSRF 는 401 UNAUTHORIZED·403 HOST_NOT_ALLOWED·403 CSRF.
      properties:
        error: { type: string }
        message: { type: string }
      required: [error]
    AppInfo:
      type: object
      properties:
        version: { type: string, description: DocBench 판 }
        me: { $ref: '#/components/schemas/Person' }
        allowOrigins: { type: array, items: { type: string }, description: '/embed 를 끼울 수 있는 대시보드 출처 — docbench app --allow-origin (이 PC 의 설정 app.allowOrigins)' }
        workspaces: { type: array, items: { $ref: '#/components/schemas/AppWorkspace' }, description: 폴더 경로 순 }
      required: [version, me, allowOrigins, workspaces]
    AppWorkspace:
      type: object
      properties:
        id: { type: string, pattern: '^[a-f0-9]{12}$', description: '폴더 경로의 짧은 지문 — 주소(/api/w/{id})에 경로를 싣지 않는다' }
        root: { type: string, description: 문서 폴더 (절대 경로) }
        name: { type: string, description: 폴더 이름 }
        added: { type: boolean, description: '앱에서 더함 (POST /api/app/workspaces — 이 PC 의 설정 workspaces[…].added)' }
        linked: { type: boolean, description: '단일 HTML 의 연결 안내로 이음 (docbench link --owner — 이 PC 의 설정 workspaces[…].owners)' }
        data: { type: object, description: 기록 폴더 (열었을 때만), properties: { mode: { enum: [inside, outside] }, dir: { type: string } } }
        problem: { type: string, description: '열지 못한 까닭(폴더·기록을 못 찾음 등) 또는 Claude 작업 엔진을 켜지 못한 까닭' }
        claude: { $ref: '#/components/schemas/RunsAvailability', description: '이 작업 공간의 Claude 작업 엔진(kind app) — 엔진이 없으면 빠짐. others 는 없다' }
      required: [id, root, name, added, linked]
security:
  - {}
  - bearer: []
  - token: []
paths:
  /session:
    get:
      tags: [workspace]
      summary: 나·권한·켜진 기능
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  me: { $ref: '#/components/schemas/Person' }
                  permissions: { type: array, items: { enum: [doc.edit, feedback.create, feedback.update, feedback.delete, assistant.propose, assistant.notify, assistant.run] } }
                  assistant: { type: [object, 'null'], properties: { name: { type: string } } }
                  notify: { type: [object, 'null'], properties: { label: { type: string } } }
                  identity: { enum: [pc, host], description: '사람이 어디서 왔나. pc = 이 PC 의 로그인 — 화면의 "나"에서 표시 이름을 바꾼다(PUT /me). host 또는 없음 = 대시보드 로그인처럼 호스트가 정한 사람 — 이름 바꾸기를 숨긴다. docbench serve·처리기·앱은 pc' }
                  workspace: { type: object, description: '서버 방식(docbench serve·처리기)만', properties: { root: { type: string, description: 문서 폴더 }, git: { type: boolean }, data: { type: object, properties: { mode: { enum: [inside, outside], description: 'inside = 문서 폴더 안 .docbench, outside = 문서 폴더 밖 기록 폴더(D57)' }, dir: { type: string, description: 기록 폴더 } } } } }
                  features: { type: object, properties: { base: { type: boolean }, versions: { type: boolean }, inventory: { type: boolean }, changes: { type: boolean }, runs: { type: boolean, description: 'Claude 작업(/runs) — 없거나 false 면 화면이 작업 창을 숨긴다. docbench serve 는 기본 켬(--no-claude 로 끔), 대시보드에 끼우는 처리기는 기본 끔(runs: true 로 켬), 앱은 작업 공간의 엔진이 켜졌으면 켬' }, tree: { type: boolean, description: '펼친 폴더만 읽기(GET /tree) — 없거나 false 면 화면이 manifest.docs 로만 목록을 그린다(예전 방식)' } } }
  /me:
    put:
      tags: [workspace]
      summary: 내 표시 이름 바꾸기 (session.identity 가 pc 일 때)
      description: |
        이 PC 의 설정(문서 폴더 밖) name 에 적는다 — 문서 폴더의 config.json 에는 적지 않는다. 계정(id)은 그대로다(D63).
        앞뒤 공백을 떼고 60자에서 자른다. name 이 없거나 비면 지워 로그인 이름으로 돌아간다.
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses:
        '200': { description: 바뀐 나, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
  /manifest:
    get:
      tags: [workspace]
      summary: 문서 목록·그룹·표시 규칙
      description: 작은 폴더면 부를 때마다 다시 훑는다. 큰 폴더(index.complete false)는 감시와 GET /tree 가 목록을 채운다(D64).
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Manifest' } } } } }
  /tree:
    get:
      tags: [workspace]
      summary: 폴더 하나의 항목 — 탐색기처럼 펼친 폴더만 읽는다 (선택 기능 — session.features.tree)
      description: |
        폴더 먼저, 그다음 이름순(숫자는 크기순, 대소문자 무시). 숨김(점으로 시작)·의존성·시스템 폴더와 ~$ 임시 파일, 심볼릭 링크·정션은 뺀다. 한 폴더에 2000개까지.
        여기서 본 문서는 문서 목록(manifest.docs)에도 더한다 — 큰 폴더에서 펼친 폴더의 문서가 목록에 생긴다(D64).
      parameters: [{ name: dir, in: query, description: "작업 폴더 기준 '/' 경로. 비우면 맨 위", schema: { type: string, default: '' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TreeEntry' } } }, required: [items] } } } }
        '404': { description: '없는 폴더·작업 폴더 밖(..·절대 경로·밖을 가리키는 링크) — 둘을 가리지 않는다 (NOT_FOUND)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /doc:
    get:
      tags: [workspace]
      summary: 문서 읽기
      description: 문서 목록에 아직 없는 문서(큰 폴더에서 펼치지 않은 곳)도 경로가 대상이면 읽는다. 처음 읽은 문서부터 판을 적어 그 뒤 바깥 편집을 이력에 남긴다(D64).
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DocContent' } } } }
        '400': { description: 작업 폴더 밖·대상 아님 }
        '404': { description: 없음 }
    put:
      tags: [workspace]
      summary: 문서 저장 (판 비교)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                md: { type: string }
                baseVersion: { type: string, description: 편집을 시작한 판. 다르면 409 }
                summary: { type: string }
                feedbackIds: { type: array, items: { type: string } }
                convertTo: { const: utf-8, description: 레거시 인코딩 파일을 UTF-8 로 바꿔 저장 (사람 동의 후) }
              required: [md]
      responses:
        '200': { description: 저장됨, content: { application/json: { schema: { type: object, properties: { version: { type: string }, updatedAt: { type: string }, unchanged: { type: boolean } } } } } }
        '409': { description: 'CONFLICT 그 사이 바뀜 — current 에 지금 본문 / BUSY 다른 프로세스가 같은 문서를 쓰는 중', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: '읽기 전용 (reason encoding | unrepresentable | invalid-utf8 | config). convertTo utf-8 로 다시 보내면 UTF-8 로 저장', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /doc/version:
    get:
      tags: [workspace]
      summary: 특정 판 본문 (본 적 있는 판만)
      parameters: [{ $ref: '#/components/parameters/DocId' }, { name: v, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: 없음 } }
  /doc/base:
    get:
      tags: [workspace]
      summary: 기준본 (로컬 서버는 git HEAD)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses: { '200': { description: '{ md, label }' }, '404': { description: 없음 } }
  /changes:
    get:
      tags: [workspace]
      summary: 변경 이력 (최근순 아님 — 시간순, 끝이 최신)
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 300 } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Change' } } } } } } } }
  /inventory:
    get:
      tags: [workspace]
      summary: 폴더 지도
      responses: { '200': { description: 'src/types.ts Inventory' } }
  /feedback:
    get:
      tags: [workspace]
      summary: 피드백 전체
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Feedback' } } } } } } } }
    post:
      tags: [workspace]
      summary: 피드백 만들기
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } }
      responses: { '201': { description: 만듦, content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } } }
  /feedback/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[\w.-]{1,120}$' } }]
    patch:
      tags: [workspace]
      summary: 피드백 고치기 (판 비교)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { patch: { type: object }, version: { type: integer } }, required: [patch] } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } }
        '409': { description: 판 다름 — current }
    delete:
      tags: [workspace]
      summary: 지우기
      responses: { '204': { description: 지움 } }
  /viewstate:
    get: { tags: [workspace], summary: 내 보기 상태 (접기·깊이·마지막으로 본 판·고정·최근·펼친 폴더), responses: { '200': { description: 'src/types.ts ViewState(pins·recent·open 포함) 또는 null' } } }
    put: { tags: [workspace], summary: 저장, responses: { '204': { description: OK } } }
  /events:
    get:
      tags: [workspace]
      summary: 변경 알림 (Server-Sent Events)
      description: |
        event 이름 doc | manifest | feedback | changes | request | runs | runner, data 는 { type, id? } JSON.
        runs = Claude 작업의 상태·로그가 바뀜(id = 작업), runner = 엔진이 켜지거나 Claude Code 확인 결과가 바뀜.
        25초마다 주석 줄로 연결 유지. EventSource 는 헤더를 못 달므로 토큰은 ?token=.
      responses: { '200': { description: text/event-stream } }
  /notify:
    post:
      tags: [workspace]
      summary: "AI 에게 넘기기"
      requestBody: { content: { application/json: { schema: { type: object, properties: { count: { type: integer }, docs: { type: array, items: { type: string } }, feedbackIds: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: '{ delivered, queued?, message? } — delivered = 넘기기 명령을 실제로 시작함, queued = 요청함(기록 폴더 inbox/)에 남김, message 가 있으면 화면이 그대로 보여 준다(없으면 화면 문구)' } }
  /assistant/propose:
    post:
      tags: [workspace]
      summary: 섹션 수정 제안 (서버가 AI 호출)
      requestBody: { content: { application/json: { schema: { type: object, properties: { feedbackId: { type: string }, sectionPath: { type: array, items: { type: string } } }, required: [feedbackId] } } } }
      responses:
        '200': { description: '{ after, rationale? }' }
        '400': { description: 섹션 피드백이 아님 }
        '409': { description: 섹션을 찾지 못함 (SECTION_MOVED) }
        '413': { description: 섹션이 6만 자를 넘음 (TOO_LARGE) — 하위 섹션에 피드백을 달 것 }
        '501': { description: AI 연결 없음 (NO_ASSISTANT) }
  /runs/status:
    get:
      tags: [workspace]
      summary: Claude 작업을 띄울 수 있는지 (선택 기능 — session.features.runs)
      description: |
        available 이 false 면 reason: no-claude(claude 를 못 찾음) · old-claude(안전 실행 플래그가 없는 판) · not-logged-in(Claude Code 에 로그인하지 않음) · disabled(서버가 끔·엔진 시작 실패).
        runner 는 이 서버의 엔진(docbench serve·처리기는 kind server, 앱의 /api/w/{id} 는 kind app), others 는 같은 폴더의 다른 실행기(살아 있는 것).
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunsAvailability' } } } } }
  /runs:
    get:
      tags: [workspace]
      summary: 최근 작업 (최근 것 먼저)
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 30 } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RunStatus' } } } } } } } }
    post:
      tags: [workspace]
      summary: 작업 시작 — Claude 차례 피드백을 넘기거나(handoff) 한 건에 제안(propose)
      description: |
        서버가 요청 파일(기록 폴더 runs/<id>.req.json)을 남기고 줄에 세운다. 한 번에 하나씩 돈다.
        Claude 는 문서 폴더 밖에서 --restricted --safe-mode --permission-mode dontAsk --tools Read,Grep,Glob --add-dir <폴더> 로 실행되고,
        반영(고침·제안·회신)은 서버가 판 비교로 한다. 진행은 /runs/{id}/log, 끝나면 SSE runs 이벤트.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RunStartInput' } } }
      responses:
        '202': { description: 줄에 섬, content: { application/json: { schema: { $ref: '#/components/schemas/RunStatus' } } } }
        '400': { description: 잘못된 요청 (kind·피드백·모델 이름·노력) }
        '422': { description: 읽기 전용 작업 폴더 }
        '503': { description: 'UNAVAILABLE — claude 없음·옛 판·로그인 안 됨·엔진 꺼짐 (message)' }
  /runs/{id}/log:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^run-\d{8}-\d{6}-[a-z0-9]{1,8}$' } }]
    get:
      tags: [workspace]
      summary: 작업 로그 — from 바이트부터 완성된 줄만
      parameters: [{ name: from, in: query, schema: { type: integer, default: 0 } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { lines: { type: array, items: { $ref: '#/components/schemas/RunLogLine' } }, next: { type: integer, description: 다음에 줄 from } } } } } } }
  /runs/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [workspace]
      summary: 취소 (줄 서 있으면 빼고, 돌고 있으면 claude 를 멈춘다 — 반영 전이면 아무것도 바꾸지 않는다)
      responses: { '204': { description: OK } }

  # ---------------------------------------------------------------- DocBench 앱 (server/app.mjs, D67·D68·D70)
  # 작업 공간 하나는 /api/w/{id}/… 에 위 계약을 그대로 내준다(servers 의 둘째 주소). 아래는 앱 자체의 주소.
  /api/app/info:
    servers: [{ url: 'http://127.0.0.1:4317', description: DocBench 앱 }]
    get:
      tags: [app]
      summary: 앱 판·나·허용한 대시보드 출처·작업 공간 목록
      description: |
        부를 때 이 PC 의 설정이 바뀌었으면 목록을 다시 맞춘다(새 것은 열고 엔진을 켜고, 빠진 것은 끈다 — 5초마다도).
        목록은 앱에서 더한 것(added)과 단일 HTML 의 연결 안내로 이은 것(linked). 기록 짝(data)만 있는 폴더는 맡지 않는다.
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppInfo' } } } }
        '401': { $ref: '#/components/responses/AppUnauthorized' }
        '403': { $ref: '#/components/responses/AppForbidden' }
  /api/app/browse:
    servers: [{ url: 'http://127.0.0.1:4317', description: DocBench 앱 }]
    get:
      tags: [app]
      summary: 이 PC 의 폴더 둘러보기 — 폴더 이름만 (파일 이름·내용은 주지 않는다)
      description: |
        path 를 비우면 시작점: 드라이브(Windows 는 있는 C:\ … Z:\, 그 밖은 /)·홈·Documents·Desktop·OneDrive(있는 것).
        폴더는 숨김(점으로 시작)·의존성·시스템 폴더를 빼고 이름순, 2000개까지. 파일은 바로 아래 문서(.md·.markdown) 수만 센다.
      security: [{ bearer: [] }]
      parameters: [{ name: path, in: query, description: 폴더의 절대 경로. 비우면 시작점, schema: { type: string, default: '' } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string, description: "본 폴더(절대 경로). 시작점이면 ''" }
                  parent: { type: [string, 'null'], description: "위 폴더. 드라이브 맨 위면 ''(시작점으로), 시작점이면 null" }
                  dirs: { type: array, items: { type: object, properties: { name: { type: string }, path: { type: string, description: 절대 경로 }, kind: { enum: [drive, home, place, dir], description: 'drive·home·place 는 시작점에만' } }, required: [name, path, kind] } }
                  docs: { type: integer, description: 바로 아래 문서 수 (시작점에는 없음) }
                  big: { type: boolean, description: '드라이브·홈처럼 보임 — 더하면 맨 위만 훑고 펼친 폴더만 읽는다(D64). 시작점에는 없음' }
                required: [path, parent, dirs]
        '400': { description: 'BAD_REQUEST — 상대 경로·열 수 없는 폴더(없음·권한)', content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } } }
        '401': { $ref: '#/components/responses/AppUnauthorized' }
  /api/app/workspaces:
    servers: [{ url: 'http://127.0.0.1:4317', description: DocBench 앱 }]
    post:
      tags: [app]
      summary: 폴더를 작업 공간으로 더하기 (D66)
      description: |
        - 앱에 더한 작업 공간이거나 그 안의 폴더면 새로 만들지 않는다 → { id, scope, existing: true }. scope = 그 작업 공간 기준 '/' 경로(같은 폴더면 '').
        - 앱에 더한 작업 공간을 품는 폴더면 merge 없이는 아무것도 바꾸지 않는다 → { needsMerge: [{ id, root, rel }] }.
        - merge: true 면 품은 작업 공간들의 기록(피드백·이력·판·보기 상태·함께 쓰는 설정 — Claude 작업·요청함은 빼고)을 이 폴더의 기록으로 합친다 — 경로 앞에 rel, 같은 것이 있으면 넓은 쪽을 남김,
          하위 기록은 지우지 않고 표식에 mergedInto 를 적는다(밖에 둔 기록). 합친 작업 공간은 목록에서 빠진다 → { id, scope: '', merged: <합친 피드백 수> }.
        - 아니면 새로 더한다(이 PC 의 설정 workspaces[…].added, 기록은 이 PC 의 기록 보관함 — 문서 폴더에는 아무것도 만들지 않는다) → { id, scope: '', merged: 0 }.
        대시보드 끼움(/embed)도 이 요청으로 root 를 연다 — 아직 더하지 않은 폴더면 이때 더해진다.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, description: 폴더의 절대 경로 }
                merge: { type: boolean, description: 품은 작업 공간의 기록을 합친다 }
              required: [path]
      responses:
        '200':
          description: 셋 중 하나
          content:
            application/json:
              schema:
                oneOf:
                  - { type: object, description: 이미 있는 작업 공간(또는 그 안), properties: { id: { type: string }, scope: { type: string }, existing: { const: true } }, required: [id, scope, existing] }
                  - { type: object, description: '합칠지 물어야 함 — 아무것도 바꾸지 않았다', properties: { needsMerge: { type: array, items: { type: object, properties: { id: { type: string }, root: { type: string }, rel: { type: string, description: "이 폴더 기준 '/' 경로" } }, required: [id, root, rel] } } }, required: [needsMerge] }
                  - { type: object, description: '새로 더함 (merge 면 합친 피드백 수)', properties: { id: { type: string }, scope: { const: '' }, merged: { type: integer } }, required: [id, scope, merged] }
        '400': { description: 'BAD_REQUEST — 경로가 없거나 상대 경로', content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } } }
        '401': { $ref: '#/components/responses/AppUnauthorized' }
        '403': { $ref: '#/components/responses/AppForbidden' }
        '404': { description: 'NOT_FOUND — 폴더가 없음', content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } } }
        '409': { description: 'DATA_LOCATION — 이 PC 의 설정 파일을 읽지 못해 고치지 않음', content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } } }
        '500': { description: '작업 공간을 열지 못함 (message 에 까닭 — 기록 보관함 자리가 모두 다른 폴더의 것 등)', content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } } }
  /api/app/workspaces/{id}:
    servers: [{ url: 'http://127.0.0.1:4317', description: DocBench 앱 }]
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{12}$' } }]
    delete:
      tags: [app]
      summary: 앱에서 빼기 — 기록은 그대로
      description: 이 PC 의 설정에서 더한 표시(added)와 이은 계정(owners)을 지우고 그 작업 공간의 엔진을 끈다. 기록과 기록 짝(data)은 남긴다 — CLI·단일 HTML 은 계속 그 기록을 쓴다.
      security: [{ bearer: [] }]
      responses:
        '204': { description: 뺌 }
        '401': { $ref: '#/components/responses/AppUnauthorized' }
        '403': { $ref: '#/components/responses/AppForbidden' }
        '404': { description: 'NOT_FOUND — 목록에 없음', content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } } }
  /api/app/me:
    servers: [{ url: 'http://127.0.0.1:4317', description: DocBench 앱 }]
    put:
      tags: [app]
      summary: 내 표시 이름 바꾸기 — 켜진 모든 작업 공간에 바로
      description: |
        PUT /me 와 같다(이 PC 의 설정 name, 앞뒤 공백을 떼고 60자에서 자름, 비면 지움). 앱의 작업 공간 모두가 설정을 다시 읽는다.
        계정 id 는 이 PC 의 설정 user(없으면 로그인 이름).
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses:
        '200': { description: 바뀐 나, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
        '401': { $ref: '#/components/responses/AppUnauthorized' }
        '403': { $ref: '#/components/responses/AppForbidden' }
        '409': { description: 'DATA_LOCATION — 이 PC 의 설정 파일을 읽지 못해 고치지 않음', content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } } }
  /api/app/shutdown:
    servers: [{ url: 'http://127.0.0.1:4317', description: DocBench 앱 }]
    post:
      tags: [app]
      summary: 앱 끄기 (docbench app --stop, 새 판으로 다시 켤 때)
      description: 먼저 202 로 답하고, 잠시 뒤 작업 공간의 엔진을 모두 끄고 앱 기록 파일(이 PC 의 설정 폴더 app.json)을 지운 뒤 끝난다.
      security: [{ bearer: [] }]
      responses:
        '202': { description: 끄는 중, content: { application/json: { schema: { type: object, properties: { ok: { const: true } } } } } }
        '401': { $ref: '#/components/responses/AppUnauthorized' }
        '403': { $ref: '#/components/responses/AppForbidden' }
  /:
    servers: [{ url: 'http://127.0.0.1:4317', description: DocBench 앱 }]
    get:
      tags: [app]
      summary: 앱 화면 껍데기 — 열쇠 없이 (/index.html 도 같다)
      description: |
        비밀이 없는 HTML(화면은 /assets/app.js·/assets/docbench.css — 이것도 열쇠 없이). 서버는 이 주소에서 열쇠를 보지도 싣지도 않고 쿠키도 남기지 않는다.
        처음 여는 주소 /?t=<열쇠>(docbench app --open·바로가기)의 열쇠는 화면이 이 출처의 localStorage 에 두고 주소에서 지운다(D70). 화면은 그 열쇠로 /api/* 를 부른다.
        끼울 수 없다(CSP frame-ancestors 'none').
      security: [{}]
      parameters:
        - { name: t, in: query, description: '앱 열쇠 — 화면이 읽어 두고 주소에서 지운다', schema: { type: string, pattern: '^[a-f0-9]{32,128}$' } }
        - { name: w, in: query, description: 처음 열 작업 공간 id (없으면 지난번 것), schema: { type: string } }
        - { name: scope, in: query, description: "그 작업 공간에서 이 폴더 아래만 — 작업 공간 기준 '/' 경로", schema: { type: string } }
        - { name: lang, in: query, description: 'ko 로 시작하면 한국어, 아니면 영어 (없으면 브라우저 언어)', schema: { type: string } }
      responses:
        '200': { description: 화면 HTML, content: { text/html: {} } }
        '403': { description: HOST_NOT_ALLOWED }
  /embed:
    servers: [{ url: 'http://127.0.0.1:4317', description: DocBench 앱 }]
    get:
      tags: [app]
      summary: 대시보드 탭에 끼울 화면 (iframe, D68)
      description: |
        보통 /host.js 의 DocBenchHost.mount 가 만든다. 열쇠는 ?t= — 교차 출처 iframe 은 헤더를 달 수 없고, 그 열쇠는 iframe 을 만든 대시보드가 이미 가진 것.
        서버는 그 열쇠와 허용한 출처 목록을 화면에 넣는다(Referrer-Policy no-referrer). CSP frame-ancestors 는 'self' 와 허용한 출처(app.allowOrigins)만 — 다른 출처는 끼우지 못한다.
        화면은 POST /api/app/workspaces { path: root } 로 그 폴더를 열고(합치기가 필요한 넓은 폴더면 안내만) /api/w/{id} 를 쓴다.
        postMessage 는 허용한 출처와만 주고받는다 — 테마·이동·할 일 수·넘기기. 대시보드로 가는 이벤트에는 id·상태만(문서·피드백 본문 없음).
      security: [{ embedKey: [] }]
      parameters:
        - { name: root, in: query, description: 보여 줄 문서 폴더의 절대 경로 (없으면 안내만), schema: { type: string } }
        - { name: scope, in: query, description: "이 폴더 아래만 보인다 — 작업 공간 기준 '/' 경로. root 가 더 넓은 작업 공간 안이면 그 범위 뒤에 붙는다", schema: { type: string } }
        - { name: theme, in: query, description: host.js 가 init 으로 준 값이 먼저, schema: { enum: [auto, light, dark], default: auto } }
        - { name: lang, in: query, description: 'ko 로 시작하면 한국어, 아니면 영어 (없으면 브라우저 언어)', schema: { type: string } }
      responses:
        '200': { description: 화면 HTML, content: { text/html: {} } }
        '401': { description: '열쇠가 없거나 틀림 — 여는 방법을 알려 주는 HTML', content: { text/html: {} } }
        '403': { description: HOST_NOT_ALLOWED }
  /host.js:
    servers: [{ url: 'http://127.0.0.1:4317', description: DocBench 앱 }]
    get:
      tags: [app]
      summary: 대시보드가 실을 다리 스크립트 — 열쇠 없이, CORS *
      description: |
        <script src="http://127.0.0.1:4317/host.js"> 뒤 DocBenchHost.mount(el, { root, key, scope?, theme?, lang?, view?, tokens?, onTodo?, onHandoff?, onEvent? }) —
        /embed?root=…&t=<key> iframe 을 만들고, 앱 출처(이 스크립트를 받은 곳)와만 메시지를 주고받는다. 비밀 없음(Access-Control-Allow-Origin: *).
        대시보드 출처는 먼저 허용해야 끼울 수 있다: docbench app --allow-origin <출처>.
      security: [{}]
      responses:
        '200': { description: 스크립트, content: { text/javascript: {} } }
        '403': { description: HOST_NOT_ALLOWED }
