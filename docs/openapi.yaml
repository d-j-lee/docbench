openapi: 3.1.0
info:
  title: DocBench REST
  version: 0.4.0
  description: |
    화면(createRestAdapters)과 저장소 서버 사이의 계약. 로컬 작업 폴더 서버(server/handler.mjs)가 구현하며,
    사내 백엔드가 같은 계약을 구현하면 화면을 그대로 붙일 수 있다.

    공통 규칙
    - 본문 줄바꿈은 항상 LF. 원래 줄바꿈·인코딩 복원은 서버 책임.
    - GET 이 아닌 요청은 `X-DocBench: 1` 헤더 필수(CSRF). 토큰을 쓰면 `Authorization: Bearer <token>`.
    - 판(version)은 서버가 정하는 불투명 문자열. 같으면 같은 본문.
servers:
  - url: http://127.0.0.1:4317/api
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    DocId:
      name: id
      in: query
      required: true
      description: 작업 폴더 기준 상대 경로 (예 docs/설계-노트.md)
      schema: { type: string }
  schemas:
    Person:
      type: object
      properties:
        kind: { enum: [human, assistant, external] }
        id: { type: string }
        name: { type: string }
      required: [kind]
    Manifest:
      type: object
      description: src/types.ts Manifest (schema 2)
      properties:
        schema: { const: 2 }
        project: { type: object, properties: { name: { type: string }, subtitle: { type: string }, links: { type: array }, storage: { type: string, description: '기록(피드백·이력)이 있는 자리 — 화면 아래 "기록: …" (D57)' } } }
        milestones: { type: array }
        trust: { type: object, additionalProperties: true }
        groups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              note: { type: string }
              docs: { type: array, items: { type: string } }
              views: { type: array, items: { enum: [map, changes] } }
              collapsed: { type: boolean }
        docs: { type: object, additionalProperties: { $ref: '#/components/schemas/DocMeta' } }
        render: { type: object }
        assistantName: { type: string }
        folders: { type: object, additionalProperties: { type: object, properties: { files: { type: integer } } }, description: "작업 폴더의 폴더 나무 — 상대 경로('' = 맨 위) → 바로 아래 문서가 아닌 파일 수. 있으면 화면이 탐색기처럼 그린다(선택)" }
        rootName: { type: string, description: 작업 폴더 이름 (선택) }
      required: [schema, project, groups, docs]
    DocMeta:
      type: object
      properties:
        title: { type: string }
        role: { type: string }
        audience: { type: string }
        trust: { type: string }
        depth: { type: integer }
        notice: { type: object, properties: { text: { type: string }, tone: { type: string } } }
        source: { type: object }
        readOnly: { type: boolean }
      required: [title]
    DocContent:
      type: object
      properties:
        id: { type: string }
        md: { type: string, description: LF 텍스트 }
        version: { type: string }
        updatedAt: { type: string, format: date-time }
        encoding: { enum: [utf-8, euc-kr, utf-16le, utf-16be] }
        mixedEol: { type: boolean, description: CRLF 와 LF 가 섞인 파일 }
        eol: { enum: [lf, crlf] }
        bom: { type: boolean }
        readOnly: { type: boolean }
        readOnlyReason: { enum: [encoding, invalid-utf8, config], description: 'encoding = 바이트 그대로 다시 쓸 수 없는 인코딩, invalid-utf8 = 깨진 바이트가 섞인 UTF-8' }
      required: [id, md, version]
    Feedback:
      type: object
      description: src/types.ts Feedback. 예전 모양도 받아 normalizeFeedback 으로 맞춘다.
      properties:
        id: { type: string }
        version: { type: integer }
        docId: { type: string }
        target:
          oneOf:
            - { type: object, properties: { kind: { const: doc } } }
            - { type: object, properties: { kind: { const: section }, path: { type: array, items: { type: string } }, heading: { type: string }, occurrence: { type: integer, minimum: 2 } } }
            - { type: object, properties: { kind: { const: item }, itemId: { type: string }, label: { type: string } } }
        selector: { type: object, properties: { exact: { type: string }, prefix: { type: string }, suffix: { type: string } } }
        title: { type: string }
        body: { type: string }
        kind: { type: string }
        severity: { enum: [high, medium, low] }
        status: { enum: [open, resolved, declined] }
        waitingOn: { enum: [owner, assistant] }
        author: { $ref: '#/components/schemas/Person' }
        thread: { type: array, items: { type: object, properties: { author: { $ref: '#/components/schemas/Person' }, text: { type: string }, at: { type: string } } } }
        proposal: { type: object, properties: { path: { type: array, items: { type: string } }, before: { type: string }, after: { type: string }, rationale: { type: string }, author: { $ref: '#/components/schemas/Person' }, at: { type: string }, state: { enum: [pending, applied, rejected] } } }
        wasCollapsed: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    Change:
      type: object
      properties:
        at: { type: string }
        docId: { type: string }
        by: { $ref: '#/components/schemas/Person' }
        summary: { type: string }
        fromVersion: { type: string }
        toVersion: { type: string }
        feedbackIds: { type: array, items: { type: string } }
        sections: { type: array, items: { type: string }, description: 바뀐·새 섹션 키 }
        removed: { type: array, items: { type: string }, description: 없어진 섹션 키 }
    RunStartInput:
      type: object
      properties:
        kind: { enum: [handoff, propose] }
        feedbackIds: { type: array, items: { type: string }, minItems: 1, maxItems: 40, description: propose 는 한 건 }
        model: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._\[\]-]{0,63}$', description: "'opus' 'sonnet' 'haiku' 'fable' 같은 별칭이나 전체 이름. 비우면 Claude Code 기본" }
        effort: { enum: [low, medium, high, xhigh, max] }
        mode: { enum: [auto, propose], description: auto = Claude 가 판단(바로 고치기 포함), propose = 제안만 }
      required: [kind, feedbackIds]
    RunStatus:
      type: object
      description: src/types.ts RunStatus
      properties:
        id: { type: string }
        kind: { enum: [handoff, propose] }
        feedbackIds: { type: array, items: { type: string } }
        model: { type: string }
        effort: { type: string }
        mode: { enum: [auto, propose] }
        runner: { type: string, description: 이 요청을 실행할 엔진 id }
        by: { $ref: '#/components/schemas/Person' }
        at: { type: string }
        state: { enum: [queued, running, done, failed, canceled] }
        startedAt: { type: string }
        endedAt: { type: string }
        progress: { type: object, properties: { phase: { enum: [starting, thinking, reading, writing, applying] }, tokens: { type: integer }, at: { type: string } } }
        summary: { type: object, properties: { edited: { type: integer }, proposed: { type: integer }, answered: { type: integer }, asked: { type: integer }, declined: { type: integer }, skipped: { type: integer }, failed: { type: integer } } }
        docs: { type: array, items: { type: string } }
        error: { type: string }
        usage: { type: object, description: '모델·시간·토큰·(구독) 5시간 한도 몫 — Claude Code 가 알려 준 값' }
      required: [id, kind, feedbackIds, runner, at, state]
    RunLogLine:
      type: object
      properties:
        at: { type: string }
        k: { type: string, description: "화면 사전 run.log.<k> — start safe claude text read search list denied tool toolError output apply.edit apply.propose apply.answer apply.ask apply.decline skip applyFail summary done error canceled timeout warn" }
        v: { type: object }
        text: { type: string, description: Claude 가 쓴 글·회신 }
        ref: { type: object, properties: { docId: { type: string }, feedbackId: { type: string }, section: { type: string } } }
      required: [at, k]
    RunsAvailability:
      type: object
      properties:
        available: { type: boolean }
        reason: { enum: [no-runner, not-mine, no-claude, old-claude, read-only, disabled], description: 'not-mine = 켜진 실행기가 내 이름과 달라 저절로 고르지 않음(단일 HTML)' }
        message: { type: string }
        runner: { type: object, description: 'src/types.ts RunnerInfo — id, kind, user, host, claude { ok, version, problem }, models, efforts, busy' }
        others: { type: array, items: { type: object } }
      required: [available]
    Error:
      type: object
      properties:
        error: { enum: [CONFLICT, BUSY, NOT_FOUND, BAD_REQUEST, READ_ONLY, TOO_LARGE, CSRF, UNAUTHORIZED, HOST_NOT_ALLOWED, NO_ASSISTANT, SECTION_MOVED, UNAVAILABLE, INTERNAL] }
        message: { type: string }
        reason: { type: string }
        current: { description: 409 일 때 서버의 현재 값 (DocContent 또는 Feedback) }
security:
  - {}
  - bearer: []
paths:
  /session:
    get:
      summary: 나·권한·켜진 기능
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  me: { $ref: '#/components/schemas/Person' }
                  permissions: { type: array, items: { enum: [doc.edit, feedback.create, feedback.update, feedback.delete, assistant.propose, assistant.notify, assistant.run] } }
                  assistant: { type: [object, 'null'], properties: { name: { type: string } } }
                  notify: { type: [object, 'null'], properties: { label: { type: string } } }
                  workspace: { type: object, description: '서버 방식(docbench serve·처리기)만', properties: { root: { type: string, description: 문서 폴더 }, git: { type: boolean }, data: { type: object, properties: { mode: { enum: [inside, outside], description: 'inside = 문서 폴더 안 .docbench, outside = 문서 폴더 밖 기록 폴더(D57)' }, dir: { type: string, description: 기록 폴더 } } } } }
                  features: { type: object, properties: { base: { type: boolean }, versions: { type: boolean }, inventory: { type: boolean }, changes: { type: boolean }, runs: { type: boolean, description: 'Claude 작업(/runs) — 없거나 false 면 화면이 작업 창을 숨긴다. docbench serve 는 기본 켬(--no-claude 로 끔), 대시보드에 끼우는 처리기는 기본 끔(runs: true 로 켬)' } } }
  /manifest:
    get:
      summary: 문서 목록·그룹·표시 규칙
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Manifest' } } } } }
  /doc:
    get:
      summary: 문서 읽기
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DocContent' } } } }
        '400': { description: 작업 폴더 밖·대상 아님 }
        '404': { description: 없음 }
    put:
      summary: 문서 저장 (판 비교)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                md: { type: string }
                baseVersion: { type: string, description: 편집을 시작한 판. 다르면 409 }
                summary: { type: string }
                feedbackIds: { type: array, items: { type: string } }
                convertTo: { const: utf-8, description: 레거시 인코딩 파일을 UTF-8 로 바꿔 저장 (사람 동의 후) }
              required: [md]
      responses:
        '200': { description: 저장됨, content: { application/json: { schema: { type: object, properties: { version: { type: string }, updatedAt: { type: string }, unchanged: { type: boolean } } } } } }
        '409': { description: 'CONFLICT 그 사이 바뀜 — current 에 지금 본문 / BUSY 다른 프로세스가 같은 문서를 쓰는 중', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: '읽기 전용 (reason encoding | unrepresentable | invalid-utf8 | config). convertTo utf-8 로 다시 보내면 UTF-8 로 저장', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /doc/version:
    get:
      summary: 특정 판 본문 (본 적 있는 판만)
      parameters: [{ $ref: '#/components/parameters/DocId' }, { name: v, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: 없음 } }
  /doc/base:
    get:
      summary: 기준본 (로컬 서버는 git HEAD)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses: { '200': { description: '{ md, label }' }, '404': { description: 없음 } }
  /changes:
    get:
      summary: 변경 이력 (최근순 아님 — 시간순, 끝이 최신)
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 300 } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Change' } } } } } } } }
  /inventory:
    get:
      summary: 폴더 지도
      responses: { '200': { description: 'src/types.ts Inventory' } }
  /feedback:
    get:
      summary: 피드백 전체
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Feedback' } } } } } } } }
    post:
      summary: 피드백 만들기
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } }
      responses: { '201': { description: 만듦, content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } } }
  /feedback/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[\w.-]{1,120}$' } }]
    patch:
      summary: 피드백 고치기 (판 비교)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { patch: { type: object }, version: { type: integer } }, required: [patch] } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } }
        '409': { description: 판 다름 — current }
    delete:
      summary: 지우기
      responses: { '204': { description: 지움 } }
  /viewstate:
    get: { summary: 내 보기 상태 (접기·깊이·마지막으로 본 판), responses: { '200': { description: 'ViewState 또는 null' } } }
    put: { summary: 저장, responses: { '204': { description: OK } } }
  /events:
    get:
      summary: 변경 알림 (Server-Sent Events)
      description: |
        event 이름 doc | manifest | feedback | changes | request | runs | runner, data 는 { type, id? } JSON.
        runs = Claude 작업의 상태·로그가 바뀜(id = 작업), runner = 엔진이 켜지거나 Claude Code 확인 결과가 바뀜.
        25초마다 주석 줄로 연결 유지. EventSource 는 헤더를 못 달므로 토큰은 ?token=.
      responses: { '200': { description: text/event-stream } }
  /notify:
    post:
      summary: "AI 에게 넘기기"
      requestBody: { content: { application/json: { schema: { type: object, properties: { count: { type: integer }, docs: { type: array, items: { type: string } }, feedbackIds: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: '{ delivered, queued?, message? } — delivered = 넘기기 명령을 실제로 시작함, queued = 요청함(.docbench/inbox)에 남김, message 가 있으면 화면이 그대로 보여 준다(없으면 화면 문구)' } }
  /assistant/propose:
    post:
      summary: 섹션 수정 제안 (서버가 AI 호출)
      requestBody: { content: { application/json: { schema: { type: object, properties: { feedbackId: { type: string }, sectionPath: { type: array, items: { type: string } } }, required: [feedbackId] } } } }
      responses:
        '200': { description: '{ after, rationale? }' }
        '400': { description: 섹션 피드백이 아님 }
        '409': { description: 섹션을 찾지 못함 (SECTION_MOVED) }
        '413': { description: 섹션이 6만 자를 넘음 (TOO_LARGE) — 하위 섹션에 피드백을 달 것 }
        '501': { description: AI 연결 없음 (NO_ASSISTANT) }
  /runs/status:
    get:
      summary: Claude 작업을 띄울 수 있는지 (선택 기능 — session.features.runs)
      description: |
        available 이 false 면 reason: no-claude(claude 를 못 찾음) · old-claude(안전 실행 플래그가 없는 판) · disabled(서버가 끔·엔진 시작 실패).
        runner 는 이 서버의 엔진(kind server), others 는 같은 폴더의 다른 실행기(살아 있는 것).
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunsAvailability' } } } } }
  /runs:
    get:
      summary: 최근 작업 (최근 것 먼저)
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 30 } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RunStatus' } } } } } } } }
    post:
      summary: 작업 시작 — Claude 차례 피드백을 넘기거나(handoff) 한 건에 제안(propose)
      description: |
        서버가 요청 파일(.docbench/runs/<id>.req.json)을 남기고 줄에 세운다. 한 번에 하나씩 돈다.
        Claude 는 문서 폴더 밖에서 --restricted --safe-mode --permission-mode dontAsk --tools Read,Grep,Glob --add-dir <폴더> 로 실행되고,
        반영(고침·제안·회신)은 서버가 판 비교로 한다. 진행은 /runs/{id}/log, 끝나면 SSE runs 이벤트.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RunStartInput' } } }
      responses:
        '202': { description: 줄에 섬, content: { application/json: { schema: { $ref: '#/components/schemas/RunStatus' } } } }
        '400': { description: 잘못된 요청 (kind·피드백·모델 이름·노력) }
        '422': { description: 읽기 전용 작업 폴더 }
        '503': { description: 'UNAVAILABLE — claude 없음·옛 판·엔진 꺼짐 (message)' }
  /runs/{id}/log:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^run-\d{8}-\d{6}-[a-z0-9]{1,8}$' } }]
    get:
      summary: 작업 로그 — from 바이트부터 완성된 줄만
      parameters: [{ name: from, in: query, schema: { type: integer, default: 0 } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { lines: { type: array, items: { $ref: '#/components/schemas/RunLogLine' } }, next: { type: integer, description: 다음에 줄 from } } } } } } }
  /runs/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: 취소 (줄 서 있으면 빼고, 돌고 있으면 claude 를 멈춘다 — 반영 전이면 아무것도 바꾸지 않는다)
      responses: { '204': { description: OK } }
