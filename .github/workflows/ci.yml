# 시험과 릴리스.
#  - check   (Linux): npm run check 전부 — 타입·빌드·단위·서버/CLI·브라우저 e2e·배포물 확인
#  - windows (Windows): 타입·단위·서버/CLI — 경로·잠금·감시·claude.cmd 해석을 실제 Windows 에서
#  - release (main 에 새 판이 올라왔을 때): check 가 통과하면 태그 v<판> 과 GitHub Release 를 만들고
#            release/docbench.html·docbench.mjs 를 첨부한다. 본문은 CHANGELOG.md 의 그 판 절.
#            단일 HTML 의 실행기 설치 안내가 이 태그 주소에서 CLI 를 받으므로 판마다 태그가 꼭 있어야 한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  windows:
    name: test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    name: release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 태그 없이 나갔던 지난 판 — 그 커밋의 파일 그대로 Release
        # 0.3.0·0.4.0 은 태그 없이 나갔다(그 판 HTML 의 설치 안내가 v<판> 주소를 담고 있다). 이미 있으면 건너뛴다.
        # 그 커밋의 package.json 판과, HTML 이 담은 CLI 주소·지문이 그 커밋의 docbench.mjs 와 맞을 때만 만든다.
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL: >-
            0.3.0=34f418c187308f0a08f20ecace4768a9cc202399
            0.4.0=5758bd93678e7fb3743bd2d00c25c18bc3e27ad0
        run: |
          for pair in $BACKFILL; do
            V="${pair%%=*}"; SHA="${pair#*=}"
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then continue; fi
            D="$RUNNER_TEMP/v$V"; mkdir -p "$D"
            git show "$SHA:release/docbench.html" > "$D/docbench.html"
            git show "$SHA:release/docbench.mjs" > "$D/docbench.mjs"
            node -e '
              const fs = require("fs"), crypto = require("crypto");
              const [v, d, pkg] = process.argv.slice(1);
              const html = fs.readFileSync(d + "/docbench.html", "utf8");
              const sha = crypto.createHash("sha256").update(fs.readFileSync(d + "/docbench.mjs")).digest("hex");
              if (JSON.parse(pkg).version !== v) throw new Error("그 커밋의 판이 " + v + " 가 아님");
              if (!html.includes("/v" + v + "/release/docbench.mjs") || !html.includes(sha)) throw new Error("HTML 이 v" + v + " 주소·지문을 담지 않음");
            ' "$V" "$D" "$(git show "$SHA:package.json")"
            node scripts/release-notes.mjs "$V" "$D" > "$D/notes.md"
            gh release create "v$V" "$D/docbench.html" "$D/docbench.mjs" --target "$SHA" --title "DocBench $V" --notes-file "$D/notes.md" --latest=false
          done
      - name: 판과 태그
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$V 태그가 이미 있습니다 — 릴리스하지 않습니다."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 태그·Release 만들기
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$V" > "$RUNNER_TEMP/notes.md"
          gh release create "v$V" release/docbench.html release/docbench.mjs \
            --target "$GITHUB_SHA" --title "DocBench $V" --notes-file "$RUNNER_TEMP/notes.md" --latest
